[test-groups]
live-node = { max-threads = 1 }

[[profile.default.overrides]]
filter = 'binary(=bolt_v2) & (test(~bolt_v3_client_registration::tests::) | test(~bolt_v3_live_node::tests::))'
test-group = 'live-node'

[[profile.default.overrides]]
filter = 'binary(=bolt_v3_adapter_mapping) | (binary(=wiring_registration) & test(/^bolt_v3_client_registration::/)) | (binary(=wiring_registration) & test(/^bolt_v3_controlled_connect::/)) | (binary(=wiring_registration) & test(/^bolt_v3_credential_log_suppression::/)) | (binary(=wiring_registration) & test(/^bolt_v3_readiness::/)) | (binary(=wiring_registration) & test(/^bolt_v3_strategy_registration::/)) | (binary(=admission_orders) & test(/^bolt_v3_submit_admission::/)) | binary(=config_parsing) | (binary(=runtime_capture_io) & test(/^lake_batch::/)) | (binary(=runtime_capture_io) & test(/^nt_runtime_capture::/)) | binary(=venue_contract)'
test-group = 'live-node'
