name: Governed sccache setup
description: Configure the governed CI sccache path and fail open to local compiles.

inputs:
  active:
    description: Whether this job has a compile step that can use sccache.
    required: false
    default: "true"
  role-arn:
    description: Read-only AWS role ARN for untrusted sccache consumers.
    required: false
    default: ""
  write-role-arn:
    description: Read/write AWS role ARN for trusted sccache writers.
    required: false
    default: ""
  config-path:
    description: Repository TOML file that owns the expected sccache location.
    required: false
    default: ci/sccache-location.toml
  required:
    description: Fail closed unless the producer receives a verified sccache wrapper.
    required: false
    default: "false"
  operation:
    description: Producer operation identity for strict eligibility.
    required: false
    default: ""
  expected-sha:
    description: Exact requested main SHA for strict eligibility.
    required: false
    default: ""
  checked-out-sha:
    description: Exact checked-out SHA for strict eligibility.
    required: false
    default: ""
  remote-main-sha:
    description: Exact observed remote-main SHA for strict eligibility.
    required: false
    default: ""

outputs:
  enabled:
    description: "true when sccache is installed and its server started."
    value: ${{ steps.enable.outputs.enabled }}
  eligible:
    description: "true when inputs match the governed sccache location."
    value: ${{ steps.eligibility.outputs.eligible }}
  cache-mode:
    description: Cache access mode selected by this action.
    value: ${{ steps.eligibility.outputs.cache_mode }}
  wrapper-path:
    description: Checksum-verified sccache path, empty when unavailable.
    value: ${{ steps.strict.outputs.wrapper_path }}
  config-path:
    description: Resolved repository-owned sccache identity configuration.
    value: ${{ steps.eligibility.outputs.config_path }}

runs:
  using: composite
  steps:
    - name: Resolve sccache eligibility
      id: eligibility
      continue-on-error: true
      shell: bash
      env:
        SCCACHE_ACTIVE: ${{ inputs.active }}
        READ_ROLE_ARN: ${{ inputs.role-arn }}
        WRITE_ROLE_ARN: ${{ inputs.write-role-arn }}
        CONFIG_PATH: ${{ inputs.config-path }}
        SCCACHE_REQUIRED: ${{ inputs.required }}
        SCCACHE_OPERATION: ${{ inputs.operation }}
        SCCACHE_EXPECTED_SHA: ${{ inputs.expected-sha }}
        SCCACHE_CHECKED_OUT_SHA: ${{ inputs.checked-out-sha }}
        SCCACHE_REMOTE_MAIN_SHA: ${{ inputs.remote-main-sha }}
      run: |
        python3.12 scripts/sccache_eligibility.py

    - name: Configure AWS credentials for sccache
      id: aws
      if: steps.eligibility.outputs.eligible == 'true'
      continue-on-error: true
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
      with:
        role-to-assume: ${{ steps.eligibility.outputs.role_arn }}
        aws-region: ${{ steps.eligibility.outputs.region }}

    - name: Install sccache
      id: install
      if: steps.eligibility.outputs.eligible == 'true' && steps.aws.outcome == 'success'
      continue-on-error: true
      uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696
      with:
        version: ${{ steps.eligibility.outputs.installer_version }}
        disable_annotations: "true"

    - name: Require verified producer sccache
      id: strict
      if: inputs.required == 'true'
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        ELIGIBILITY_OUTCOME: ${{ steps.eligibility.outcome }}
        SCCACHE_ELIGIBLE: ${{ steps.eligibility.outputs.eligible || 'false' }}
        AWS_OUTCOME: ${{ steps.aws.outcome || 'skipped' }}
        INSTALL_OUTCOME: ${{ steps.install.outcome || 'skipped' }}
      run: |
        python3.12 scripts/sccache_eligibility.py strict-setup

    - name: Preserve legacy sccache enablement
      id: legacy
      if: inputs.required != 'true'
      continue-on-error: true
      shell: bash
      env:
        SCCACHE_ELIGIBLE: ${{ steps.eligibility.outputs.eligible || 'false' }}
        AWS_OUTCOME: ${{ steps.aws.outcome || 'skipped' }}
        INSTALL_OUTCOME: ${{ steps.install.outcome || 'skipped' }}
      run: |
        python3.12 scripts/sccache_eligibility.py legacy-enable

    - name: Resolve sccache enablement
      id: enable
      if: always()
      shell: bash
      env:
        SCCACHE_REQUIRED: ${{ inputs.required }}
        STRICT_ENABLED: ${{ steps.strict.outputs.enabled || 'false' }}
        LEGACY_ENABLED: ${{ steps.legacy.outputs.enabled || 'false' }}
      run: |
        enabled="$LEGACY_ENABLED"
        if [[ "$SCCACHE_REQUIRED" == "true" ]]; then
          enabled="$STRICT_ENABLED"
        fi
        echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
        echo "sccache enabled=$enabled"

    - name: Summarize sccache state
      if: always()
      shell: bash
      env:
        SCCACHE_ACTIVE: ${{ inputs.active }}
        SCCACHE_ELIGIBLE: ${{ steps.eligibility.outputs.eligible || 'false' }}
        SCCACHE_ENABLED: ${{ steps.enable.outputs.enabled || 'false' }}
        SCCACHE_AWS_OUTCOME: ${{ steps.aws.outcome || 'skipped' }}
        SCCACHE_INSTALL_OUTCOME: ${{ steps.install.outcome || 'skipped' }}
        SCCACHE_STRICT_OUTCOME: ${{ steps.strict.outcome || 'skipped' }}
        SCCACHE_CACHE_MODE: ${{ steps.eligibility.outputs.cache_mode || 'none' }}
      run: |
        echo "sccache cache: active=${SCCACHE_ACTIVE} mode=${SCCACHE_CACHE_MODE} eligible=${SCCACHE_ELIGIBLE} enabled=${SCCACHE_ENABLED} aws=${SCCACHE_AWS_OUTCOME} install=${SCCACHE_INSTALL_OUTCOME} strict=${SCCACHE_STRICT_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
        if [[ "$SCCACHE_ENABLED" != "true" ]]; then
          echo "::notice::sccache cache disabled; compiling without remote cache"
        fi
