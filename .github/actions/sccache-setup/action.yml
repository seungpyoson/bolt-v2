name: Governed sccache setup
description: Configure the governed CI sccache path and fail closed for active compile jobs.

inputs:
  active:
    description: Whether this job has a compile step that can use sccache.
    required: false
    default: "true"
  role-arn:
    description: Read-only AWS role ARN for untrusted sccache consumers.
    required: false
    default: ""
  write-role-arn:
    description: Read/write AWS role ARN for trusted sccache writers.
    required: false
    default: ""
  config-path:
    description: Repository TOML file that owns the expected sccache location.
    required: false
    default: ci/sccache-location.toml

outputs:
  enabled:
    description: "true when sccache is installed and its server started."
    value: ${{ steps.enable.outputs.enabled }}
  eligible:
    description: "true when inputs match the governed sccache location."
    value: ${{ steps.eligibility.outputs.eligible }}
  cache-mode:
    description: Cache access mode selected by this action.
    value: ${{ steps.eligibility.outputs.cache_mode }}
  version:
    description: Governed sccache source version.
    value: ${{ steps.eligibility.outputs.version }}
  source-revision:
    description: Exact governed sccache source revision.
    value: ${{ steps.eligibility.outputs.source_revision }}
  executable-sha256:
    description: Digest of the exact-source executable built for this job.
    value: ${{ steps.install.outputs.executable_sha256 }}

runs:
  using: composite
  steps:
    - name: Resolve sccache eligibility
      id: eligibility
      shell: bash
      env:
        SCCACHE_ACTIVE: ${{ inputs.active }}
        READ_ROLE_ARN: ${{ inputs.role-arn }}
        WRITE_ROLE_ARN: ${{ inputs.write-role-arn }}
        RUNNER_ARCH: ${{ runner.arch }}
        CONFIG_PATH: ${{ inputs.config-path }}
      run: |
        python3.12 scripts/sccache_eligibility.py

    - name: Build exact-source sccache
      id: install
      if: steps.eligibility.outputs.eligible == 'true'
      shell: bash
      env:
        CARGO_FEATURES: ${{ steps.eligibility.outputs.cargo_features }}
        SOURCE_REPOSITORY: ${{ steps.eligibility.outputs.source_repository }}
        SOURCE_REVISION: ${{ steps.eligibility.outputs.source_revision }}
      run: |
        set -euo pipefail
        install_root="$RUNNER_TEMP/governed-sccache"
        CARGO_TARGET_DIR="$RUNNER_TEMP/sccache-source-build-$SOURCE_REVISION" \
          cargo install \
            --git "$SOURCE_REPOSITORY" \
            --rev "$SOURCE_REVISION" \
            --locked \
            --force \
            --root "$install_root" \
            --no-default-features \
            --features "$CARGO_FEATURES" \
            sccache
        executable="$install_root/bin/sccache"
        [[ -f "$executable" && ! -L "$executable" && -x "$executable" ]]
        executable_sha256="$(sha256sum "$executable" | awk '{print $1}')"
        [[ "$executable_sha256" =~ ^[0-9a-f]{64}$ ]]
        echo "executable_sha256=$executable_sha256" >> "$GITHUB_OUTPUT"
        echo "SCCACHE_PATH=$executable" >> "$GITHUB_ENV"
        echo "$install_root/bin" >> "$GITHUB_PATH"

    - name: Configure AWS credentials for sccache
      id: aws
      if: steps.eligibility.outputs.eligible == 'true' && steps.install.outcome == 'success'
      uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b
      with:
        role-to-assume: ${{ steps.eligibility.outputs.role_arn }}
        aws-region: ${{ steps.eligibility.outputs.region }}

    - name: Resolve sccache enablement
      id: enable
      if: always()
      shell: bash
      env:
        SCCACHE_ACTIVE: ${{ inputs.active }}
        EXPECTED_VERSION: ${{ steps.eligibility.outputs.version }}
        EXPECTED_SHA256: ${{ steps.install.outputs.executable_sha256 }}
      run: |
        echo "enabled=false" >> "$GITHUB_OUTPUT"
        if [[ "$SCCACHE_ACTIVE" == "false" ]]; then
          echo "sccache inactive for this non-compile job"
          exit 0
        fi
        if [[ "$SCCACHE_ACTIVE" != "true" ]]; then
          echo "::error::sccache active input must be exactly true or false"
          exit 1
        fi

        if [[ "${{ steps.eligibility.outputs.eligible }}" != "true" ]]; then
          echo "::error::governed sccache eligibility failed for an active compile job"
          exit 1
        fi
        if [[ "${{ steps.aws.outcome }}" != "success" ]]; then
          echo "::error::governed sccache AWS credential setup failed"
          exit 1
        fi
        if [[ "${{ steps.install.outcome }}" != "success" || -z "${SCCACHE_PATH:-}" ]]; then
          echo "::error::governed sccache installation did not provide an executable"
          exit 1
        fi
        if ! python3.12 scripts/sccache_eligibility.py verify-executable \
            "$SCCACHE_PATH" "$EXPECTED_VERSION" "$EXPECTED_SHA256"; then
          echo "::error::governed sccache executable verification failed"
          exit 1
        fi
        if ! "$SCCACHE_PATH" --start-server; then
          echo "::error::governed sccache server startup failed"
          exit 1
        fi
        if ! "$SCCACHE_PATH" --zero-stats; then
          echo "::error::governed sccache stat reset failed"
          exit 1
        fi

        echo "enabled=true" >> "$GITHUB_OUTPUT"
        # Route rustc through sccache while preserving the raw Cargo commands.
        echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
        echo "sccache enabled=true"

    - name: Summarize sccache state
      if: always()
      shell: bash
      env:
        SCCACHE_ACTIVE: ${{ inputs.active }}
        SCCACHE_ELIGIBLE: ${{ steps.eligibility.outputs.eligible || 'false' }}
        SCCACHE_ENABLED: ${{ steps.enable.outputs.enabled || 'false' }}
        SCCACHE_AWS_OUTCOME: ${{ steps.aws.outcome || 'skipped' }}
        SCCACHE_INSTALL_OUTCOME: ${{ steps.install.outcome || 'skipped' }}
        SCCACHE_CACHE_MODE: ${{ steps.eligibility.outputs.cache_mode || 'none' }}
        SCCACHE_SOURCE_REVISION: ${{ steps.eligibility.outputs.source_revision || 'none' }}
      run: |
        echo "sccache cache: active=${SCCACHE_ACTIVE} mode=${SCCACHE_CACHE_MODE} eligible=${SCCACHE_ELIGIBLE} enabled=${SCCACHE_ENABLED} aws=${SCCACHE_AWS_OUTCOME} install=${SCCACHE_INSTALL_OUTCOME} source=${SCCACHE_SOURCE_REVISION}" >> "$GITHUB_STEP_SUMMARY"
        if [[ "$SCCACHE_ACTIVE" == "true" && "$SCCACHE_ENABLED" != "true" ]]; then
          echo "::error::governed sccache setup incomplete; active compile job must stop before Cargo"
        fi
