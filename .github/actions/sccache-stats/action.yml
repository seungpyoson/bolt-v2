name: Governed sccache stats
description: Validate official sccache statistics after a governed compile step.

inputs:
  enabled:
    description: Whether the setup action enabled sccache.
    required: false
    default: "false"
  cache-mode:
    description: Cache access mode selected by the setup action.
    required: false
    default: "none"
  expected-version:
    description: Governed sccache release version selected by the setup action.
    required: false
    default: "none"
  require-compiler-requests:
    description: Fail when enabled sccache observed no compiler requests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Print sccache stats
      shell: bash
      env:
        SCCACHE_ENABLED: ${{ inputs.enabled }}
        SCCACHE_CACHE_MODE: ${{ inputs.cache-mode }}
        EXPECTED_SCCACHE_VERSION: ${{ inputs.expected-version }}
        REQUIRE_COMPILER_REQUESTS: ${{ inputs.require-compiler-requests }}
      run: |
        if [[ "$SCCACHE_ENABLED" == "false" ]]; then
          exit 0
        fi
        if [[ "$SCCACHE_ENABLED" != "true" ]]; then
          echo "::error::sccache enabled input must be exactly true or false"
          exit 1
        fi
        if [[ -z "${SCCACHE_PATH:-}" || ! -x "$SCCACHE_PATH" ]]; then
          echo "::error::sccache was enabled without a usable executable"
          exit 1
        fi

        stats_path="$RUNNER_TEMP/sccache-stats-${GITHUB_JOB}.json"
        if ! "$SCCACHE_PATH" --show-stats --stats-format json > "$stats_path"; then
          echo "::error::official sccache JSON statistics are unavailable"
          exit 1
        fi
        "$GITHUB_WORKSPACE/scripts/sccache_stats_gate.sh" \
          "$stats_path" \
          "$SCCACHE_CACHE_MODE" \
          "$EXPECTED_SCCACHE_VERSION" \
          "$REQUIRE_COMPILER_REQUESTS"
