name: Governed sccache stats
description: Print sccache stats after a compile step when the governed cache is enabled.

inputs:
  enabled:
    description: Whether the setup action enabled sccache.
    required: false
    default: "false"
  require-compiler-requests:
    description: Fail when enabled sccache observed no compiler requests.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    - name: Print sccache stats
      shell: bash
      env:
        SCCACHE_ENABLED: ${{ inputs.enabled }}
        REQUIRE_COMPILER_REQUESTS: ${{ inputs.require-compiler-requests }}
      run: |
        if [[ "$SCCACHE_ENABLED" == "true" ]]; then
          if [[ -z "${SCCACHE_PATH:-}" || ! -x "$SCCACHE_PATH" ]]; then
            if [[ "$REQUIRE_COMPILER_REQUESTS" == "true" ]]; then
              echo "::error::sccache was enabled without a usable executable"
              exit 1
            fi
            echo "::warning::sccache was enabled without a usable executable"
            exit 0
          fi
          if [[ "$REQUIRE_COMPILER_REQUESTS" == "true" ]]; then
            stats_path="$RUNNER_TEMP/sccache-stats-${GITHUB_JOB}.json"
            "$SCCACHE_PATH" --show-stats
            "$SCCACHE_PATH" --show-stats --stats-format json > "$stats_path"
            compile_requests="$(jq -er '.stats.compile_requests' "$stats_path")"
            if (( compile_requests == 0 )); then
              echo "::error::sccache was enabled but observed zero compiler requests"
              exit 1
            fi
          else
            "$SCCACHE_PATH" --show-stats || true
          fi
        fi
