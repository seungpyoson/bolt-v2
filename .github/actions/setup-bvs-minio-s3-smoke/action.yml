name: Setup BVS MinIO S3 Smoke
description: Load the BVS S3 smoke fixture, start MinIO, and wait for readiness.

runs:
  using: composite
  steps:
    - name: Load BVS MinIO S3 smoke config
      id: config
      shell: bash
      run: |
        python3.12 - "$GITHUB_ENV" "$GITHUB_OUTPUT" <<'PY'
        import pathlib
        import sys
        import tomllib
        from urllib.parse import urlparse

        cfg = tomllib.loads(
            pathlib.Path(
                "crates/backtesting-vertical-slice/tests/fixtures/s3_catalog_smoke.toml"
            ).read_text(encoding="utf-8")
        )
        endpoint = urlparse(cfg["store"]["endpoint_url"])
        if not endpoint.hostname or not endpoint.port:
            raise SystemExit("store.endpoint_url must include host and port for CI MinIO")
        lines = {
            cfg["opt_in"]["env_var"]: cfg["opt_in"]["enabled_value"],
            "BVS_MINIO_S3_SMOKE_ENV_VAR": cfg["opt_in"]["env_var"],
            "BVS_MINIO_S3_SMOKE_ENV_VALUE": cfg["opt_in"]["enabled_value"],
            "BVS_MINIO_IMAGE": cfg["ci_minio"]["image"],
            "BVS_MINIO_CONTAINER_NAME": cfg["ci_minio"]["container_name"],
            "BVS_MINIO_CONTAINER_DATA_DIR": cfg["ci_minio"]["container_data_dir"],
            "BVS_MINIO_BIND_HOST": endpoint.hostname,
            "BVS_MINIO_HOST_PORT": str(endpoint.port),
            "BVS_MINIO_API_PORT": str(cfg["ci_minio"]["api_port"]),
            "BVS_MINIO_CONSOLE_PORT": str(cfg["ci_minio"]["console_port"]),
            "BVS_MINIO_HEALTH_URL": (
                cfg["store"]["endpoint_url"].rstrip("/") + cfg["ci_minio"]["health_path"]
            ),
            "BVS_MINIO_READINESS_ATTEMPTS": str(cfg["ci_minio"]["readiness_attempts"]),
            "BVS_MINIO_READINESS_SLEEP_SECONDS": str(
                cfg["ci_minio"]["readiness_sleep_seconds"]
            ),
        }
        with pathlib.Path(sys.argv[1]).open("a", encoding="utf-8") as env_file:
            for key, value in lines.items():
                print(f"{key}={value}", file=env_file)

        credentials = {
            "minio_root_user": cfg["store"]["access_key_id"],
            "minio_root_password": cfg["store"]["secret_access_key"],
        }
        for value in credentials.values():
            print(f"::add-mask::{value}")
        with pathlib.Path(sys.argv[2]).open("a", encoding="utf-8") as output_file:
            for key, value in credentials.items():
                print(f"{key}={value}", file=output_file)
        PY

    - name: Pull BVS MinIO S3 smoke image
      shell: bash
      run: docker pull "$BVS_MINIO_IMAGE"

    - name: Start BVS MinIO S3 smoke container
      shell: bash
      env:
        MINIO_ROOT_USER: ${{ steps.config.outputs.minio_root_user }}
        MINIO_ROOT_PASSWORD: ${{ steps.config.outputs.minio_root_password }}
      run: |
        docker rm -f "$BVS_MINIO_CONTAINER_NAME" >/dev/null 2>&1 || true
        docker run \
          --rm \
          --detach \
          --name "$BVS_MINIO_CONTAINER_NAME" \
          --publish "${BVS_MINIO_BIND_HOST}:${BVS_MINIO_HOST_PORT}:${BVS_MINIO_API_PORT}" \
          --env MINIO_ROOT_USER \
          --env MINIO_ROOT_PASSWORD \
          "$BVS_MINIO_IMAGE" \
          server "$BVS_MINIO_CONTAINER_DATA_DIR" \
          --address ":${BVS_MINIO_API_PORT}" \
          --console-address ":${BVS_MINIO_CONSOLE_PORT}"

    - name: Wait for BVS MinIO S3 smoke service
      shell: bash
      run: |
        for attempt in $(seq 1 "$BVS_MINIO_READINESS_ATTEMPTS"); do
          if curl -fsS "$BVS_MINIO_HEALTH_URL" >/dev/null; then
            echo "BVS MinIO S3 smoke service ready"
            exit 0
          fi
          echo "BVS MinIO S3 smoke service not ready on attempt ${attempt}/${BVS_MINIO_READINESS_ATTEMPTS}"
          sleep "$BVS_MINIO_READINESS_SLEEP_SECONDS"
        done
        echo "BVS MinIO S3 smoke service at ${BVS_MINIO_HEALTH_URL} did not become ready after ${BVS_MINIO_READINESS_ATTEMPTS} attempts" >&2
        exit 1
