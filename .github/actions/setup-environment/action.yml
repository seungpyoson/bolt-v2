name: Setup Environment
description: Install just, resolve shared CI values, and configure the Rust toolchain.

inputs:
  just-version:
    description: Pinned just version to install.
    required: true
  toolchain-components:
    description: Optional Rust components to install.
    required: false
    default: ""
  include-deny-version:
    description: Whether to resolve the pinned cargo-deny version.
    required: false
    default: "false"
  include-nextest-version:
    description: Whether to resolve the pinned cargo-nextest version.
    required: false
    default: "false"
  include-build-values:
    description: Whether to resolve build-only values like target and zig pins.
    required: false
    default: "false"
  use-default-target:
    description: Whether to install the repo's default Rust target from `just target`.
    required: false
    default: "false"
  build-jobs-key:
    description: Optional ci/github-actions-runners.toml cargo_build_jobs key to export as CARGO_BUILD_JOBS.
    required: false
    default: ""

outputs:
  rust_toolchain:
    description: Rust toolchain channel from rust-toolchain.toml.
    value: ${{ steps.shared.outputs.rust_toolchain }}
  deny_version:
    description: Pinned cargo-deny version from the justfile.
    value: ${{ steps.shared.outputs.deny_version }}
  nextest_version:
    description: Pinned cargo-nextest version from the justfile.
    value: ${{ steps.shared.outputs.nextest_version }}
  target:
    description: Pinned build target from the justfile.
    value: ${{ steps.shared.outputs.target }}
  zig_version:
    description: Pinned zig Python package version from the justfile.
    value: ${{ steps.shared.outputs.zig_version }}
  zigbuild_version:
    description: Pinned cargo-zigbuild version from the justfile.
    value: ${{ steps.shared.outputs.zigbuild_version }}
  cargo_build_jobs:
    description: Cargo build job cap resolved from ci/github-actions-runners.toml when build-jobs-key is set.
    value: ${{ steps.shared.outputs.cargo_build_jobs }}

runs:
  using: composite
  steps:
    - name: Install just
      uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
      with:
        tool: just@${{ inputs.just-version }}
        fallback: none

    - name: Read shared values
      id: shared
      shell: bash
      env:
        BUILD_JOBS_KEY: ${{ inputs.build-jobs-key }}
      run: |
        echo "rust_toolchain=$(awk -F'"' '/^channel = / {print $2}' rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
        if [ "${{ inputs.include-deny-version }}" = "true" ]; then
          echo "deny_version=$(just --evaluate deny_version)" >> "$GITHUB_OUTPUT"
        fi
        if [ "${{ inputs.include-nextest-version }}" = "true" ]; then
          echo "nextest_version=$(just --evaluate nextest_version)" >> "$GITHUB_OUTPUT"
        fi
        if [ "${{ inputs.include-build-values }}" = "true" ]; then
          echo "target=$(just --evaluate target)" >> "$GITHUB_OUTPUT"
          echo "zig_version=$(just --evaluate zig_version)" >> "$GITHUB_OUTPUT"
          echo "zigbuild_version=$(just --evaluate zigbuild_version)" >> "$GITHUB_OUTPUT"
        fi
        if [ -n "$BUILD_JOBS_KEY" ]; then
          cargo_build_jobs="$(
            python3 - ci/github-actions-runners.toml "$BUILD_JOBS_KEY" <<'PY'
        import pathlib
        import sys
        import tomllib

        config = tomllib.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
        value = config.get("cargo_build_jobs")
        for part in sys.argv[2].split("."):
            if not isinstance(value, dict) or part not in value:
                raise SystemExit(f"cargo_build_jobs.{sys.argv[2]} missing")
            value = value.get(part)
        if isinstance(value, bool) or not isinstance(value, int) or value <= 0:
            raise SystemExit(f"cargo_build_jobs.{sys.argv[2]} must be a positive integer")
        print(value)
        PY
          )"
          echo "cargo_build_jobs=$cargo_build_jobs" >> "$GITHUB_OUTPUT"
          echo "CARGO_BUILD_JOBS=$cargo_build_jobs" >> "$GITHUB_ENV"
        fi

    - name: Setup Rust toolchain
      if: ${{ inputs.toolchain-components == '' && inputs.use-default-target != 'true' }}
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: ${{ steps.shared.outputs.rust_toolchain }}

    - name: Setup Rust toolchain with components
      if: ${{ inputs.toolchain-components != '' && inputs.use-default-target != 'true' }}
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: ${{ steps.shared.outputs.rust_toolchain }}
        components: ${{ inputs.toolchain-components }}

    - name: Setup Rust toolchain with default target
      if: ${{ inputs.toolchain-components == '' && inputs.use-default-target == 'true' }}
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: ${{ steps.shared.outputs.rust_toolchain }}
        targets: ${{ steps.shared.outputs.target }}

    - name: Setup Rust toolchain with components and default target
      if: ${{ inputs.toolchain-components != '' && inputs.use-default-target == 'true' }}
      uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master
      with:
        toolchain: ${{ steps.shared.outputs.rust_toolchain }}
        components: ${{ inputs.toolchain-components }}
        targets: ${{ steps.shared.outputs.target }}
