# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # See #155: our transitive graph (alloy, k256, ed25519-dalek, nautilus-*)
    # is still on hmac 0.12 / sha2 0.10. Accepting 0.13 / 0.11 would force a
    # dual-major build. Remove these ignores when upstream converges; see the
    # "Revisit Conditions" in #155.
    ignore:
      - dependency-name: "hmac"
        versions: [">=0.13"]
      - dependency-name: "sha2"
        versions: [">=0.11"]
      # NT pin movement is owned by the Bolt-v3 NT scout/pointer-bump lane (#281/#282).
      # Keep direct NautilusTrader crate updates out of Dependabot entirely.
      - dependency-name: "nautilus-*"
    groups:
      cargo-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    # Wait for the wider community to surface compromised releases before
    # adopting them. The tj-actions/changed-files attack (CVE-2025-30066,
    # March 2025) was detected within ~48 hours of the malicious push; a
    # one-week cooldown means our linter's format check + PR review are
    # operating on releases that already survived public scrutiny. Cooldown
    # applies to version updates only — security updates bypass it.
    cooldown:
      semver-major-days: 14
      semver-minor-days: 7
      semver-patch-days: 7
    groups:
      action-dependencies:
        patterns:
          - "*"
