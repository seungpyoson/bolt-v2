name: actionlint

# Lints all GitHub Actions workflow files (schema + shellcheck on run: blocks)
# on every PR and push to main, failing the job on error-level findings.
# Guards against the class of bug in #410, where an invalid workflow merged
# and silently never ran.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: >-
    actionlint-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || format('{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # reporter=local prints findings to the job log; the job's exit code
          # (governed by fail_level below) is the gate. We avoid github-check /
          # github-pr-check: in our run (commit 8624b66c, at the action's
          # default level: error) those posted a check-run whose conclusion was
          # `failure` on an info-level finding (the intentional SC2016 in
          # summary.yml) even though fail_level=error left the job step green —
          # the check-run conclusion tracks whether any annotation was posted,
          # not the reviewdog exit code. (level: error was already the strictest
          # report level, so no level tweak rescues the github-check variant.)
          reporter: local
          # nofilter: lint every finding in every workflow file, not just lines
          # in the PR diff. reviewdog's default (file) and `added` would let a
          # structural error anchored away from an edited line (the #410 class)
          # slip past. fail_level then exits non-zero only on error-level
          # findings, so info/warning notes are logged without failing the gate.
          filter_mode: nofilter
          fail_level: error
