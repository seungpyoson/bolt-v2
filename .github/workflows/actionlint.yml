name: actionlint

# Lints all GitHub Actions workflow files (schema + shellcheck on run: blocks)
# on every PR and push to main, failing the job on error-level findings.
# Guards against the class of bug in #410, where an invalid workflow merged
# and silently never ran.

on:
  # Manual lane: GitHub Actions does not deliver pull_request events for PRs
  # whose diff exceeds its internal size limit (observed at ~28k files on #610),
  # so oversized PRs need a manually dispatched run against the branch ref.
  workflow_dispatch:
  pull_request:
    branches: [main]
    # Explicit types are required because the default set (opened, synchronize,
    # reopened) does not fire when a PR is moved from draft to ready
    # (ready_for_review) or retargeted to main (edited). Both transitions were
    # observed on #757 and left this merge gate unmet.
    # Note: GitHub's edited event fires on ANY PR edit (title, body, base ref),
    # not only retargets, so this also re-runs actionlint on every title/body
    # edit. We accept that cost because there is no narrower event for base-ref
    # changes.
    # Note: ci.yml includes converted_to_draft because it defers some lanes when
    # a PR is in draft. actionlint has no draft-deferral path, so we deliberately
    # omit converted_to_draft.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  push:
    branches: [main]
  # Merge queue lane: actionlint is a required check, so it must report on the
  # merge_group/checks_requested event or the merge is blocked. The job needs no
  # PR context. github.event.number is empty on merge_group, so the concurrency
  # group keys on github.ref instead.
  merge_group:
    types: [checks_requested]

concurrency:
  group: >-
    actionlint-${{ github.event_name == 'pull_request'
        && (startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')
            || startsWith(github.event.pull_request.head.ref, 'tmp-mergify/merge-queue/'))
        && format('pr-{0}-mergify-proof-{1}', github.event.number, github.event.pull_request.head.sha)
        || github.event_name == 'pull_request'
        && format('pr-{0}', github.event.number)
        || github.event_name == 'merge_group'
        && format('mq-{0}', github.ref)
        || format('{0}-{1}', github.ref_name, github.sha) }}
  # cancel-in-progress is true only for ordinary PR runs; merge_group and Mergify
  # proof PR validations must never be cancelled.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && !(startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')
             || startsWith(github.event.pull_request.head.ref, 'tmp-mergify/merge-queue/')) }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify AI review governance and storage audit safety tests
        run: |
          python3 scripts/verify_ai_review_governance.py --self-test
          python3 scripts/verify_ai_review_governance.py
          python3 scripts/verify_ai_review_model_freshness.py --self-test
          python3 scripts/verify_ai_review_model_freshness.py
          python3 scripts/test_ai_review_glm_fallback.py
          python3 scripts/test_ci_storage_audit.py
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          # reporter=local keeps "actionlint" as the real merge gate without a
          # separate reviewdog check-run. The prior github-check sidecar could
          # fail the whole job when GitHub's Checks API rejected the token even
          # though actionlint itself was clean.
          reporter: local
          # level: warning keeps warning/info findings visible in the job log.
          # fail_level below still exits non-zero only on error-level findings
          # (the #410 class).
          level: warning
          # nofilter: lint every finding in every workflow file, not just lines
          # in the PR diff. reviewdog's default (file) and `added` would let a
          # structural error anchored away from an edited line (the #410 class)
          # slip past. fail_level then exits non-zero only on error-level
          # findings, so info/warning notes are logged without failing the job.
          filter_mode: nofilter
          fail_level: error
