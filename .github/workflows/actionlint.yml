name: actionlint

# Lints all GitHub Actions workflow files (schema + shellcheck on run: blocks)
# on every PR and push to main, failing the job on error-level findings.
# Guards against the class of bug in #410, where an invalid workflow merged
# and silently never ran.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: >-
    actionlint-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || format('{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # reporter=local prints findings to the job log; the job's exit code
          # (governed by fail_level below) is the single gate. We chose it over
          # github-check to keep contents:read-only (no checks: write), avoid a
          # second separately-concluded check-run, and behave identically on
          # fork PRs. Trade-off: no inline PR annotations.
          #
          # A github-check variant also works and would keep annotations: with
          # level: warning, reviewdog's conclusion() returns `neutral` (accepted
          # by required checks) while fail_level=error still fails the job only
          # on errors. We saw the action's *default* level: error instead post a
          # `failure` conclusion on the intentional info-level SC2016 at commit
          # 8624b66c (the job step stayed green). So local is a deliberate
          # trade-off, not the only workable config.
          reporter: local
          # nofilter: lint every finding in every workflow file, not just lines
          # in the PR diff. reviewdog's default (file) and `added` would let a
          # structural error anchored away from an edited line (the #410 class)
          # slip past. fail_level then exits non-zero only on error-level
          # findings, so info/warning notes are logged without failing the gate.
          filter_mode: nofilter
          fail_level: error
