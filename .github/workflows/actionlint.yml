name: actionlint

# Lints all GitHub Actions workflow files (schema + shellcheck on run: blocks)
# on every PR and push to main, failing the job on error-level findings.
# Guards against the class of bug in #410, where an invalid workflow merged
# and silently never ran.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: >-
    actionlint-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || format('{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          # reporter=local keeps "actionlint" as the real merge gate without a
          # separate reviewdog check-run. The prior github-check sidecar could
          # fail the whole job when GitHub's Checks API rejected the token even
          # though actionlint itself was clean.
          reporter: local
          # level: warning keeps warning/info findings visible in the job log.
          # fail_level below still exits non-zero only on error-level findings
          # (the #410 class).
          level: warning
          # nofilter: lint every finding in every workflow file, not just lines
          # in the PR diff. reviewdog's default (file) and `added` would let a
          # structural error anchored away from an edited line (the #410 class)
          # slip past. fail_level then exits non-zero only on error-level
          # findings, so info/warning notes are logged without failing the job.
          filter_mode: nofilter
          fail_level: error
