name: actionlint

# Lints all GitHub Actions workflow files (schema + shellcheck on run: blocks)
# on every PR and push to main, failing on findings. Guards against the class
# of bug in #410, where an invalid workflow merged and silently never ran.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: >-
    actionlint-${{ github.event_name == 'pull_request'
      && format('pr-{0}', github.event.number)
      || format('{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  checks: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          fail_level: error
