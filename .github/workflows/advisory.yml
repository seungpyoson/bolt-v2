name: Advisory Check

on:
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: jules-pr-state-probe-20260628194316
  cancel-in-progress: false

jobs:
  jules-pr-state-probe:
    name: jules-pr-state-probe
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - name: Start Jules PR state probe
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_STARTING_BRANCH: ${{ github.ref_name }}
          JULES_PROBE_TOKEN: jules-pr-state-probe-20260628194316
          JULES_PROMPT: |
            This is a controlled pull-request state probe for seungpyoson/bolt-v2.
            Create one pull request against the starting branch for this session.
            Make exactly one repository change: add docs/jules-pr-state-probe-20260628194316.md.
            The file content must be exactly:
            jules-pr-state-probe-20260628194316
            Pull request title must be exactly: Jules PR state probe jules-pr-state-probe-20260628194316
            Pull request body must include: Probe token: jules-pr-state-probe-20260628194316
            Do not modify any other file.
            Do not run Rust builds, live jobs, AWS, market data, deployment, trading, or order execution.
        run: |
          set -euo pipefail
          jq -n \
            --arg repo_full_name "$GITHUB_REPOSITORY" \
            --arg branch "$JULES_STARTING_BRANCH" \
            --arg prompt "$JULES_PROMPT" \
            '{
              prompt: $prompt,
              sourceContext: {
                source: "sources/github/\($repo_full_name)",
                githubRepoContext: {
                  startingBranch: $branch
                }
              },
              automationMode: "AUTO_CREATE_PR",
              requirePlanApproval: false
            }' > "$RUNNER_TEMP/jules_payload.json"

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-goog-api-key: ${JULES_API_KEY}" \
            --data @"$RUNNER_TEMP/jules_payload.json" \
            --output "$RUNNER_TEMP/jules_response.json" \
            "https://jules.googleapis.com/v1alpha/sessions"

          jq -e '.name and .id' "$RUNNER_TEMP/jules_response.json" >/dev/null
          jq -r '"session_name=" + .name, "session_id=" + .id, "session_url=" + (.url // "")' "$RUNNER_TEMP/jules_response.json"
