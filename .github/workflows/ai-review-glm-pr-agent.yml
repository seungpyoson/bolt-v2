name: AI Review - GLM PR-Agent

on:
  pull_request:
    branches: [main]
    types: [ready_for_review, labeled]

concurrency:
  group: ai-review-glm-pr-agent-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write # PR-Agent may publish top-level PR conversation comments via the Issues API.
  pull-requests: write

jobs:
  glm-pr-agent-review:
    name: GLM PR-Agent review
    if: >-
      ${{
        github.event.pull_request.draft == false
        && github.event.pull_request.head.repo.full_name == github.repository
        && (
          github.event.action == 'ready_for_review'
          || github.event.label.name == 'ai-review'
          || github.event.label.name == 'ai-review-glm'
        )
      }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: 35
    env:
      GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - name: Notice when Z.ai secret is not configured
        if: env.GLM_API_KEY == ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notice_file="${RUNNER_TEMP}/glm-ai-review-notice.md"
          cat > "$notice_file" <<EOF
          ## GLM review notice

          \`GLM_API_KEY\` is not configured, so the GLM review was skipped.

          - PR: #${PR_NUMBER}
          - Action run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This advisory review is non-blocking, but the missing AI deliverable should not be treated as review evidence.
          EOF
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$notice_file"

      - name: Checkout base AI review helpers
        if: env.GLM_API_KEY != ''
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.event.pull_request.base.sha }}
          sparse-checkout: |
            .pr_agent.toml
            scripts/ai_review_deliverables.py
          sparse-checkout-cone-mode: false

      - name: Capture GLM review window
        id: review-window
        if: env.GLM_API_KEY != ''
        run: echo "started_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run PR-Agent review with GLM
        id: pr-agent
        if: env.GLM_API_KEY != ''
        continue-on-error: true
        timeout-minutes: 8
        uses: the-pr-agent/pr-agent@49cb2d8ce4a6f01c238229b3770e328fe11479df # v0.34.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENAI__API_BASE: https://api.z.ai/api/paas/v4
          OPENAI__KEY: ${{ env.GLM_API_KEY }}
          OPENAI_KEY: ${{ env.GLM_API_KEY }}
          config.model: openai/glm-5.2
          config.fallback_models: '["openai/glm-5.2"]'
          config.custom_model_max_tokens: "128000"
          config.large_patch_policy: clip
          config.ai_timeout: "300"
          github_action_config.auto_review: "true"
          github_action_config.auto_describe: "false"
          github_action_config.auto_improve: "false"

      - name: Ensure GLM deliverable or post split fallback
        id: glm_fallback
        if: env.GLM_API_KEY != ''
        timeout-minutes: 20
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GLM_API_BASE: https://api.z.ai/api/paas/v4
          GLM_MODEL: glm-5.2
          GLM_REVIEW_MAX_CHUNK_CHARS: "60000"
          AI_REVIEW_MAX_COMMENT_CHARS: "60000"
        run: >-
          python3 scripts/ai_review_deliverables.py glm-fallback
          --started-at "${{ steps.review-window.outputs.started_at }}"
          --instructions-file .pr_agent.toml

      - name: Post GLM fallback infrastructure failure notice
        if: >-
          ${{
            env.GLM_API_KEY != ''
            && failure()
            && steps.glm_fallback.outcome == 'failure'
            && steps.glm_fallback.outputs.failure_notice_posted != 'true'
          }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          notice_file="${RUNNER_TEMP}/glm-ai-review-notice.md"
          cat > "$notice_file" <<EOF
          ## GLM review notice

          The GLM fallback step failed or timed out before posting a usable failure notice. Check the action logs for this run.

          - PR: #${PR_NUMBER}
          - Action run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          This advisory review is non-blocking, but the missing AI deliverable should not be treated as review evidence.
          EOF
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$notice_file"
