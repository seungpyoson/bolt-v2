name: AI review model freshness

on:
  workflow_dispatch:
  schedule:
    - cron: "17 8 * * 1"

concurrency:
  group: ai-review-model-freshness-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  model-freshness:
    name: model freshness
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Verify AI review model freshness
        env:
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/verify_ai_review_model_freshness.py --self-test
          python3 scripts/verify_ai_review_model_freshness.py --live --advisory --github-notice
