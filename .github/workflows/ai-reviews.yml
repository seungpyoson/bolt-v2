name: AI Reviews

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ai-reviews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  prepare:
    if: ${{ vars['AI_REVIEWS_ENABLED'] == 'true' }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    outputs:
      base_sha: ${{ steps.input.outputs.base_sha }}
      head_sha: ${{ steps.input.outputs.head_sha }}
      pr_number: ${{ steps.input.outputs.pr_number }}
      reviews: ${{ steps.input.outputs.reviews }}
      review_timeout: ${{ steps.input.outputs.review_timeout }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture immutable review input
        id: input
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          base_sha="$(jq -r .base.sha <<<"$payload")"
          head_sha="$(jq -r .head.sha <<<"$payload")"
          test "$base_sha" = "$EVENT_BASE_SHA"
          test "$head_sha" = "$EVENT_HEAD_SHA"
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p .ai-review/input
          gh api "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${head_sha}" \
            -H "Accept: application/vnd.github.diff" > .ai-review/input/review.diff
          test -s .ai-review/input/review.diff
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("scripts/dormant_review/review-config").read_text(encoding="utf-8"))
          print("reviews=" + json.dumps(config["review"]["providers"], separators=(",", ":")))
          print(f"review_timeout={config['review']['workflow']['review_timeout_minutes']}")
          PY
          {
            echo "base_sha=$base_sha"
            echo "head_sha=$head_sha"
            echo "pr_number=$PR_NUMBER"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-input
          path: .ai-review/input
          if-no-files-found: error

  review:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        review: ${{ fromJSON(needs.prepare.outputs.reviews) }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.review_timeout) }}
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-input
          path: .ai-review/input
      - name: Review immutable diff
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          PR_DIFF_PATH: .ai-review/input/review.diff
          REVIEW_API_KEY: ${{ secrets[matrix.review.secret] }}
        run: >-
          python3 scripts/dormant_review/review.py "${{ matrix.review.name }}"
          --config scripts/dormant_review/review-config
          --policy AGENTS.md
