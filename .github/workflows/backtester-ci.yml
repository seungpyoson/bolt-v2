name: Backtester CI

# Standalone CI for the backtesting-vertical-slice crate (crates/backtesting-vertical-slice/).
#
# WHY A SEPARATE FILE (not jobs in ci.yml): the crate is its own cargo workspace, and
# scripts/verify_ci_workflow_hygiene.py applies its full topology contract (REQUIRED_JOBS, the
# managed-target/registry cache locks, build-artifact + prebuilt-tool checks) ONLY to a workflow
# named ci.yml / */ci.yml (and advisory.yml). A separate file therefore cannot break the live
# bolt-v2 pipeline. The only cross-file rule that reaches this file is taiki-e/install-action SHA
# consistency (verify_install_action_pin_consistency) plus the no-raw-cargo / no-source-build bans
# (verify_repo_automation_texts) — so: the pinned SHA below MUST equal ci.yml's, and every cargo
# call routes through the managed wrapper (never bare `cargo`).
#
# SCOPE: clippy + tests only, host-native (ubuntu). The crate's `build` lane targets
# aarch64-apple-darwin (local/research) and never ships to EC2, so there is no cross-compile /
# deploy lane here.
#
# ALWAYS-PRESENT GATE (no path-filter trap): the workflow has NO `on.*.paths` filter, so it
# triggers on every pull_request to main, every push to main, and every
# merge_group queue validation. That makes `backtester-gate` a context that is
# ALWAYS reported — safe for the owner to mark required later without the GitHub
# "frozen PR" problem (a path-filtered required check never reports on PRs that miss the path, so
# the PR can never satisfy the rule). Crate-change detection moved INSIDE the workflow: the
# `detect` job computes `bvs_changed`, the fmt/clippy/test lanes SKIP when the crate is untouched,
# and `backtester-gate` concludes success as an explicit no-op on non-crate PRs.
#
# DRAFT COST GOVERNANCE: draft pull_request opened/synchronize/reopened/converted_to_draft/edited
# events publish only `backtester-gate-iteration`, which is feedback-only and must not be
# marked required. Ready/non-draft proof paths publish `backtester-gate` after recomputing
# proof lanes for crate-changing noop/defer paths. PRs that do not touch the crate still pass
# through the explicit no-crate proof.

on:
  # Manual lane: oversized PRs can still run cheap feedback against the branch ref,
  # but workflow_dispatch never promotes itself to full CI.
  workflow_dispatch:
    inputs:
      issue_789:
        description: "Run the non-required issue #789 diagnostic after the iteration gate"
        required: false
        default: "false"
  pull_request:
    branches: [main]
    # Explicit types are required because the default set (opened, synchronize,
    # reopened) does not fire on draft-to-ready transitions (ready_for_review)
    # or base-ref changes (edited). Both can leave this always-reported check
    # unmet for a PR that ends up targeting main.
    # GitHub's edited event also fires on title/body edits. The policy resolver
    # sends ready no-code edits through verified carry-forward while keeping base-ref
    # edits on the full, cancelling proof path.
    # If main advances after the last full proof, the primary CI gate rejects
    # carry-forward unless its provenance records the current PR base SHA.
    # converted_to_draft is included so the gate records an explicit deferred
    # backtester verdict when a ready PR is moved back to draft.
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, edited]
  push:
    branches: [main]
  # Merge queue lane: required merge-proof checks must report on the temporary
  # gh-readonly-queue ref carrying the exact to-be-merged commit.
  merge_group:
    types: [checks_requested]

concurrency:
  # Deferred and full PR runs intentionally use separate groups. Moving a ready PR back to draft
  # records an explicit deferred verdict without cancelling a full proof already in progress.
  # Manual workflow_dispatch runs publish iteration/diagnostic feedback only.
  # Merge queue and Mergify proof PR runs are never cancelled by this workflow.
  group: >-
    ${{ github.event_name == 'pull_request'
        && (startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')
            || startsWith(github.event.pull_request.head.ref, 'tmp-mergify/merge-queue/'))
        && format('bvs-pr-{0}-mergify-proof-{1}', github.event.number, github.event.pull_request.head.sha)
        || github.event_name == 'pull_request'
        && github.event.pull_request.draft == true
        && contains(fromJSON('["opened","synchronize","reopened","converted_to_draft","edited"]'), github.event.action)
        && format('bvs-pr-{0}-deferred', github.event.number)
        || github.event_name == 'pull_request'
        && github.event.pull_request.draft == false
        && (github.event.action == 'reopened'
            || (github.event.action == 'edited' && !(github.event.changes.base.ref.from && true || false)))
        && format('bvs-pr-{0}-noop', github.event.number)
        || github.event_name == 'pull_request'
        && format('bvs-pr-{0}-full', github.event.number)
        || github.event_name == 'workflow_dispatch'
        && format('bvs-{0}-dispatch-iteration', github.ref_name)
        || github.event_name == 'merge_group'
        && format('bvs-mq-{0}', github.ref)
        || format('bvs-{0}-{1}', github.ref_name, github.sha) }}
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && !(startsWith(github.event.pull_request.head.ref, 'mergify/merge-queue/')
             || startsWith(github.event.pull_request.head.ref, 'tmp-mergify/merge-queue/'))
        && !(github.event.pull_request.draft == false
             && (github.event.action == 'reopened'
                 || (github.event.action == 'edited' && !(github.event.changes.base.ref.from && true || false))))
        || github.event_name == 'workflow_dispatch' }}

env:
  JUST_VERSION: "1.49.0"
  CARGO_TERM_COLOR: always
  # Same single base as ci.yml — one base, two namespaces. The crate's namespace
  # (backtesting-vertical-slice) is selected by --repo, not by a second base.
  RUST_VERIFICATION_ROOT_BASE: ${{ github.workspace }}/.rust-verification
permissions:
  contents: read

jobs:
  ci-policy:
    name: bvs-ci-policy
    outputs:
      ci_policy_path: ${{ steps.policy.outputs.ci_policy_path }}
      full_ci_required: ${{ steps.policy.outputs.full_ci_required }}
      full_ci_deferred: ${{ steps.policy.outputs.full_ci_deferred }}
      gate_name: ${{ steps.policy.outputs.gate_name }}
      backtester_gate_name: ${{ steps.policy.outputs.backtester_gate_name }}
      expected_event_class: ${{ steps.policy.outputs.expected_event_class }}
      reason: ${{ steps.policy.outputs.reason }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Prepare trusted base policy tree
        id: policy_base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref || '' }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_branch="$PR_BASE_REF"
            base_ref="refs/remotes/origin/bvs-policy-base-${PR_NUMBER}"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            merge_group_base="$MERGE_GROUP_BASE_REF"
            if [[ "$merge_group_base" == refs/heads/* ]]; then
              base_branch="${merge_group_base#refs/heads/}"
            elif [[ "$merge_group_base" == refs/* ]]; then
              echo "unsupported merge_group base_ref: $merge_group_base" >&2
              exit 1
            else
              base_branch="$merge_group_base"
            fi
            base_ref="refs/remotes/origin/bvs-policy-base-merge-group-${GITHUB_RUN_ID}"
          else
            echo "unsupported trusted base event: $EVENT_NAME" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/$base_branch"
          git fetch --no-tags origin "+refs/heads/${base_branch}:${base_ref}"
          base_tree="$RUNNER_TEMP/bvs-policy-base-tree"
          mkdir -p "$base_tree"
          git archive "$base_ref" scripts/ ci/github-actions-runners.toml | tar -x -C "$base_tree"
          echo "script=$base_tree/scripts/ci_provenance.py" >> "$GITHUB_OUTPUT"
          echo "config=$base_tree/ci/github-actions-runners.toml" >> "$GITHUB_OUTPUT"

      - name: Compute Backtester CI policy
        id: policy
        shell: bash
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref || '' }}
          PR_AUTHOR_ID: ${{ github.event.pull_request.user.id || '' }}
          EVENT_SENDER_ID: ${{ github.event.sender.id }}
        run: |
          policy_script="${{ steps.policy_base.outputs.script }}"
          if [[ -z "$policy_script" ]]; then
            policy_script="scripts/ci_provenance.py"
          fi
          policy_config="${{ steps.policy_base.outputs.config }}"
          if [[ -z "$policy_config" ]]; then
            policy_config="ci/github-actions-runners.toml"
          fi
          author_args=()
          if python3 "$policy_script" ci-policy --help | grep -q -- "--pull-request-author-id"; then
            author_args=(--pull-request-author-id "$PR_AUTHOR_ID")
          fi
          python3 "$policy_script" ci-policy \
            --config "$policy_config" \
            --event-name "${{ github.event_name }}" \
            --event-action "${{ github.event.action || '' }}" \
            --pull-request-draft "${{ github.event.pull_request.draft || false }}" \
            --pull-request-head-ref "$PR_HEAD_REF" \
            "${author_args[@]}" \
            --pull-request-base-changed "${{ github.event.changes.base.ref.from && true || false }}" \
            --ref "${{ github.ref }}" \
            | tee -a "$GITHUB_OUTPUT"

  # Always-runs detector (no compile, no toolchain). Decides whether the crate or any of its
  # shared build inputs changed between the PR base and head, so the heavy lanes can skip on
  # PRs that never touch the crate while `backtester-gate` still reports a verdict.
  detect:
    name: bvs-detect
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    outputs:
      bvs_changed: ${{ steps.detect.outputs.bvs_changed }}
      bvs_bootstrap_changed: ${{ steps.detect.outputs.bvs_bootstrap_changed }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Detect crate-relevant changes
        id: detect
        shell: bash
        run: |
          python3 scripts/ci_input_sets.py validate backtester_cache backtester_detect
          if [[ "${{ github.event_name }}" == "push" || "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "push or manual dispatch event; treating crate as changed with exact-head cache namespace"
            echo "bvs_changed=true" >> "$GITHUB_OUTPUT"
            echo "bvs_bootstrap_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          elif [[ "${{ github.event_name }}" == "merge_group" ]]; then
            # A skipped required gate counts as passing, so queue validation must run proof lanes.
            # The merge queue is proof-bearing, so avoid opaque archive reuse when this path
            # cannot use the pull_request bootstrap diff.
            echo "merge_group event; treating crate as changed with exact-head cache namespace"
            echo "bvs_changed=true" >> "$GITHUB_OUTPUT"
            echo "bvs_bootstrap_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base_sha="${{ github.event.pull_request.base.sha }}"
          echo "comparing ${base_sha}...HEAD"
          bootstrap_changed_path="${RUNNER_TEMP:-/tmp}/bvs-bootstrap-changed.txt"
          git diff --name-only "${base_sha}...HEAD" -- scripts/ci_input_sets.py ci/rust-ci-inputs.toml > "$bootstrap_changed_path"
          if [[ -s "$bootstrap_changed_path" ]]; then
            echo "CI input-set bootstrap paths changed:"
            cat "$bootstrap_changed_path"
            echo "bvs_changed=true" >> "$GITHUB_OUTPUT"
            echo "bvs_bootstrap_changed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The backtester compiles against the root bolt-v2 crate. Keep this
          # path set in one TOML source shared with cache-key hashing so detector
          # and cache identity cannot drift.
          changed="$(python3 scripts/ci_input_sets.py changed backtester_detect --base "$base_sha" --head HEAD)"
          if [[ -n "$changed" ]]; then
            echo "crate-relevant paths changed:"
            echo "$changed"
            echo "bvs_changed=true" >> "$GITHUB_OUTPUT"
            echo "bvs_bootstrap_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "no crate-relevant paths changed"
            echo "bvs_changed=false" >> "$GITHUB_OUTPUT"
            echo "bvs_bootstrap_changed=false" >> "$GITHUB_OUTPUT"
          fi

  # Fail-early gate: fmt is a parse-only check (no dependency compile), so a mis-formatted
  # PR fails in seconds. clippy and test gate on it (needs: fmt) so the ~cold NT compile is
  # never paid for a trivially-broken PR. All three skip when the crate is untouched.
  fmt:
    name: bvs-fmt
    needs: detect
    if: ${{ needs.detect.outputs.bvs_changed == 'true' }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          toolchain-components: rustfmt

      - name: fmt --check
        run: just bte-fmt-check

  # Runner tier is governed by ci/github-actions-runners.toml ([workflows.backtester_ci].clippy),
  # which scripts/verify_ci_workflow_hygiene.py enforces against this runs-on. clippy compiles the
  # full NT-heavy dep graph and only clears the disk-pressure floor on the heavy tier (the TOML
  # records the measured light-runner refusal); keep both files in sync.
  clippy:
    name: bvs-clippy
    needs: [ci-policy, detect, fmt]
    if: ${{ needs.detect.outputs.bvs_changed == 'true' && (needs.ci-policy.outputs.full_ci_required == 'true' || needs.ci-policy.outputs.ci_policy_path == 'noop' || needs.ci-policy.outputs.full_ci_deferred == 'true') }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_HEAVY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          toolchain-components: clippy
          build-jobs-key: backtester_ci.clippy

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          cache-bin: false
          cache-targets: false
          # Distinct from ci.yml's cargo-registry-git-v1: BVS uses its own crate lane.
          # The archive producer writes this cache; clippy reads only.
          shared-key: cargo-registry-git-bvs-v1
          save-if: false

      - name: clippy
        run: just bte-clippy

  test-archive:
    name: bvs-test archive
    needs: [ci-policy, detect, fmt]
    if: ${{ needs.detect.outputs.bvs_changed == 'true' && (needs.ci-policy.outputs.full_ci_required == 'true' || needs.ci-policy.outputs.ci_policy_path == 'noop' || needs.ci-policy.outputs.full_ci_deferred == 'true') }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_HEAVY }}
    outputs:
      bvs_nextest_archive_cache_save_outcome: ${{ steps.bvs-nextest-archive-cache-save.outputs.save-status || (steps.bvs-nextest-archive-cache-save.outcome == 'skipped' && 'skipped' || 'failed') }}
      bvs_bin_sidecars_cache_save_outcome: ${{ steps.bvs-bin-sidecars-cache-save.outputs.save-status || (steps.bvs-bin-sidecars-cache-save.outcome == 'skipped' && 'skipped' || 'failed') }}
    permissions:
      contents: read
      id-token: write
    env:
      BVS_NEXTEST_ARCHIVE_PATH: .nextest-archive/bvs-nextest-archive.tar.zst
      BVS_BIN_SIDECARS_PATH: .nextest-archive/bvs-bin-sidecars.tar.gz
      BVS_NEXTEST_SHARDS: "4"
      NEXTEST_ARTIFACT_CACHE_ENABLED: ${{ vars.CI_NEXTEST_ARCHIVE_S3_ENABLED }}
      NEXTEST_ARTIFACT_CACHE_BUCKET: ${{ vars.CI_SCCACHE_BUCKET }}
      NEXTEST_ARTIFACT_CACHE_REGION: ${{ vars.CI_SCCACHE_REGION }}
      NEXTEST_ARTIFACT_CACHE_KEY_PREFIX: ${{ vars.CI_NEXTEST_ARCHIVE_S3_KEY_PREFIX }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute BVS artifact input hash
        id: bvs_artifact_inputs
        shell: bash
        run: |
          echo "digest=$(python3 scripts/ci_input_sets.py hash backtester_cache)" >> "$GITHUB_OUTPUT"

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          include-nextest-version: "true"
          build-jobs-key: backtester_ci.test-archive

      - name: Resolve BVS nextest artifact cache eligibility
        id: bvs-nextest-artifact-cache
        continue-on-error: true
        env:
          ENABLED: ${{ vars.CI_NEXTEST_ARCHIVE_S3_ENABLED }}
          ROLE_ARN: ${{ vars.AWS_CI_CACHE_ROLE_ARN }}
          PR_READONLY_ROLE_ARN: ${{ vars.AWS_CI_CACHE_PR_READONLY_ROLE_ARN }}
          BUCKET: ${{ vars.CI_SCCACHE_BUCKET }}
          REGION: ${{ vars.CI_SCCACHE_REGION }}
          PREFIX: ${{ vars.CI_NEXTEST_ARCHIVE_S3_KEY_PREFIX }}
        run: |
          cache_mode=""
          role_arn=""
          if [[ "$GITHUB_EVENT_NAME" == "push" && "$GITHUB_REF" == "refs/heads/main" ]]; then
            cache_mode="read_write"
            role_arn="$ROLE_ARN"
          elif [[ "$GITHUB_EVENT_NAME" == "pull_request" || "$GITHUB_EVENT_NAME" == "merge_group" || "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            cache_mode="read_only"
            role_arn="$PR_READONLY_ROLE_ARN"
          fi
          vars_present=true
          [[ "$ENABLED" == "true" && -n "$role_arn" && -n "$BUCKET" && -n "$REGION" && -n "$PREFIX" ]] || vars_present=false
          if [[ -n "$cache_mode" && "$vars_present" == "true" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
          echo "role_arn=$role_arn" >> "$GITHUB_OUTPUT"
          echo "cache_mode=$cache_mode" >> "$GITHUB_OUTPUT"
          echo "enabled=$ENABLED cache_mode=$cache_mode vars_present=$vars_present"

      - name: Configure AWS credentials for BVS nextest artifact cache
        id: bvs-nextest-artifact-cache-aws
        if: steps.bvs-nextest-artifact-cache.outputs.eligible == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ steps.bvs-nextest-artifact-cache.outputs.role_arn }}
          aws-region: ${{ vars.CI_SCCACHE_REGION }}

      - name: Restore BVS nextest archive from S3
        id: bvs-nextest-archive-cache
        if: steps.bvs-nextest-artifact-cache.outputs.eligible == 'true' && steps.bvs-nextest-artifact-cache-aws.outcome == 'success'
        env:
          CACHE_KEY: bvs-nextest-archive-v4-${{ runner.os }}-${{ runner.arch }}-test-profile-discovered-targets-shards-4-${{ steps.bvs_artifact_inputs.outputs.digest }}
          DIGEST: ${{ steps.bvs_artifact_inputs.outputs.digest }}
        run: |
          set +e
          start_epoch="$(date +%s)"
          object_key="${NEXTEST_ARTIFACT_CACHE_KEY_PREFIX%/}/bvs-nextest-archive/${CACHE_KEY}.tar.zst"
          uri="s3://${NEXTEST_ARTIFACT_CACHE_BUCKET}/${object_key}"
          mkdir -p "$(dirname "$BVS_NEXTEST_ARCHIVE_PATH")"
          metadata_digest="$(aws s3api head-object --bucket "$NEXTEST_ARTIFACT_CACHE_BUCKET" --key "$object_key" --query 'Metadata."nextest-digest"' --output text 2>/dev/null)"
          head_rc=$?
          if [[ "$head_rc" -ne 0 ]]; then
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "cache-hit=false"
              echo "restore-bytes=0"
              echo "restore-seconds=$elapsed"
              echo "restore-result=miss"
              echo "restore-reason=head-miss-or-metadata-unavailable"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::BVS nextest archive S3 cache miss or metadata unavailable for digest ${DIGEST}; building locally"
            exit 0
          fi
          if [[ "$metadata_digest" != "$DIGEST" ]]; then
            {
              echo "restore-result=error"
              echo "restore-reason=digest-mismatch"
            } >> "$GITHUB_OUTPUT"
            echo "::error::BVS nextest archive S3 object ${object_key} has missing or mismatched nextest-digest metadata; expected ${DIGEST}, got ${metadata_digest:-<empty>}. Delete the object or repopulate it from a main push."
            exit 1
          fi
          if aws s3 cp "$uri" "$BVS_NEXTEST_ARCHIVE_PATH" --only-show-errors; then
            bytes="$(wc -c < "$BVS_NEXTEST_ARCHIVE_PATH" | tr -d ' ')"
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "cache-hit=true"
              echo "restore-bytes=$bytes"
              echo "restore-seconds=$elapsed"
              echo "restore-result=hit"
              echo "restore-reason=downloaded"
            } >> "$GITHUB_OUTPUT"
            {
              echo "BVS nextest archive S3 restore: hit"
              echo "BVS nextest archive S3 egress bytes: $bytes"
              echo "BVS nextest archive S3 restore seconds: $elapsed"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "$BVS_NEXTEST_ARCHIVE_PATH"
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "cache-hit=false"
              echo "restore-bytes=0"
              echo "restore-seconds=$elapsed"
              echo "restore-result=miss"
              echo "restore-reason=copy-failed-or-unavailable"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::BVS nextest archive S3 cache miss or restore unavailable for digest ${DIGEST}; building locally"
          fi
          exit 0

      - name: Restore BVS binary sidecars from S3
        id: bvs-bin-sidecars-cache
        if: steps.bvs-nextest-artifact-cache.outputs.eligible == 'true' && steps.bvs-nextest-artifact-cache-aws.outcome == 'success'
        env:
          CACHE_KEY: bvs-bin-sidecars-v4-${{ runner.os }}-${{ runner.arch }}-test-profile-discovered-cargo-bin-exe-${{ steps.bvs_artifact_inputs.outputs.digest }}
          DIGEST: ${{ steps.bvs_artifact_inputs.outputs.digest }}
        run: |
          set +e
          start_epoch="$(date +%s)"
          object_key="${NEXTEST_ARTIFACT_CACHE_KEY_PREFIX%/}/bvs-bin-sidecars/${CACHE_KEY}.tar.gz"
          uri="s3://${NEXTEST_ARTIFACT_CACHE_BUCKET}/${object_key}"
          mkdir -p "$(dirname "$BVS_BIN_SIDECARS_PATH")"
          metadata_digest="$(aws s3api head-object --bucket "$NEXTEST_ARTIFACT_CACHE_BUCKET" --key "$object_key" --query 'Metadata."nextest-digest"' --output text 2>/dev/null)"
          head_rc=$?
          if [[ "$head_rc" -ne 0 ]]; then
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "cache-hit=false"
              echo "restore-bytes=0"
              echo "restore-seconds=$elapsed"
              echo "restore-result=miss"
              echo "restore-reason=head-miss-or-metadata-unavailable"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::BVS binary sidecar S3 cache miss or metadata unavailable for digest ${DIGEST}; rebuilding sidecars"
            exit 0
          fi
          if [[ "$metadata_digest" != "$DIGEST" ]]; then
            {
              echo "restore-result=error"
              echo "restore-reason=digest-mismatch"
            } >> "$GITHUB_OUTPUT"
            echo "::error::BVS binary sidecar S3 object ${object_key} has missing or mismatched nextest-digest metadata; expected ${DIGEST}, got ${metadata_digest:-<empty>}. Delete the object or repopulate it from a main push."
            exit 1
          fi
          if aws s3 cp "$uri" "$BVS_BIN_SIDECARS_PATH" --only-show-errors; then
            bytes="$(wc -c < "$BVS_BIN_SIDECARS_PATH" | tr -d ' ')"
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "cache-hit=true"
              echo "restore-bytes=$bytes"
              echo "restore-seconds=$elapsed"
              echo "restore-result=hit"
              echo "restore-reason=downloaded"
            } >> "$GITHUB_OUTPUT"
            {
              echo "BVS binary sidecars S3 restore: hit"
              echo "BVS binary sidecars S3 egress bytes: $bytes"
              echo "BVS binary sidecars S3 restore seconds: $elapsed"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            rm -f "$BVS_BIN_SIDECARS_PATH"
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "cache-hit=false"
              echo "restore-bytes=0"
              echo "restore-seconds=$elapsed"
              echo "restore-result=miss"
              echo "restore-reason=copy-failed-or-unavailable"
            } >> "$GITHUB_OUTPUT"
            echo "::notice::BVS binary sidecar S3 cache miss or restore unavailable for digest ${DIGEST}; rebuilding sidecars"
          fi
          exit 0

      - name: Summarize BVS nextest archive S3 state
        if: always()
        shell: bash
        env:
          S3_ELIGIBLE: ${{ steps.bvs-nextest-artifact-cache.outputs.eligible || 'false' }}
          S3_CACHE_MODE: ${{ steps.bvs-nextest-artifact-cache.outputs.cache_mode || 'none' }}
          S3_AWS_OUTCOME: ${{ steps.bvs-nextest-artifact-cache-aws.outcome }}
          BVS_NEXTEST_RESTORE_OUTCOME: ${{ steps.bvs-nextest-archive-cache.outcome }}
          BVS_NEXTEST_RESTORE_HIT: ${{ steps.bvs-nextest-archive-cache.outputs.cache-hit || '' }}
          BVS_NEXTEST_RESTORE_RESULT: ${{ steps.bvs-nextest-archive-cache.outputs.restore-result || '' }}
          BVS_NEXTEST_RESTORE_REASON: ${{ steps.bvs-nextest-archive-cache.outputs.restore-reason || '' }}
          BVS_SIDECAR_RESTORE_OUTCOME: ${{ steps.bvs-bin-sidecars-cache.outcome }}
          BVS_SIDECAR_RESTORE_HIT: ${{ steps.bvs-bin-sidecars-cache.outputs.cache-hit || '' }}
          BVS_SIDECAR_RESTORE_RESULT: ${{ steps.bvs-bin-sidecars-cache.outputs.restore-result || '' }}
          BVS_SIDECAR_RESTORE_REASON: ${{ steps.bvs-bin-sidecars-cache.outputs.restore-reason || '' }}
        run: |
          restore_state() {
            local eligible="$1" aws="$2" outcome="$3" result="$4" hit="$5"
            if [[ "$eligible" != "true" ]]; then echo "ineligible"; return; fi
            if [[ "$aws" != "success" ]]; then echo "skipped"; return; fi
            if [[ "$outcome" == "failure" || "$result" == "error" ]]; then echo "error"; return; fi
            if [[ "$result" == "hit" || "$hit" == "true" ]]; then echo "hit"; return; fi
            if [[ "$result" == "miss" || "$hit" == "false" ]]; then echo "miss"; return; fi
            echo "skipped"
          }
          restore_reason() {
            local eligible="$1" aws="$2" outcome="$3" reason="$4"
            if [[ "$eligible" != "true" ]]; then echo "eligible=false"; return; fi
            if [[ "$aws" != "success" ]]; then echo "aws=${aws:-skipped}"; return; fi
            if [[ -n "$reason" ]]; then echo "$reason"; return; fi
            echo "outcome=${outcome:-skipped}"
          }
          bvs_nextest_restore="$(restore_state "$S3_ELIGIBLE" "$S3_AWS_OUTCOME" "$BVS_NEXTEST_RESTORE_OUTCOME" "$BVS_NEXTEST_RESTORE_RESULT" "$BVS_NEXTEST_RESTORE_HIT")"
          bvs_nextest_reason="$(restore_reason "$S3_ELIGIBLE" "$S3_AWS_OUTCOME" "$BVS_NEXTEST_RESTORE_OUTCOME" "$BVS_NEXTEST_RESTORE_REASON")"
          bvs_sidecar_restore="$(restore_state "$S3_ELIGIBLE" "$S3_AWS_OUTCOME" "$BVS_SIDECAR_RESTORE_OUTCOME" "$BVS_SIDECAR_RESTORE_RESULT" "$BVS_SIDECAR_RESTORE_HIT")"
          bvs_sidecar_reason="$(restore_reason "$S3_ELIGIBLE" "$S3_AWS_OUTCOME" "$BVS_SIDECAR_RESTORE_OUTCOME" "$BVS_SIDECAR_RESTORE_REASON")"
          {
            echo "BVS nextest archive S3: eligible=${S3_ELIGIBLE:-false} mode=${S3_CACHE_MODE:-none} aws=${S3_AWS_OUTCOME:-skipped} restore=${bvs_nextest_restore} reason=${bvs_nextest_reason}"
            echo "BVS binary sidecars S3: eligible=${S3_ELIGIBLE:-false} mode=${S3_CACHE_MODE:-none} aws=${S3_AWS_OUTCOME:-skipped} restore=${bvs_sidecar_restore} reason=${bvs_sidecar_reason}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Resolve crate managed target dir
        id: crate_target
        run: |
          dir="$(python3 "${{ steps.setup.outputs.rust_verification_owner }}" target-dir --repo crates/backtesting-vertical-slice)"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          cache-on-failure: true
          cache-bin: false
          cache-targets: false
          shared-key: cargo-registry-git-bvs-v1
          save-if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.job == 'test-archive' }}

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        with:
          tool: cargo-nextest@${{ steps.setup.outputs.nextest_version }}
          fallback: none

      - name: Build BVS nextest archive
        if: steps.bvs-nextest-archive-cache.outputs.cache-hit != 'true'
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          mkdir -p "$(dirname "$BVS_NEXTEST_ARCHIVE_PATH")"
          mapfile -t archive_args < <(python3 scripts/rust_test_targets.py archive-args --crate crates/backtesting-vertical-slice)
          printf 'BVS archive args: %s\n' "${archive_args[*]}"
          just bte-test-archive "$BVS_NEXTEST_ARCHIVE_PATH" "${archive_args[@]}"

      - name: Save BVS nextest archive
        id: bvs-nextest-archive-cache-save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bvs-nextest-artifact-cache.outputs.cache_mode == 'read_write' && steps.bvs-nextest-artifact-cache-aws.outcome == 'success' && steps.bvs-nextest-archive-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          CACHE_KEY: bvs-nextest-archive-v4-${{ runner.os }}-${{ runner.arch }}-test-profile-discovered-targets-shards-4-${{ steps.bvs_artifact_inputs.outputs.digest }}
          DIGEST: ${{ steps.bvs_artifact_inputs.outputs.digest }}
        run: |
          set +e
          if [[ ! -s "$BVS_NEXTEST_ARCHIVE_PATH" ]]; then
            echo "::warning::BVS nextest archive was not produced; skipping S3 save"
            echo "save-status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          start_epoch="$(date +%s)"
          bytes="$(wc -c < "$BVS_NEXTEST_ARCHIVE_PATH" | tr -d ' ')"
          object_key="${NEXTEST_ARTIFACT_CACHE_KEY_PREFIX%/}/bvs-nextest-archive/${CACHE_KEY}.tar.zst"
          uri="s3://${NEXTEST_ARTIFACT_CACHE_BUCKET}/${object_key}"
          if aws s3 cp "$BVS_NEXTEST_ARCHIVE_PATH" "$uri" --only-show-errors --metadata "nextest-digest=${DIGEST},artifact-kind=bvs-nextest-archive,github-sha=${GITHUB_SHA}"; then
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "save-status=success"
              echo "save-bytes=$bytes"
              echo "save-seconds=$elapsed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "BVS nextest archive S3 save: success"
              echo "BVS nextest archive S3 saved bytes: $bytes"
              echo "BVS nextest archive S3 save seconds: $elapsed"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::BVS nextest archive S3 save failed; continuing because cache save is fail-open"
            echo "save-status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          exit 0

      - name: Build BVS binary sidecars
        if: steps.bvs-bin-sidecars-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          mapfile -t sidecars < <(python3 scripts/rust_test_targets.py sidecars --crate crates/backtesting-vertical-slice)
          if [[ "${#sidecars[@]}" == "0" ]]; then
            echo "no BVS CARGO_BIN_EXE sidecars discovered"
            exit 1
          fi
          printf 'BVS sidecars: %s\n' "${sidecars[*]}"
          cargo_args=(build --locked)
          for sidecar in "${sidecars[@]}"; do
            cargo_args+=(--bin "$sidecar")
          done
          python3 "${{ steps.setup.outputs.rust_verification_owner }}" cargo --repo crates/backtesting-vertical-slice -- "${cargo_args[@]}"
          mkdir -p "$(dirname "$BVS_BIN_SIDECARS_PATH")"
          target_dir="${{ steps.crate_target.outputs.dir }}"
          tar_inputs=()
          for sidecar in "${sidecars[@]}"; do
            path="debug/$sidecar"
            if [[ ! -x "$target_dir/$path" ]]; then
              echo "required BVS sidecar missing or not executable: $target_dir/$path"
              exit 1
            fi
            tar_inputs+=("$path")
          done
          (
            cd "$target_dir"
            printf '%s\0' "${tar_inputs[@]}" \
              | tar --null -czf "$GITHUB_WORKSPACE/$BVS_BIN_SIDECARS_PATH" --files-from -
          )

      - name: Save BVS binary sidecars
        id: bvs-bin-sidecars-cache-save
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.bvs-nextest-artifact-cache.outputs.cache_mode == 'read_write' && steps.bvs-nextest-artifact-cache-aws.outcome == 'success' && steps.bvs-bin-sidecars-cache.outputs.cache-hit != 'true' }}
        continue-on-error: true
        env:
          CACHE_KEY: bvs-bin-sidecars-v4-${{ runner.os }}-${{ runner.arch }}-test-profile-discovered-cargo-bin-exe-${{ steps.bvs_artifact_inputs.outputs.digest }}
          DIGEST: ${{ steps.bvs_artifact_inputs.outputs.digest }}
        run: |
          set +e
          if [[ ! -s "$BVS_BIN_SIDECARS_PATH" ]]; then
            echo "::warning::BVS binary sidecars were not produced; skipping S3 save"
            echo "save-status=skipped" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          start_epoch="$(date +%s)"
          bytes="$(wc -c < "$BVS_BIN_SIDECARS_PATH" | tr -d ' ')"
          object_key="${NEXTEST_ARTIFACT_CACHE_KEY_PREFIX%/}/bvs-bin-sidecars/${CACHE_KEY}.tar.gz"
          uri="s3://${NEXTEST_ARTIFACT_CACHE_BUCKET}/${object_key}"
          if aws s3 cp "$BVS_BIN_SIDECARS_PATH" "$uri" --only-show-errors --metadata "nextest-digest=${DIGEST},artifact-kind=bvs-bin-sidecars,github-sha=${GITHUB_SHA}"; then
            elapsed="$(( $(date +%s) - start_epoch ))"
            {
              echo "save-status=success"
              echo "save-bytes=$bytes"
              echo "save-seconds=$elapsed"
            } >> "$GITHUB_OUTPUT"
            {
              echo "BVS binary sidecars S3 save: success"
              echo "BVS binary sidecars S3 saved bytes: $bytes"
              echo "BVS binary sidecars S3 save seconds: $elapsed"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::BVS binary sidecars S3 save failed; continuing because cache save is fail-open"
            echo "save-status=failed" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          exit 0

      - name: Summarize BVS S3 save outcomes
        if: always()
        run: |
          {
            echo "BVS nextest archive S3 save outcome: ${{ steps.bvs-nextest-archive-cache-save.outputs.save-status || (steps.bvs-nextest-archive-cache-save.outcome == 'skipped' && 'skipped' || 'failed') }}"
            echo "BVS binary sidecars S3 save outcome: ${{ steps.bvs-bin-sidecars-cache-save.outputs.save-status || (steps.bvs-bin-sidecars-cache-save.outcome == 'skipped' && 'skipped' || 'failed') }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Require BVS local payload
        run: |
          test -s "$BVS_NEXTEST_ARCHIVE_PATH" || { echo "BVS nextest archive missing or empty"; exit 1; }
          test -s "$BVS_BIN_SIDECARS_PATH" || { echo "BVS binary sidecars missing or empty"; exit 1; }
          stat -c 'bvs-payload-size %n %s' "$BVS_NEXTEST_ARCHIVE_PATH" "$BVS_BIN_SIDECARS_PATH"

      - name: Extract BVS binary sidecars
        run: |
          mkdir -p "${{ steps.crate_target.outputs.dir }}"
          tar -xzf "$BVS_BIN_SIDECARS_PATH" -C "${{ steps.crate_target.outputs.dir }}"

      - name: List scoped BVS archive tests
        run: |
          mkdir -p "$RUNNER_TEMP/bvs-nextest-list-extract"
          python3 "${{ steps.setup.outputs.rust_verification_owner }}" cargo --repo crates/backtesting-vertical-slice -- nextest list --archive-file "$GITHUB_WORKSPACE/$BVS_NEXTEST_ARCHIVE_PATH" --extract-to "$RUNNER_TEMP/bvs-nextest-list-extract" --extract-overwrite --workspace-remap "$GITHUB_WORKSPACE/crates/backtesting-vertical-slice"

      - name: Setup BVS MinIO S3 smoke
        uses: ./.github/actions/setup-bvs-minio-s3-smoke

      - name: test BVS MinIO S3 smoke
        run: |
          mkdir -p "$RUNNER_TEMP/bvs-nextest-archive-extract-s3-smoke"
          env "$BVS_MINIO_S3_SMOKE_ENV_VAR=$BVS_MINIO_S3_SMOKE_ENV_VALUE" \
            just bte-test-archive-run \
              "$BVS_NEXTEST_ARCHIVE_PATH" \
              "$RUNNER_TEMP/bvs-nextest-archive-extract-s3-smoke" \
              --no-tests=fail \
              backtesting_vertical_slice_s3_catalog_smoke

      - name: test
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bvs-nextest-archive-extract"
          failures=0
          for shard in $(seq 1 "$BVS_NEXTEST_SHARDS"); do
            echo "::group::bvs-test partition ${shard}/${BVS_NEXTEST_SHARDS}"
            partition_log="$RUNNER_TEMP/bvs-nextest-archive-partition-${shard}.log"
            set +e
            just bte-test-archive-run "$BVS_NEXTEST_ARCHIVE_PATH" "$RUNNER_TEMP/bvs-nextest-archive-extract" --partition "count:${shard}/${BVS_NEXTEST_SHARDS}" -- --skip issue_789_first_real_free_data_taker_pl --skip backtesting_vertical_slice_s3_catalog_smoke 2>&1 | tee "$partition_log"
            rc="${PIPESTATUS[0]}"
            set -e
            if [[ "$rc" -ne 0 ]]; then
              failures=$((failures + 1))
              echo "::error title=BVS nextest archive partition failed::shard=${shard}/${BVS_NEXTEST_SHARDS} exit=${rc}"
              echo "last relevant log lines for BVS nextest archive partition ${shard}/${BVS_NEXTEST_SHARDS}:"
              tail -80 "$partition_log"
            fi
            echo "::endgroup::"
          done
          if [[ "$failures" != "0" ]]; then
            echo "$failures BVS test partitions failed"
            exit 1
          fi

      - name: Stop BVS MinIO S3 smoke container
        if: always()
        run: docker rm -f "$BVS_MINIO_CONTAINER_NAME" >/dev/null 2>&1 || true

  issue_789:
    name: bvs-test issue-789
    # Diagnostic evidence lane: issue #789 is manual-only iteration feedback
    # and never extends the default required backtester-gate critical path.
    needs: [ci-policy, detect, gate]
    if: ${{ always() && github.event_name == 'workflow_dispatch' && github.event.inputs.issue_789 == 'true' && needs.ci-policy.outputs.ci_policy_path == 'iteration' && needs.detect.outputs.bvs_changed == 'true' && needs.gate.result == 'success' }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_HEAVY }}
    env:
      BVS_ISSUE_789_ARCHIVE_PATH: .nextest-archive/bvs-issue-789-lib.tar.zst
      BOLT_ISSUE_789_RESULT_PATH: ${{ github.workspace }}/crates/backtesting-vertical-slice/target/issue-789-first-pl/result.json
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          include-nextest-version: "true"

      - name: Install cargo-nextest
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        with:
          tool: cargo-nextest@${{ steps.setup.outputs.nextest_version }}
          fallback: none

      - name: Build issue #789 lib archive
        env:
          CARGO_PROFILE_TEST_DEBUG: "0"
        run: |
          mkdir -p "$(dirname "$BVS_ISSUE_789_ARCHIVE_PATH")"
          just bte-test-archive "$BVS_ISSUE_789_ARCHIVE_PATH" --lib
          stat -c 'bvs-issue-789-archive-size %n %s' "$BVS_ISSUE_789_ARCHIVE_PATH"

      - name: test issue-789
        run: |
          mkdir -p "$RUNNER_TEMP/bvs-nextest-archive-extract"
          just bte-test-archive-run "$BVS_ISSUE_789_ARCHIVE_PATH" "$RUNNER_TEMP/bvs-nextest-archive-extract" issue_789_first_real_free_data_taker_pl

      - name: Upload issue #789 first-P/L artifact
        id: upload-issue-789-first-pl
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: issue-789-first-pl-${{ github.run_id }}-${{ github.run_attempt }}
          path: crates/backtesting-vertical-slice/target/issue-789-first-pl/result.json
          if-no-files-found: error
          retention-days: 7

  gate:
    name: ${{ needs.ci-policy.outputs.backtester_gate_name }}
    # backtester-gate-iteration is intentionally non-required; only backtester-gate is merge proof.
    needs: [ci-policy, detect, fmt, clippy, test-archive]
    if: ${{ always() }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Prepare trusted base verdict tree
        id: verdict_base
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || github.run_id }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref || '' }}
          MERGE_GROUP_BASE_REF: ${{ github.event.merge_group.base_ref || '' }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            base_branch="$PR_BASE_REF"
            base_ref="refs/remotes/origin/bvs-gate-base-${PR_NUMBER}"
          elif [[ "$EVENT_NAME" == "merge_group" ]]; then
            merge_group_base="$MERGE_GROUP_BASE_REF"
            if [[ "$merge_group_base" == refs/heads/* ]]; then
              base_branch="${merge_group_base#refs/heads/}"
            elif [[ "$merge_group_base" == refs/* ]]; then
              echo "unsupported merge_group base_ref: $merge_group_base" >&2
              exit 1
            else
              base_branch="$merge_group_base"
            fi
            base_ref="refs/remotes/origin/bvs-gate-base-merge-group-${GITHUB_RUN_ID}"
          else
            echo "unsupported trusted base event: $EVENT_NAME" >&2
            exit 1
          fi
          git check-ref-format "refs/heads/$base_branch"
          git fetch --no-tags origin "+refs/heads/${base_branch}:${base_ref}"
          base_tree="$RUNNER_TEMP/bvs-gate-base-tree"
          mkdir -p "$base_tree"
          git archive "$base_ref" scripts/ ci/github-actions-runners.toml | tar -x -C "$base_tree"
          echo "script=$base_tree/scripts/ci_provenance.py" >> "$GITHUB_OUTPUT"

      - name: Check required lanes
        shell: bash
        run: |
          verdict_script="${{ steps.verdict_base.outputs.script }}"
          if [[ -z "$verdict_script" ]]; then
            verdict_script="scripts/ci_provenance.py"
          fi
          python3 "$verdict_script" check-backtester-gate \
            --policy-path "${{ needs.ci-policy.outputs.ci_policy_path }}" \
            --expected-event-class "${{ needs.ci-policy.outputs.expected_event_class }}" \
            --full-ci-deferred "${{ needs.ci-policy.outputs.full_ci_deferred }}" \
            --bvs-changed "${{ needs.detect.outputs.bvs_changed || 'false' }}" \
            --job ci-policy=${{ needs.ci-policy.result }} \
            --job detect=${{ needs.detect.result }} \
            --job fmt=${{ needs.fmt.result }} \
            --job clippy=${{ needs.clippy.result }} \
            --job test-archive=${{ needs.test-archive.result }} \
            --job test=${{ needs.test-archive.result }}
