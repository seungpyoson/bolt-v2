name: CI docs pass stub

on:
  pull_request:
    branches: [main]
    # Explicit types are required because the default set (opened,
    # synchronize, reopened) does not fire on draft-to-ready transitions
    # (ready_for_review) or base-ref changes (edited). For docs-only PRs this
    # stub is the sole source of the build/clippy/test/gate required checks,
    # so missing those events leaves the PR frozen.
    # Note: GitHub's edited event fires on ANY PR edit (title, body, base
    # ref), not only retargets. We accept that cost because there is no
    # narrower event for base-ref changes.
    types: [opened, synchronize, reopened, ready_for_review, edited]
    paths:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'GEMINI.md'
      - 'REASONIX.md'
      - 'LICENSE'
      - 'SECURITY.md'
      - '.github/ISSUE_TEMPLATE/**'
      - '.claude/**'
      - '.codex/**'
      - '.gemini/**'
      - '.opencode/**'
      - '.pi/**'
      - '.specify/**'

permissions:
  contents: read

jobs:
  build:
    name: build
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Collect changed files
        shell: bash
        run: |
          base_ref="refs/remotes/origin/pass-stub-base-${{ github.event.pull_request.number }}"
          head_ref="refs/remotes/origin/pass-stub-head-${{ github.event.pull_request.number }}"
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:${base_ref}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:${head_ref}"
          git diff --name-only "${base_ref}...${head_ref}" > changed-files.txt
          if [[ ! -s changed-files.txt ]]; then
            echo "No changed files detected for pass-stub classification"
            exit 1
          fi

      - name: Classify changed files
        run: python3 scripts/verify_ci_path_filters.py --changed-files changed-files.txt --github-output "$GITHUB_OUTPUT"

  clippy:
    name: clippy
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Collect changed files
        shell: bash
        run: |
          base_ref="refs/remotes/origin/pass-stub-base-${{ github.event.pull_request.number }}"
          head_ref="refs/remotes/origin/pass-stub-head-${{ github.event.pull_request.number }}"
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:${base_ref}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:${head_ref}"
          git diff --name-only "${base_ref}...${head_ref}" > changed-files.txt
          if [[ ! -s changed-files.txt ]]; then
            echo "No changed files detected for pass-stub classification"
            exit 1
          fi

      - name: Classify changed files
        run: python3 scripts/verify_ci_path_filters.py --changed-files changed-files.txt --github-output "$GITHUB_OUTPUT"

  test:
    name: test
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Collect changed files
        shell: bash
        run: |
          base_ref="refs/remotes/origin/pass-stub-base-${{ github.event.pull_request.number }}"
          head_ref="refs/remotes/origin/pass-stub-head-${{ github.event.pull_request.number }}"
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:${base_ref}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:${head_ref}"
          git diff --name-only "${base_ref}...${head_ref}" > changed-files.txt
          if [[ ! -s changed-files.txt ]]; then
            echo "No changed files detected for pass-stub classification"
            exit 1
          fi

      - name: Classify changed files
        run: python3 scripts/verify_ci_path_filters.py --changed-files changed-files.txt --github-output "$GITHUB_OUTPUT"

  gate:
    name: gate
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Collect changed files
        shell: bash
        run: |
          base_ref="refs/remotes/origin/pass-stub-base-${{ github.event.pull_request.number }}"
          head_ref="refs/remotes/origin/pass-stub-head-${{ github.event.pull_request.number }}"
          git fetch --no-tags origin \
            "+refs/heads/${{ github.event.pull_request.base.ref }}:${base_ref}" \
            "+refs/pull/${{ github.event.pull_request.number }}/head:${head_ref}"
          git diff --name-only "${base_ref}...${head_ref}" > changed-files.txt
          if [[ ! -s changed-files.txt ]]; then
            echo "No changed files detected for pass-stub classification"
            exit 1
          fi

      - name: Classify changed files
        run: python3 scripts/verify_ci_path_filters.py --changed-files changed-files.txt --github-output "$GITHUB_OUTPUT"
