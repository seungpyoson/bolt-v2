name: CI Runner Debug

# Manual-only: SSH into an ephemeral Ubicloud runner to debug CI environment issues.
# Requires repository secret SSH_PUBLIC_KEY (public half of a dedicated debug key pair).
# Operator setup: `just ci-debug-ssh-bootstrap` (first time) or `just ci-debug-ssh-sync`.

on:
  workflow_dispatch:
    inputs:
      runner_tier:
        description: Ubicloud runner tier to attach to
        required: true
        type: choice
        default: heavy
        options:
          - heavy
          - light
      ref:
        description: Git ref to checkout (branch, tag, or SHA)
        required: true
        type: string
        default: main

concurrency:
  group: ci-runner-debug
  cancel-in-progress: true

env:
  JUST_VERSION: "1.49.0"
  CARGO_TERM_COLOR: always
  RUST_VERIFICATION_ROOT_BASE: ${{ github.workspace }}/.rust-verification

permissions:
  contents: read

jobs:
  debug-heavy:
    name: debug-heavy
    if: ${{ inputs.runner_tier == 'heavy' }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_HEAVY }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup SSH access
        uses: ubicloud/ssh-runner@b6ccad69f047c476b84a54a990f89b1ea5f2a828 # v2.0
        with:
          public-ssh-key: ${{ secrets.SSH_PUBLIC_KEY }}
          wait-minutes: ${{ fromJSON(vars.CI_DEBUG_SSH_WAIT_MINUTES) }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          include-build-values: "true"
          include-deny-version: "true"

      - name: Debug session instructions
        shell: bash
        run: |
          echo "SSH into this runner using the command printed by ubicloud/ssh-runner above."
          echo "Repository checkout: ${GITHUB_WORKSPACE}"
          echo "Examples: just fmt-check | just clippy | just test-shard 1 4 | just build"

  debug-light:
    name: debug-light
    if: ${{ inputs.runner_tier == 'light' }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}

      - name: Setup SSH access
        uses: ubicloud/ssh-runner@b6ccad69f047c476b84a54a990f89b1ea5f2a828 # v2.0
        with:
          public-ssh-key: ${{ secrets.SSH_PUBLIC_KEY }}
          wait-minutes: ${{ fromJSON(vars.CI_DEBUG_SSH_WAIT_MINUTES) }}

      - name: Setup environment
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          include-build-values: "true"
          include-deny-version: "true"

      - name: Debug session instructions
        shell: bash
        run: |
          echo "SSH into this runner using the command printed by ubicloud/ssh-runner above."
          echo "Repository checkout: ${GITHUB_WORKSPACE}"
          echo "Examples: just fmt-check | just clippy | just test-shard 1 4 | just build"