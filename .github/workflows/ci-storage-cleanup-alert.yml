name: CI Storage Cleanup Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-storage-cleanup-alert
  cancel-in-progress: false

jobs:
  cleanup-alert:
    name: cleanup-alert
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run cleanup feasibility alert
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/ci_storage_audit.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --cleanup-feasibility --cleanup-alert --cleanup-json-output "$RUNNER_TEMP/cleanup-feasibility.json" --github-step-summary "$GITHUB_STEP_SUMMARY" --github-annotations
      - name: Upload cleanup feasibility JSON
        id: upload-cleanup-feasibility-json
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ci-storage-cleanup-feasibility
          path: ${{ runner.temp }}/cleanup-feasibility.json
          if-no-files-found: error
          retention-days: 7
