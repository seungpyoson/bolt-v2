name: CI Storage Cleanup Alert

on:
  workflow_dispatch:
  schedule:
    - cron: "47 9 * * 1"

permissions:
  contents: read
  actions: read

concurrency:
  group: ci-storage-cleanup-alert
  cancel-in-progress: false

jobs:
  cleanup-alert:
    name: cleanup-alert
    if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Run cleanup feasibility alert
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          python3 scripts/ci_storage_audit.py --repo "$GITHUB_REPOSITORY" --branch "$GITHUB_REF_NAME" --cleanup-feasibility --cleanup-alert --github-step-summary "$GITHUB_STEP_SUMMARY" --github-annotations
