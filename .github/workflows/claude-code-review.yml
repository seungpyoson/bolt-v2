name: Claude Review Worker

on:
  workflow_call:
    inputs:
      pr_number:
        required: true
        type: string
      head_sha:
        required: true
        type: string
      base_sha:
        required: true
        type: string
      governance_sha:
        required: true
        type: string
      evidence_run_id:
        required: true
        type: string
      evidence_artifact:
        required: true
        type: string
      job_timeout_minutes:
        required: true
        type: number
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  analysis:
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.governance_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ${{ inputs.evidence_artifact }}
          path: .ai-review/evidence
      - name: Load configured Claude runtime
        id: config
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path
          config = tomllib.loads(Path("ci/ai-review.toml").read_text(encoding="utf-8"))
          claude = config["claude"]
          workflow = claude["workflow"]
          print(f"model={claude['model']}")
          print(f"marker={claude['deliverable_marker']}")
          print(f"source={claude['source_label_template'].replace('{model}', claude['model'])}")
          print(f"track_progress={str(claude['track_progress']).lower()}")
          print(f"max_turns={workflow['max_turns']}")
          print(f"allowed_tools={','.join(claude['allowed_tools'])}")
          PY
      - name: Run Claude review
        id: analysis
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
          track_progress: ${{ steps.config.outputs.track_progress }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ inputs.pr_number }}
            EXACT HEAD: ${{ inputs.head_sha }}
            DELIVERABLE MARKER: ${{ steps.config.outputs.marker }}
            SOURCE LABEL: ${{ steps.config.outputs.source }}

            Review the complete base-to-head diff at EXACT HEAD. Apply AGENTS.md from
            AGENTS.md as the policy authority. Read
            .ai-review/evidence/final-review-evidence.md before reviewing.
            The immutable diff is .ai-review/evidence/review.diff. Use only that file
            for diff contents; do not query the moving live pull-request diff.
            Follow [review.output_contract] from
            ci/ai-review.toml exactly.
            Return every hard-evidence substantive finding in one final response. The
            repository publisher emits the final deliverable; analysis has no comment-writing capability.
            Do not edit files, commit, push, merge, display credentials, or choose an
            alternate model or reviewer. Return only the review body; the repository
            publisher adds DELIVERABLE MARKER, SOURCE LABEL, and EXACT HEAD.
          claude_args: >-
            --max-turns ${{ steps.config.outputs.max_turns }}
            --model ${{ steps.config.outputs.model }}
            --allowedTools "${{ steps.config.outputs.allowed_tools }}"
      - name: Stage completed Claude execution
        run: cp "${{ steps.analysis.outputs.execution_file }}" claude-execution.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-execution
          path: claude-execution.json
          if-no-files-found: error

  publish:
    needs: analysis
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: ${{ inputs.job_timeout_minutes }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.governance_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claude-review-execution
          path: .ai-review/claude-execution
      - name: Publish Claude review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.head_sha }}
        run: >-
          python3 scripts/publish_claude_review.py
          --execution-file .ai-review/claude-execution/claude-execution.json
          --config-file ci/ai-review.toml
