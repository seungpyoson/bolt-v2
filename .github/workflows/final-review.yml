name: AI Reviews

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

concurrency:
  group: ai-reviews-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    outputs:
      head_sha: ${{ steps.capture.outputs.head_sha }}
      base_sha: ${{ steps.capture.outputs.base_sha }}
      pr_number: ${{ steps.capture.outputs.pr_number }}
      claude_timeout: ${{ steps.capture.outputs.claude_timeout }}
      kimi_timeout: ${{ steps.capture.outputs.kimi_timeout }}
      glm_timeout: ${{ steps.capture.outputs.glm_timeout }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Capture immutable review input
        id: capture
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          EVENT_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          EVENT_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          payload="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR}")"
          test "$(jq -r '.state' <<<"$payload")" = "open"
          head_sha="$(jq -r '.head.sha' <<<"$payload")"
          base_sha="$(jq -r '.base.sha' <<<"$payload")"
          test "$head_sha" = "$EVENT_HEAD_SHA"
          test "$base_sha" = "$EVENT_BASE_SHA"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]]
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p .ai-review/input
          gh api "repos/${GITHUB_REPOSITORY}/compare/${base_sha}...${head_sha}" \
            -H "Accept: application/vnd.github.diff" > .ai-review/input/review.diff
          test -s .ai-review/input/review.diff
          {
            printf '# Immutable review input\n\n'
            printf -- '- Pull request: %s\n' "$PR"
            printf -- '- Base SHA: %s\n' "$base_sha"
            printf -- '- Head SHA: %s\n' "$head_sha"
            printf -- '- Source: GitHub compare API\n'
          } > .ai-review/input/review-context.md
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("scripts/dormant_review/review-config").read_text(encoding="utf-8"))
          print(f"claude_timeout={config['claude']['workflow']['job_timeout_minutes']}")
          print(f"kimi_timeout={config['kimi']['workflow']['job_timeout_minutes']}")
          print(f"glm_timeout={config['glm']['workflow']['job_timeout_minutes']}")
          PY
          {
            echo "head_sha=$head_sha"
            echo "base_sha=$base_sha"
            echo "pr_number=$PR"
          } >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ai-review-input
          path: .ai-review/input
          if-no-files-found: error

  claude-analysis:
    needs: prepare
    permissions:
      contents: read
      id-token: write
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.claude_timeout) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-input
          path: .ai-review/input
      - name: Load configured Claude runtime
        id: config
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import tomllib
          from pathlib import Path

          config = tomllib.loads(Path("scripts/dormant_review/review-config").read_text(encoding="utf-8"))
          claude = config["claude"]
          workflow = claude["workflow"]
          print(f"model={claude['model']}")
          print(f"marker={claude['deliverable_marker']}")
          print(f"source={claude['source_label_template'].replace('{model}', claude['model'])}")
          print(f"track_progress={str(claude['track_progress']).lower()}")
          print(f"max_turns={workflow['max_turns']}")
          print(f"allowed_tools={','.join(claude['allowed_tools'])}")
          PY
      - name: Run Claude review
        id: analysis
        uses: anthropics/claude-code-action@a92e7c70a4da9793dc164451d829089dc057a464 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          additional_permissions: |
            contents: read
          track_progress: ${{ steps.config.outputs.track_progress }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ needs.prepare.outputs.pr_number }}
            EXACT HEAD: ${{ needs.prepare.outputs.head_sha }}
            DELIVERABLE MARKER: ${{ steps.config.outputs.marker }}
            SOURCE LABEL: ${{ steps.config.outputs.source }}

            Review the complete base-to-head diff at EXACT HEAD. AGENTS.md is the
            policy authority. Read .ai-review/input/review-context.md first. The
            immutable diff is .ai-review/input/review.diff. Use only that file for
            diff contents; do not query the moving pull-request diff or execute code
            from the pull request. Follow [review.output_contract] from
            scripts/dormant_review/review-config exactly. Return every hard-evidence substantive finding
            in one final response. Do not edit files, commit, push, merge, display
            credentials, or choose another model or reviewer. Return only the review
            body; the publisher adds the marker, source label, and exact head.
          claude_args: >-
            --max-turns ${{ steps.config.outputs.max_turns }}
            --model ${{ steps.config.outputs.model }}
            --allowedTools "${{ steps.config.outputs.allowed_tools }}"
      - name: Stage completed Claude execution
        run: cp "${{ steps.analysis.outputs.execution_file }}" claude-execution.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: claude-review-execution
          path: claude-execution.json
          if-no-files-found: error

  claude-publish:
    needs: [prepare, claude-analysis]
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.claude_timeout) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: claude-review-execution
          path: .ai-review/claude-execution
      - name: Publish Claude review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
        run: >-
          python3 scripts/dormant_review/publish_claude_review.py
          --execution-file .ai-review/claude-execution/claude-execution.json
          --config-file scripts/dormant_review/review-config

  kimi-review:
    needs: prepare
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.kimi_timeout) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-input
          path: .ai-review/input
      - name: Prepare review instructions
        run: |
          mkdir -p .ai-review/standards
          {
            cat AGENTS.md
            printf '\n# Immutable review input\n\n'
            cat .ai-review/input/review-context.md
            printf '\nReview PR %s at exact head %s. Review the complete diff and report every hard-evidence substantive finding. Do not execute pull-request code, edit, push, merge, expose credentials, or choose another model or provider.\n' "${{ needs.prepare.outputs.pr_number }}" "${{ needs.prepare.outputs.head_sha }}"
          } > .ai-review/standards/kimi-review-standards.md
      - name: Run Kimi review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          PR_DIFF_PATH: .ai-review/input/review.diff
          KIMI_API_KEY: ${{ secrets.KIMI_API_KEY }}
        run: >-
          python3 scripts/dormant_review/direct_ai_review.py kimi
          --instructions-file .ai-review/standards/kimi-review-standards.md
          --config-file scripts/dormant_review/review-config

  glm-review:
    needs: prepare
    permissions:
      contents: read
      pull-requests: write
      issues: write
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    timeout-minutes: ${{ fromJSON(needs.prepare.outputs.glm_timeout) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ai-review-input
          path: .ai-review/input
      - name: Prepare review instructions
        run: |
          mkdir -p .ai-review/standards
          {
            cat AGENTS.md
            printf '\n# Immutable review input\n\n'
            cat .ai-review/input/review-context.md
            printf '\nReview PR %s at exact head %s. Review the complete diff and report every hard-evidence substantive finding. Do not execute pull-request code, edit, push, merge, expose credentials, or choose another model or provider.\n' "${{ needs.prepare.outputs.pr_number }}" "${{ needs.prepare.outputs.head_sha }}"
          } > .ai-review/standards/glm-review-standards.md
      - name: Run GLM review
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.prepare.outputs.pr_number }}
          PR_BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          PR_HEAD_SHA: ${{ needs.prepare.outputs.head_sha }}
          PR_DIFF_PATH: .ai-review/input/review.diff
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
        run: >-
          python3 scripts/dormant_review/direct_ai_review.py glm
          --instructions-file .ai-review/standards/glm-review-standards.md
          --config-file scripts/dormant_review/review-config
