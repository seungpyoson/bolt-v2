name: Jules Performance Improver

on:
  schedule:
    - cron: "17 8 * * 3"
  workflow_dispatch: {}

permissions: {}

concurrency:
  group: jules-performance-improver
  cancel-in-progress: false

jobs:
  jules-performance-improver:
    name: jules-performance-improver
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - name: Start Jules advisory session
        id: invoke-jules
        continue-on-error: true
        env:
          JULES_API_KEY: ${{ secrets.JULES_API_KEY }}
          JULES_STARTING_BRANCH: ${{ github.event.repository.default_branch }}
          JULES_TITLE: Jules Advisory Performance Improver
          JULES_PROMPT: |
            You are Jules running code-maintenance automation for this repository.

            Operating rules:
            - You are advisory only and not a required gate.
            - You are not reviewer of record and not policy authority.
            - You must not approve, merge, or waive findings.
            - Create a draft pull request only when you have a small verified performance improvement.
            - Label any pull request with agent:jules.
            - No measurable improvement: create no pull request and leave a concise report in the Jules session.
            - Do not edit governance or policy files unless a triggering issue explicitly requests that exact file.
            - No AWS access.
            - No trading, runtime, deploy, live, market data, or order execution access.

            Performance focus:
            - Prefer measurable improvements over speculative micro-optimizations.
            - Keep public behavior and APIs unchanged.
            - Reuse existing benchmarks, tests, or static checks when available.
            - Keep changes scoped and include before/after evidence in the draft PR body.
        run: |
          jq -n \
            --arg owner "${GITHUB_REPOSITORY%/*}" \
            --arg repo "${GITHUB_REPOSITORY#*/}" \
            --arg branch "$JULES_STARTING_BRANCH" \
            --arg title "$JULES_TITLE" \
            --arg prompt "$JULES_PROMPT" \
            '{
              title: $title,
              prompt: $prompt,
              sourceContext: {
                githubRepoContext: {
                  owner: $owner,
                  repo: $repo,
                  baseBranch: $branch
                }
              },
              automationMode: "AUTO_CREATE_PR",
              requirePlanApproval: false
            }' > "$RUNNER_TEMP/jules_payload.json"

          curl --silent --show-error --fail-with-body \
            --request POST \
            --header "Content-Type: application/json" \
            --header "x-goog-api-key: ${JULES_API_KEY}" \
            --data @"$RUNNER_TEMP/jules_payload.json" \
            --output "$RUNNER_TEMP/jules_response.json" \
            "https://jules.googleapis.com/v1alpha/sessions"

          jq -e '.name and .id' "$RUNNER_TEMP/jules_response.json" >/dev/null

      - name: Jules advisory status notice
        run: |
          echo "::notice::Jules advisory automation is non-blocking. A verified Jules session requires the Start Jules advisory session step to pass with a session id. Missing or failed session creation means Jules API was unavailable or rejected the request and must not be treated as merge evidence."
