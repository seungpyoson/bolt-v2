name: Reference Boundary Capture

on:
  workflow_dispatch:
    inputs:
      credential_confirmation:
        description: Type CREDENTIAL-SSM to resolve capture credentials from AWS SSM
        required: true
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

env:
  JUST_VERSION: "1.49.0"
  CAPTURE_CONFIG: ci/reference-boundary-capture.toml

jobs:
  capture:
    runs-on: ${{ vars.CI_RUNNER_MANAGED_HEAVY }}
    environment: reference-boundary-capture
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Read capture configuration
        id: capture-config
        env:
          CREDENTIAL_CONFIRMATION: ${{ inputs.credential_confirmation }}
        run: |
          set -euo pipefail
          test "$CREDENTIAL_CONFIRMATION" = "CREDENTIAL-SSM"
          test "$GITHUB_REF_NAME" = "${{ github.event.repository.default_branch }}"
          python3 - <<'PY'
          import hashlib, os, pathlib, tomllib
          config_path = pathlib.Path(os.environ["CAPTURE_CONFIG"])
          raw = config_path.read_bytes()
          config = tomllib.loads(raw.decode())
          required = {
              "schema_version",
              "workflow_path",
              "root_config",
              "client_key",
              "wait_timeout_seconds",
              "aws_region",
              "output_directory",
              "artifact_name",
              "artifact_retention_days",
          }
          if set(config) != required or config["schema_version"] != 1:
              raise SystemExit("invalid reference-boundary capture configuration")
          workflow = pathlib.Path(config["workflow_path"])
          output = pathlib.Path(os.environ["GITHUB_OUTPUT"])
          values = {
              **config,
              "workflow_digest": hashlib.sha256(workflow.read_bytes()).hexdigest(),
              "config_digest": hashlib.sha256(raw).hexdigest(),
          }
          with output.open("a", encoding="utf-8") as handle:
              for key, value in values.items():
                  if key != "schema_version":
                      handle.write(f"{key}={value}\n")
          PY

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}

      - name: Configure AWS credentials for SSM
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ vars.AWS_CAPTURE_ROLE_ARN }}
          aws-region: ${{ steps.capture-config.outputs.aws_region }}

      - name: Resolve workflow check suite
        id: provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          check_suite_id="$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq '.check_suite_id')"
          [[ "$check_suite_id" =~ ^[1-9][0-9]*$ ]]
          echo "check_suite_id=$check_suite_id" >> "$GITHUB_OUTPUT"
          echo "created_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Capture Chainlink reference binary fixture
        run: |
          set -euo pipefail
          mkdir -p "${{ steps.capture-config.outputs.output_directory }}"
          python3 "${{ steps.setup.outputs.rust_verification_owner }}" cargo --repo "$GITHUB_WORKSPACE" -- run --locked --bin bolt-v2 -- \
            ops capture-reference-boundary-fixture \
              --root-config "${{ steps.capture-config.outputs.root_config }}" \
              --client-key "${{ steps.capture-config.outputs.client_key }}" \
              --output-dir "${{ steps.capture-config.outputs.output_directory }}" \
              --wait-timeout-secs "${{ steps.capture-config.outputs.wait_timeout_seconds }}" \
              --repository "${{ github.repository }}" \
              --workflow-path "${{ steps.capture-config.outputs.workflow_path }}" \
              --workflow-digest "${{ steps.capture-config.outputs.workflow_digest }}" \
              --provenance-config-digest "${{ steps.capture-config.outputs.config_digest }}" \
              --head-sha "${{ github.sha }}" \
              --head-branch "${{ github.ref_name }}" \
              --run-id "${{ github.run_id }}" \
              --run-attempt "${{ github.run_attempt }}" \
              --check-suite-id "${{ steps.provenance.outputs.check_suite_id }}" \
              --event "${{ github.event_name }}" \
              --created-at "${{ steps.provenance.outputs.created_at }}"

      - name: Upload capture artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b5404495a51ac03f51d2c05c8 # v4.6.2
        with:
          name: ${{ steps.capture-config.outputs.artifact_name }}
          path: ${{ steps.capture-config.outputs.output_directory }}
          if-no-files-found: error
          retention-days: ${{ steps.capture-config.outputs.artifact_retention_days }}
