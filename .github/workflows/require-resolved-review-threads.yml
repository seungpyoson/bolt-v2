name: Required reviewer resolution gate

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
  pull_request_review:
    types:
      - submitted
      - dismissed
  pull_request_review_comment:
    # GitHub Actions does not expose review-thread resolved or reopened events.
    # Native conversation resolution is authoritative at merge; this check is
    # visibility for every push. If UI thread changes do not rerun it, manually
    # rerun the workflow or create another review/comment event.
    types:
      - created
      - edited
      - deleted

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  require-resolved-review-threads:
    name: verify review threads are resolved
    if: >-
      ${{ github.event.pull_request.base.ref == 'main'
          && github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Run the review-thread gate from the protected base branch, not from PR code.
          # The pull_request workflow YAML is still PR-controlled; CODEOWNERS plus
          # the main ruleset must require sp-reviewer approval for workflow edits.
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check resolved review threads
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_GRAPHQL_URL: ${{ github.graphql_url }}
          # Required merge context: a commit status, not this Actions job name,
          # so a cancelled or superseded run cannot leave a terminal "cancelled"
          # required check that blocks the merge. The main ruleset must require
          # this status context ("required review threads resolved") in place of
          # the "verify review threads are resolved" job name.
          # Do not add workflow concurrency here: concurrency-cancelled Actions
          # check runs remain visible as red/cancelled PR rollup rows even after
          # this required commit-status context is republished green.
          REVIEW_THREAD_GATE_STATUS_CONTEXT: required review threads resolved
        run: python3 scripts/require_resolved_review_threads.py
