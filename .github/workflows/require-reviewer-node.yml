name: Required reviewer approval gate

on:
  pull_request:
    branches: [main]
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review
      - review_requested
      - review_request_removed
      - edited
  pull_request_review:
    types:
      - submitted
      - dismissed

permissions:
  contents: read
  pull-requests: read
  statuses: write

jobs:
  require-reviewer-node:
    name: publish approval status
    if: >-
      ${{ github.event.pull_request.base.ref == 'main'
          && github.event.pull_request.draft == false }}
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Run the reviewer gate from the protected base branch, not from PR code.
          # The pull_request workflow YAML is still PR-controlled; CODEOWNERS plus
          # the main ruleset must require sp-reviewer approval for workflow edits.
          repository: ${{ github.event.pull_request.base.repo.full_name }}
          ref: ${{ github.event.pull_request.base.sha }}

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Check reviewer node_id status
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # Required merge context. This is a commit status, not the Actions job
          # name, so newer approval events replace older failed approval states.
          # Do not add workflow concurrency here: concurrency-cancelled Actions
          # check runs remain visible as red/cancelled PR rollup rows even after
          # this required commit-status context is republished green.
          REVIEWER_GATE_STATUS_CONTEXT: required reviewer approved
          # Policy identity constant: the required human reviewer. Hardcoded
          # intentionally because PR-editable config must not select the reviewer.
          REQUIRED_REVIEWER_NODE_ID: U_kgDOEZMFhA
        run: python3 scripts/require_sp_reviewer.py
