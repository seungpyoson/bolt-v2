name: Rust Probe
run-name: Rust Probe ${{ inputs.probe_id }} ${{ inputs.mode }} @ ${{ inputs.ref }}

# Manual-only: run one constrained Rust compile/test probe on an ephemeral runner.
# This workflow is debugging feedback only and is not merge proof.
#
# Dispatch with gh from the pushed branch head, e.g.:
#   gh workflow run rust-probe.yml --ref <branch> \
#     -f runner_tier=heavy -f ref=<sha> -f expected_sha=<sha> \
#     -f probe_id=<id> -f mode=check-lib
# Optional: -f manifest_path=crates/backtesting-vertical-slice/Cargo.toml to
# target a nested workspace.

on:
  workflow_dispatch:
    inputs:
      runner_tier:
        description: Ubicloud runner tier
        required: true
        type: choice
        options:
          - heavy
          - light
      ref:
        description: Exact pushed Git SHA to checkout
        required: true
        type: string
      expected_sha:
        description: Exact pushed Git SHA the runner must verify after checkout
        required: true
        type: string
      probe_id:
        description: Probe correlation id
        required: true
        type: string
      mode:
        description: Probe mode to run
        required: true
        type: choice
        default: check-lib
        options:
          - check-lib
          - check-test-target
          - nextest-no-run-test-target
          - nextest-lib-name
          - nextest-test-target
          - nextest-test-target-name
      test_target:
        description: Integration test target name for test-target modes
        required: false
        type: string
        default: ""
      test_name:
        description: Test name for nextest-test-target-name
        required: false
        type: string
        default: ""
      manifest_path:
        description: Optional repo-relative Cargo.toml path for nested workspaces
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: "1.49.0"
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  probe:
    name: probe-${{ inputs.runner_tier }}
    runs-on: ${{ inputs.runner_tier == 'heavy' && vars.CI_RUNNER_MANAGED_HEAVY || vars.CI_RUNNER_MANAGED_LIGHT }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          include-nextest-version: "true"
          build-jobs-key: rust_probe.probe-${{ inputs.runner_tier }}

      - name: Install cargo-nextest
        if: ${{ startsWith(inputs.mode, 'nextest-') }}
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        with:
          tool: cargo-nextest@${{ steps.setup.outputs.nextest_version }}
          fallback: none

      - name: Setup read-only sccache
        id: sccache
        uses: ./.github/actions/sccache-setup
        with:
          role-arn: ${{ vars.AWS_CI_CACHE_PR_READONLY_ROLE_ARN }}

      - name: Run Rust Probe
        shell: bash
        env:
          RUST_PROBE_MODE: ${{ inputs.mode }}
          RUST_PROBE_TEST_TARGET: ${{ inputs.test_target }}
          RUST_PROBE_TEST_NAME: ${{ inputs.test_name }}
          RUST_PROBE_MANIFEST_PATH: ${{ inputs.manifest_path }}
          RUST_PROBE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUST_PROBE_ID: ${{ inputs.probe_id }}
          CARGO_PROFILE_TEST_DEBUG: "0"
          CARGO_PROFILE_DEV_DEBUG: "0"
        run: |
          bash .github/scripts/run-rust-probe.sh

      - name: Print sccache stats
        if: always()
        uses: ./.github/actions/sccache-stats
        with:
          enabled: ${{ steps.sccache.outputs.enabled || 'false' }}
          require-compiler-requests: "true"
