name: Rust Probe
run-name: Rust Probe ${{ inputs.probe_id }} ${{ inputs.mode }} @ ${{ inputs.ref }}

# Manual-only: run one constrained Rust compile/test probe on an ephemeral runner.
# This workflow is debugging feedback only and is not merge proof.

on:
  workflow_dispatch:
    inputs:
      runner_tier:
        description: Wrapper-selected Ubicloud runner tier from policy
        required: true
        type: string
      job_timeout_minutes:
        description: Wrapper-selected job timeout from policy
        required: true
        type: string
      ref:
        description: Exact pushed Git SHA to checkout
        required: true
        type: string
      expected_sha:
        description: Exact pushed Git SHA the runner must verify after checkout
        required: true
        type: string
      probe_id:
        description: Wrapper-generated probe correlation id
        required: true
        type: string
      mode:
        description: Probe mode to run
        required: true
        type: choice
        default: check-lib
        options:
          - check-lib
          - check-test-target
          - nextest-no-run-test-target
          - nextest-test-target
          - nextest-test-target-name
      test_target:
        description: Integration test target name for test-target modes
        required: false
        type: string
        default: ""
      test_name:
        description: Test name for nextest-test-target-name
        required: false
        type: string
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JUST_VERSION: "1.49.0"
  CARGO_TERM_COLOR: always
  RUST_VERIFICATION_ROOT_BASE: ${{ github.workspace }}/.rust-verification
  # Rust Probe reads the full-CI warm compile cache but uses only the
  # PR-read-only role, so branch probes cannot write into main's prefix.
  SCCACHE_BUCKET: ${{ vars.CI_SCCACHE_BUCKET }}
  SCCACHE_REGION: ${{ vars.CI_SCCACHE_REGION }}
  SCCACHE_S3_KEY_PREFIX: ${{ vars.CI_SCCACHE_S3_KEY_PREFIX }}
  SCCACHE_S3_SERVER_SIDE_ENCRYPTION: "true"
  SCCACHE_IGNORE_SERVER_IO_ERROR: "1"

permissions:
  contents: read

jobs:
  probe-unsupported-runner-tier:
    name: probe-unsupported-runner-tier
    if: ${{ inputs.runner_tier != 'heavy' && inputs.runner_tier != 'light' }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    timeout-minutes: 1
    steps:
      - name: Reject unsupported runner tier
        shell: bash
        env:
          RUST_PROBE_RUNNER_TIER: ${{ inputs.runner_tier }}
        run: |
          printf "Unsupported Rust Probe runner_tier: %s\n" "$RUST_PROBE_RUNNER_TIER" >&2
          exit 1

  probe-unsupported-job-timeout:
    name: probe-unsupported-job-timeout
    if: ${{ (inputs.runner_tier == 'heavy' && inputs.job_timeout_minutes != '60') || (inputs.runner_tier == 'light' && inputs.job_timeout_minutes != '60') }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    timeout-minutes: 1
    steps:
      - name: Reject unsupported job timeout
        shell: bash
        env:
          RUST_PROBE_JOB_TIMEOUT_MINUTES: ${{ inputs.job_timeout_minutes }}
        run: |
          printf "Unsupported Rust Probe job_timeout_minutes: %s\n" "$RUST_PROBE_JOB_TIMEOUT_MINUTES" >&2
          exit 1

  probe-heavy:
    name: probe-heavy
    if: ${{ inputs.runner_tier == 'heavy' && inputs.job_timeout_minutes == '60' }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_HEAVY }}
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          include-build-values: "true"
          include-deny-version: "true"
          include-nextest-version: "true"
          include-managed-target-dir: "true"
          install-rust-linker: "true"

      - name: Install cargo-nextest
        if: ${{ startsWith(inputs.mode, 'nextest-') }}
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        with:
          tool: cargo-nextest@${{ steps.setup.outputs.nextest_version }}
          fallback: none

      - name: Resolve sccache eligibility
        id: sccache-eligible
        continue-on-error: true
        env:
          PR_READONLY_ROLE_ARN: ${{ vars.AWS_CI_CACHE_PR_READONLY_ROLE_ARN }}
          BUCKET: ${{ vars.CI_SCCACHE_BUCKET }}
          REGION: ${{ vars.CI_SCCACHE_REGION }}
          PREFIX: ${{ vars.CI_SCCACHE_S3_KEY_PREFIX }}
        run: |
          vars_present=true
          [[ -n "$PR_READONLY_ROLE_ARN" && -n "$BUCKET" && -n "$REGION" && -n "$PREFIX" ]] || vars_present=false
          location_matches=true
          [[ "$BUCKET" == "bolt-v2-ci-cache-675819144420-us-east-2" && "$REGION" == "us-east-2" && "$PREFIX" == "sccache/bolt-v2/arm64/root-nextest/" ]] || location_matches=false
          if [[ "$vars_present" == "true" && "$location_matches" == "true" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
          echo "role_arn=$PR_READONLY_ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "cache_mode=read_only" >> "$GITHUB_OUTPUT"
          echo "cache_mode=read_only vars_present=$vars_present location_matches=$location_matches"

      - name: Configure AWS credentials for sccache
        id: sccache-aws
        if: steps.sccache-eligible.outputs.eligible == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ steps.sccache-eligible.outputs.role_arn }}
          aws-region: ${{ vars.CI_SCCACHE_REGION }}

      - name: Install sccache
        id: sccache-install
        if: steps.sccache-eligible.outputs.eligible == 'true' && steps.sccache-aws.outcome == 'success'
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Resolve sccache enablement
        id: sccache
        continue-on-error: true
        run: |
          enabled=false
          if [[ "${{ steps.sccache-eligible.outputs.eligible }}" == "true" \
                && "${{ steps.sccache-aws.outcome }}" == "success" \
                && "${{ steps.sccache-install.outcome }}" == "success" \
                && -n "${SCCACHE_PATH:-}" ]]; then
            if "$SCCACHE_PATH" --start-server; then
              "$SCCACHE_PATH" --zero-stats || true
              enabled=true
            else
              echo "sccache server failed to start; building without cache"
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "sccache enabled=$enabled"

      - name: Summarize sccache state
        if: always()
        shell: bash
        env:
          SCCACHE_ELIGIBLE: ${{ steps.sccache-eligible.outputs.eligible || 'false' }}
          SCCACHE_ENABLED: ${{ steps.sccache.outputs.enabled || 'false' }}
          SCCACHE_AWS_OUTCOME: ${{ steps.sccache-aws.outcome || 'skipped' }}
          SCCACHE_INSTALL_OUTCOME: ${{ steps.sccache-install.outcome || 'skipped' }}
        run: |
          echo "sccache read-only cache: eligible=${SCCACHE_ELIGIBLE} enabled=${SCCACHE_ENABLED} aws=${SCCACHE_AWS_OUTCOME} install=${SCCACHE_INSTALL_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCCACHE_ENABLED" != "true" ]]; then
            echo "::notice::sccache read-only cache disabled; compiling without remote cache"
          fi

      - name: Run Rust Probe
        shell: bash
        env:
          RUST_PROBE_MODE: ${{ inputs.mode }}
          RUST_PROBE_TEST_TARGET: ${{ inputs.test_target }}
          RUST_PROBE_TEST_NAME: ${{ inputs.test_name }}
          RUST_PROBE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUST_PROBE_ID: ${{ inputs.probe_id }}
          BOLT_RUST_VERIFICATION_SCCACHE: ${{ steps.sccache.outputs.enabled == 'true' && '1' || '0' }}
        run: |
          case "$RUST_PROBE_MODE" in
            nextest-test-target|nextest-test-target-name)
              RUST_PROBE_COMPILE_ONLY=1 bash .github/scripts/sccache-fail-open.sh --on any "$RUNNER_TEMP/rust-probe-compile.log" bash .github/scripts/run-rust-probe.sh
              BOLT_RUST_VERIFICATION_SCCACHE=0 bash .github/scripts/run-rust-probe.sh
              ;;
            *)
              bash .github/scripts/sccache-fail-open.sh --on any "$RUNNER_TEMP/rust-probe.log" bash .github/scripts/run-rust-probe.sh
              ;;
          esac

      - name: Print sccache stats
        if: always() && steps.sccache.outputs.enabled == 'true'
        run: '"$SCCACHE_PATH" --show-stats || true'

  probe-light:
    name: probe-light
    if: ${{ inputs.runner_tier == 'light' && inputs.job_timeout_minutes == '60' }}
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    timeout-minutes: ${{ fromJSON(inputs.job_timeout_minutes) }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Setup environment
        id: setup
        uses: ./.github/actions/setup-environment
        with:
          just-version: ${{ env.JUST_VERSION }}
          include-build-values: "true"
          include-deny-version: "true"
          include-nextest-version: "true"
          include-managed-target-dir: "true"
          install-rust-linker: "true"

      - name: Install cargo-nextest
        if: ${{ startsWith(inputs.mode, 'nextest-') }}
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538 # v2.81.1
        with:
          tool: cargo-nextest@${{ steps.setup.outputs.nextest_version }}
          fallback: none

      - name: Resolve sccache eligibility
        id: sccache-eligible
        continue-on-error: true
        env:
          PR_READONLY_ROLE_ARN: ${{ vars.AWS_CI_CACHE_PR_READONLY_ROLE_ARN }}
          BUCKET: ${{ vars.CI_SCCACHE_BUCKET }}
          REGION: ${{ vars.CI_SCCACHE_REGION }}
          PREFIX: ${{ vars.CI_SCCACHE_S3_KEY_PREFIX }}
        run: |
          vars_present=true
          [[ -n "$PR_READONLY_ROLE_ARN" && -n "$BUCKET" && -n "$REGION" && -n "$PREFIX" ]] || vars_present=false
          location_matches=true
          [[ "$BUCKET" == "bolt-v2-ci-cache-675819144420-us-east-2" && "$REGION" == "us-east-2" && "$PREFIX" == "sccache/bolt-v2/arm64/root-nextest/" ]] || location_matches=false
          if [[ "$vars_present" == "true" && "$location_matches" == "true" ]]; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
          fi
          echo "role_arn=$PR_READONLY_ROLE_ARN" >> "$GITHUB_OUTPUT"
          echo "cache_mode=read_only" >> "$GITHUB_OUTPUT"
          echo "cache_mode=read_only vars_present=$vars_present location_matches=$location_matches"

      - name: Configure AWS credentials for sccache
        id: sccache-aws
        if: steps.sccache-eligible.outputs.eligible == 'true'
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@e7f100cf4c008499ea8adda475de1042d6975c7b # v6.2.0
        with:
          role-to-assume: ${{ steps.sccache-eligible.outputs.role_arn }}
          aws-region: ${{ vars.CI_SCCACHE_REGION }}

      - name: Install sccache
        id: sccache-install
        if: steps.sccache-eligible.outputs.eligible == 'true' && steps.sccache-aws.outcome == 'success'
        continue-on-error: true
        uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: "v0.10.0"

      - name: Resolve sccache enablement
        id: sccache
        continue-on-error: true
        run: |
          enabled=false
          if [[ "${{ steps.sccache-eligible.outputs.eligible }}" == "true" \
                && "${{ steps.sccache-aws.outcome }}" == "success" \
                && "${{ steps.sccache-install.outcome }}" == "success" \
                && -n "${SCCACHE_PATH:-}" ]]; then
            if "$SCCACHE_PATH" --start-server; then
              "$SCCACHE_PATH" --zero-stats || true
              enabled=true
            else
              echo "sccache server failed to start; building without cache"
            fi
          fi
          echo "enabled=$enabled" >> "$GITHUB_OUTPUT"
          echo "sccache enabled=$enabled"

      - name: Summarize sccache state
        if: always()
        shell: bash
        env:
          SCCACHE_ELIGIBLE: ${{ steps.sccache-eligible.outputs.eligible || 'false' }}
          SCCACHE_ENABLED: ${{ steps.sccache.outputs.enabled || 'false' }}
          SCCACHE_AWS_OUTCOME: ${{ steps.sccache-aws.outcome || 'skipped' }}
          SCCACHE_INSTALL_OUTCOME: ${{ steps.sccache-install.outcome || 'skipped' }}
        run: |
          echo "sccache read-only cache: eligible=${SCCACHE_ELIGIBLE} enabled=${SCCACHE_ENABLED} aws=${SCCACHE_AWS_OUTCOME} install=${SCCACHE_INSTALL_OUTCOME}" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$SCCACHE_ENABLED" != "true" ]]; then
            echo "::notice::sccache read-only cache disabled; compiling without remote cache"
          fi

      - name: Run Rust Probe
        shell: bash
        env:
          RUST_PROBE_MODE: ${{ inputs.mode }}
          RUST_PROBE_TEST_TARGET: ${{ inputs.test_target }}
          RUST_PROBE_TEST_NAME: ${{ inputs.test_name }}
          RUST_PROBE_EXPECTED_SHA: ${{ inputs.expected_sha }}
          RUST_PROBE_ID: ${{ inputs.probe_id }}
          BOLT_RUST_VERIFICATION_SCCACHE: ${{ steps.sccache.outputs.enabled == 'true' && '1' || '0' }}
        run: |
          case "$RUST_PROBE_MODE" in
            nextest-test-target|nextest-test-target-name)
              RUST_PROBE_COMPILE_ONLY=1 bash .github/scripts/sccache-fail-open.sh --on any "$RUNNER_TEMP/rust-probe-compile.log" bash .github/scripts/run-rust-probe.sh
              BOLT_RUST_VERIFICATION_SCCACHE=0 bash .github/scripts/run-rust-probe.sh
              ;;
            *)
              bash .github/scripts/sccache-fail-open.sh --on any "$RUNNER_TEMP/rust-probe.log" bash .github/scripts/run-rust-probe.sh
              ;;
          esac

      - name: Print sccache stats
        if: always() && steps.sccache.outputs.enabled == 'true'
        run: '"$SCCACHE_PATH" --show-stats || true'
