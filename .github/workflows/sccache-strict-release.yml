name: Strict sccache release

on:
  pull_request:
  workflow_dispatch:
    inputs:
      sha:
        description: Full exact-current main SHA for a publication run
        required: true
        type: string
      publish:
        description: Publish immutable release assets
        required: true
        default: false
        type: boolean

permissions: {}

jobs:
  preflight:
    name: Bind source and publication controls
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    permissions:
      actions: read
      contents: read
    outputs:
      head_sha: ${{ steps.bind.outputs.head_sha }}
      publisher_ready: ${{ steps.bind.outputs.publisher_ready }}
      replicas: ${{ steps.bind.outputs.replicas }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Bind exact source and live controls
        id: bind
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || false }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPOSITORY: ${{ github.repository }}
          REQUESTED_SHA: ${{ github.event_name == 'workflow_dispatch' && inputs.sha || github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          [[ "$DEFAULT_BRANCH" == "main" ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$(git rev-parse HEAD)" == "$REQUESTED_SHA" ]]
          replicas="$(python3.12 scripts/sccache_strict.py show-target \
            --config ci/sccache-strict.toml --architecture ARM64 | jq -c '.replicas')"
          echo "replicas=$replicas" >> "$GITHUB_OUTPUT"
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            [[ "$PUBLISH" == "false" ]]
            [[ "$REQUESTED_SHA" == "$PR_HEAD_SHA" ]]
            {
              echo "head_sha=$REQUESTED_SHA"
              echo "publisher_ready=false"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          [[ "$EVENT_NAME" == "workflow_dispatch" ]]
          [[ "$EVENT_REF" == "refs/heads/$DEFAULT_BRANCH" ]]
          remote_sha="$(gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/branches/$DEFAULT_BRANCH" --jq '.commit.sha')"
          [[ "$REQUESTED_SHA" == "$EVENT_SHA" && "$REQUESTED_SHA" == "$remote_sha" ]]
          echo "head_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"
          if [[ "$PUBLISH" != "true" ]]; then
            echo "publisher_ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          gh api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/environments/strict-sccache-publisher" > environment.json
          python3.12 scripts/sccache_strict.py validate-publish-context \
            --event-name "$EVENT_NAME" \
            --requested-sha "$REQUESTED_SHA" \
            --event-sha "$EVENT_SHA" \
            --remote-main-sha "$remote_sha" \
            --event-ref "$EVENT_REF" \
            --environment-json environment.json \
            --environment-name strict-sccache-publisher
          echo "publisher_ready=true" >> "$GITHUB_OUTPUT"

  build-arm64:
    name: Build ARM64 replica ${{ matrix.replica }}
    needs: preflight
    runs-on: ${{ vars.CI_RUNNER_MANAGED_HEAVY }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        replica: ${{ fromJSON(needs.preflight.outputs.replicas) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build cacheless governed candidate
        env:
          ARCHITECTURE: ARM64
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          REPLICA: ${{ matrix.replica }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        id: build
        run: scripts/build_strict_sccache.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-ARM64-${{ matrix.replica }}
          path: ${{ steps.build.outputs.candidate_path }}
          if-no-files-found: error
          retention-days: 1

  build-x64:
    name: Build X64 replica ${{ matrix.replica }}
    needs: preflight
    runs-on: ${{ vars.CI_RUNNER_MANAGED_LIGHT }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        replica: ${{ fromJSON(needs.preflight.outputs.replicas) }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - name: Build cacheless governed candidate
        env:
          ARCHITECTURE: X64
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          REPLICA: ${{ matrix.replica }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        id: build
        run: scripts/build_strict_sccache.sh

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-X64-${{ matrix.replica }}
          path: ${{ steps.build.outputs.candidate_path }}
          if-no-files-found: error
          retention-days: 1

  verify:
    name: Verify exact reproducible candidates
    needs: [preflight, build-arm64, build-x64]
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-verify/candidates

      - name: Verify all four candidates
        env:
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
          VERIFY_ROOT: ${{ runner.temp }}/strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-verify
        run: |
          set -euo pipefail
          mapfile -t replicas < <(python3.12 scripts/sccache_strict.py show-target \
            --config ci/sccache-strict.toml --architecture ARM64 | jq -r '.replicas[]')
          candidate_args=()
          for architecture in ARM64 X64; do
            for replica in "${replicas[@]}"; do
              directory="$VERIFY_ROOT/candidates/strict-sccache-$RUN_ID-$RUN_ATTEMPT-$architecture-$replica"
              candidate_args+=(--candidate "$architecture" "$replica" \
                "$directory/manifest.json" "$directory/sccache")
            done
          done
          python3.12 scripts/sccache_strict.py verify-candidates \
            --config ci/sccache-strict.toml \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            "${candidate_args[@]}" \
            --provenance-output "$VERIFY_ROOT/provenance.json" > "$VERIFY_ROOT/verified.json"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-verified
          path: ${{ runner.temp }}/strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-verify
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish immutable strict assets
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish && needs.preflight.outputs.publisher_ready == 'true' }}
    needs: [preflight, verify]
    runs-on: ${{ vars.CI_RUNNER_GITHUB_HOSTED }}
    environment: strict-sccache-publisher
    concurrency:
      group: strict-sccache-publisher
      cancel-in-progress: false
    permissions:
      actions: read
      attestations: read
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.preflight.outputs.head_sha }}
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-verified
          path: ${{ runner.temp }}/strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-publish/verified-bundle

      - name: Reverify exact verified bundle
        id: publish-input
        env:
          BUNDLE_ROOT: ${{ runner.temp }}/strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-publish/verified-bundle
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          PUBLISH_ROOT: ${{ runner.temp }}/strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-publish/work
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir "$PUBLISH_ROOT"
          target_json="$(python3.12 scripts/sccache_strict.py show-target \
            --config ci/sccache-strict.toml --architecture ARM64)"
          mapfile -t replicas < <(jq -r '.replicas[]' <<< "$target_json")
          candidate_args=()
          for architecture in ARM64 X64; do
            for replica in "${replicas[@]}"; do
              directory="$BUNDLE_ROOT/candidates/strict-sccache-$RUN_ID-$RUN_ATTEMPT-$architecture-$replica"
              candidate_args+=(--candidate "$architecture" "$replica" \
                "$directory/manifest.json" "$directory/sccache")
            done
          done
          python3.12 scripts/sccache_strict.py verify-candidates \
            --config ci/sccache-strict.toml \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            "${candidate_args[@]}" \
            --provenance-output "$PUBLISH_ROOT/publisher-provenance.json" \
            > "$PUBLISH_ROOT/publisher-verified.json"
          cmp "$BUNDLE_ROOT/provenance.json" "$PUBLISH_ROOT/publisher-provenance.json"
          cmp "$BUNDLE_ROOT/verified.json" "$PUBLISH_ROOT/publisher-verified.json"

          tag="$(jq -r '.release_tag' "$PUBLISH_ROOT/publisher-verified.json")"
          provenance_name="$(jq -r '.provenance_name' "$PUBLISH_ROOT/publisher-verified.json")"
          arm_name="$(jq -r '.assets.ARM64.name' "$PUBLISH_ROOT/publisher-verified.json")"
          x64_name="$(jq -r '.assets.X64.name' "$PUBLISH_ROOT/publisher-verified.json")"
          mkdir "$PUBLISH_ROOT/publish-input"
          cp "$BUNDLE_ROOT/candidates/strict-sccache-$RUN_ID-$RUN_ATTEMPT-ARM64-${replicas[0]}/sccache" \
            "$PUBLISH_ROOT/publish-input/$arm_name"
          cp "$BUNDLE_ROOT/candidates/strict-sccache-$RUN_ID-$RUN_ATTEMPT-X64-${replicas[0]}/sccache" \
            "$PUBLISH_ROOT/publish-input/$x64_name"
          cp "$PUBLISH_ROOT/publisher-provenance.json" \
            "$PUBLISH_ROOT/publish-input/$provenance_name"
          {
            echo "tag=$tag"
            echo "provenance_name=$provenance_name"
            echo "arm_name=$arm_name"
            echo "x64_name=$x64_name"
            echo "attestation_attempts=$(jq -r '.attestation_attempts' <<< "$target_json")"
            echo "attestation_interval_seconds=$(jq -r '.attestation_interval_seconds' <<< "$target_json")"
            echo "publish_root=$PUBLISH_ROOT"
          } >> "$GITHUB_OUTPUT"

      - name: Publish and cryptographically verify immutable release
        env:
          ATTESTATION_ATTEMPTS: ${{ steps.publish-input.outputs.attestation_attempts }}
          ATTESTATION_INTERVAL_SECONDS: ${{ steps.publish-input.outputs.attestation_interval_seconds }}
          EVENT_REF: ${{ github.ref }}
          EVENT_SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.publish-input.outputs.tag }}
          ARM_NAME: ${{ steps.publish-input.outputs.arm_name }}
          X64_NAME: ${{ steps.publish-input.outputs.x64_name }}
          PROVENANCE_NAME: ${{ steps.publish-input.outputs.provenance_name }}
          PUBLISH_ROOT: ${{ steps.publish-input.outputs.publish_root }}
        run: |
          set -euo pipefail
          cd "$PUBLISH_ROOT"
          publish_token="$GH_TOKEN"
          unset GH_TOKEN
          github_api() {
            GH_TOKEN="$publish_token" gh api "$@"
          }
          github_release() {
            GH_TOKEN="$publish_token" gh release "$@"
          }
          if github_api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" >/dev/null 2>&1; then
            echo "release tag already exists: $TAG" >&2
            exit 1
          fi
          releases="$(github_api --paginate --slurp -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases?per_page=100")"
          if jq -e --arg tag "$TAG" 'flatten | any(.tag_name == $tag)' \
            <<< "$releases" >/dev/null; then
            echo "release or draft already exists: $TAG" >&2
            exit 1
          fi

          validate_current_main() {
            local remote_sha
            remote_sha="$(github_api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$REPOSITORY/branches/main" --jq '.commit.sha')"
            github_api -H 'X-GitHub-Api-Version: 2026-03-10' \
              "repos/$REPOSITORY/environments/strict-sccache-publisher" > environment.json
            python3.12 "$GITHUB_WORKSPACE/scripts/sccache_strict.py" validate-publish-context \
              --event-name workflow_dispatch \
              --requested-sha "$HEAD_SHA" \
              --event-sha "$EVENT_SHA" \
              --remote-main-sha "$remote_sha" \
              --event-ref "$EVENT_REF" \
              --environment-json environment.json \
              --environment-name strict-sccache-publisher
          }
          validate_current_main

          release_id=""
          ownership_marker="$(python3.12 "$GITHUB_WORKSPACE/scripts/sccache_strict.py" \
            release-ownership-marker \
            --repository "$REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            --tag "$TAG")"
          cleanup_mutable_release() {
            local cleanup_id current tag_current
            local -a cleanup_args
            set +e
            if [[ -n "$release_id" ]]; then
              current="$(github_api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$REPOSITORY/releases/$release_id" 2>/dev/null)" || return
            else
              current="$(github_api --paginate --slurp \
                -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$REPOSITORY/releases?per_page=100" 2>/dev/null)" || return
            fi
            printf '%s\n' "$current" > cleanup-release.json
            cleanup_args=(
              select-cleanup-release
              --releases-json cleanup-release.json
              --tag "$TAG"
              --head-sha "$HEAD_SHA"
              --ownership-marker "$ownership_marker"
            )
            if [[ -n "$release_id" ]]; then
              cleanup_args+=(--release-id "$release_id")
            fi
            if cleanup_id="$(python3.12 "$GITHUB_WORKSPACE/scripts/sccache_strict.py" \
              "${cleanup_args[@]}" 2>/dev/null)" && [[ -n "$cleanup_id" ]]; then
              github_api --method DELETE -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$REPOSITORY/releases/$cleanup_id"
              if tag_current="$(github_api -H 'X-GitHub-Api-Version: 2026-03-10' \
                "repos/$REPOSITORY/git/ref/tags/$TAG" 2>/dev/null)"; then
                printf '%s\n' "$tag_current" > cleanup-tag.json
                if ! python3.12 "$GITHUB_WORKSPACE/scripts/sccache_strict.py" \
                  validate-cleanup-tag \
                  --tag-json cleanup-tag.json \
                  --tag "$TAG" \
                  --head-sha "$HEAD_SHA"; then
                  echo 'cleanup left a tag whose identity changed after publication' >&2
                  return
                fi
                github_api --method DELETE -H 'X-GitHub-Api-Version: 2026-03-10' \
                  "repos/$REPOSITORY/git/refs/tags/$TAG"
              fi
            fi
          }
          trap cleanup_mutable_release EXIT
          release="$(github_api --method POST -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases" \
            -f tag_name="$TAG" \
            -f target_commitish="$HEAD_SHA" \
            -f name="$TAG" \
            -f body="$ownership_marker" \
            -F draft=true)"
          release_id="$(jq -er '.id' <<< "$release")"
          jq -e --arg tag "$TAG" --arg sha "$HEAD_SHA" --arg body "$ownership_marker" \
            '.tag_name == $tag and .target_commitish == $sha and .draft == true and .body == $body' \
            <<< "$release" >/dev/null
          upload_url="$(jq -er '.upload_url | sub("\\{.*$"; "")' <<< "$release")"
          [[ "$upload_url" == https://uploads.github.com/* ]]
          for asset in "$ARM_NAME" "$X64_NAME" "$PROVENANCE_NAME"; do
            curl --fail-with-body --silent --show-error \
              --proto '=https' --tlsv1.2 --request POST \
              -H "Authorization: Bearer $publish_token" \
              -H 'Accept: application/vnd.github+json' \
              -H 'Content-Type: application/octet-stream' \
              -H 'X-GitHub-Api-Version: 2026-03-10' \
              --data-binary "@publish-input/$asset" "$upload_url?name=$asset" >/dev/null
          done

          validate_current_main
          github_api --method PATCH -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/releases/$release_id" -F draft=false > release.json
          if ! jq -e '.immutable == true' release.json >/dev/null; then
            echo 'GitHub published a mutable release; removing its exact release and tag' >&2
            exit 1
          fi
          if ! validate_current_main; then
            echo 'main moved after publication; retaining the immutable candidate without adoption authority' >&2
            exit 1
          fi
          github_api -H 'X-GitHub-Api-Version: 2026-03-10' \
            "repos/$REPOSITORY/git/ref/tags/$TAG" > tag.json

          verified_attestation=false
          for ((attempt = 1; attempt <= ATTESTATION_ATTEMPTS; attempt++)); do
            if github_release verify "$TAG" --repo "$REPOSITORY" --format json \
              > release-attestation.json; then
              verified_attestation=true
              break
            fi
            if (( attempt < ATTESTATION_ATTEMPTS )); then
              sleep "$ATTESTATION_INTERVAL_SECONDS"
            fi
          done
          [[ "$verified_attestation" == "true" ]]

          mkdir release-download
          github_release download "$TAG" --repo "$REPOSITORY" --dir release-download
          for asset in "$ARM_NAME" "$X64_NAME" "$PROVENANCE_NAME"; do
            cmp "publish-input/$asset" "release-download/$asset"
            github_release verify-asset "$TAG" "release-download/$asset" \
              --repo "$REPOSITORY" --format json > "verified-$asset.json"
          done

          trap - EXIT

      - name: Verify exact immutable release predicate without write credentials
        env:
          BUNDLE_ROOT: ${{ runner.temp }}/strict-sccache-${{ github.run_id }}-${{ github.run_attempt }}-publish/verified-bundle
          HEAD_SHA: ${{ needs.preflight.outputs.head_sha }}
          PUBLISH_ROOT: ${{ steps.publish-input.outputs.publish_root }}
          REPOSITORY: ${{ github.repository }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          cd "$PUBLISH_ROOT"
          mapfile -t replicas < <(python3.12 "$GITHUB_WORKSPACE/scripts/sccache_strict.py" show-target \
            --config "$GITHUB_WORKSPACE/ci/sccache-strict.toml" \
            --architecture ARM64 | jq -r '.replicas[]')
          candidate_args=()
          for architecture in ARM64 X64; do
            for replica in "${replicas[@]}"; do
              directory="$BUNDLE_ROOT/candidates/strict-sccache-$RUN_ID-$RUN_ATTEMPT-$architecture-$replica"
              candidate_args+=(--candidate "$architecture" "$replica" \
                "$directory/manifest.json" "$directory/sccache")
            done
          done
          python3.12 "$GITHUB_WORKSPACE/scripts/sccache_strict.py" verify-release-record \
            --config "$GITHUB_WORKSPACE/ci/sccache-strict.toml" \
            --repository "$REPOSITORY" \
            --run-id "$RUN_ID" \
            --run-attempt "$RUN_ATTEMPT" \
            --head-sha "$HEAD_SHA" \
            "${candidate_args[@]}" \
            --release-json release.json \
            --tag-json tag.json
