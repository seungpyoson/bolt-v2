name: Test GitHub Models

on: workflow_dispatch

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      models: read
    steps:
      - name: Probe Models
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Model Probe ==="
          for model in openai/gpt-4.1 openai/gpt-4o openai/gpt-4.1-mini openai/gpt-4o-mini; do
            echo "=== $model ==="
            curl -s -w "\nSTATUS:%{http_code}\n" \
              https://models.github.ai/inference/chat/completions \
              -H "Content-Type: application/json" \
              -H "Authorization: Bearer $TOKEN" \
              -d "{\"model\":\"$model\",\"messages\":[{\"role\":\"user\",\"content\":\"hi\"}],\"max_tokens\":5}" | head -c 800
            echo ""
            echo "===================="
          done
          echo "Done"