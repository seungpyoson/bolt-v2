# One serial queue for stacks rooted at main. GitHub Actions checks remain
# visible advisory evidence; neither queue admission nor merge depends on their
# status. The live main ruleset owns reviewer approval and mergeability.
merge_queue:
  max_parallel_checks: 1
  reset_on_external_merge: always

queue_rules:
  - name: default
    merge_method: merge
    batch_size: 20
    batch_max_wait_time: 5 minutes
    branch_protection_injection_mode: queue
    merge_bot_account: seungpyoson
