merge_queue:
  max_parallel_checks: 1
  reset_on_external_merge: always

queue_rules:
  # Exceptional path only. Normal merge sessions use the default queue below.
  - name: hotfix
    queue_conditions:
      - label = hotfix
    merge_conditions:
      - approved-reviews-by = sp-reviewer
    branch_protection_injection_mode: merge
    batch_size: 1
    batch_max_wait_time: 30 seconds
    batch_max_failure_resolution_attempts: 0
    checks_timeout: 150 minutes
    draft_bot_account: null
    merge_method: squash

  - name: default
    queue_conditions: []
    merge_conditions:
      - approved-reviews-by = sp-reviewer
    branch_protection_injection_mode: merge
    batch_size: 1
    batch_max_wait_time: 5 minutes
    batch_max_failure_resolution_attempts: 3
    checks_timeout: 150 minutes
    draft_bot_account: null
    merge_method: squash

priority_rules:
  - name: hotfix
    conditions:
      - label = hotfix
    priority: 10000
    allow_checks_interruption: true
