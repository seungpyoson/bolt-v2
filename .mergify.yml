# Single serial merge queue for main. Approval queues; the four advisory
# checks must pass on the branch after Mergify updates it with latest main.
merge_queue:
  max_parallel_checks: 1

queue_rules:
  - name: default
    queue_conditions:
      - approved-reviews-by = sp-reviewer
    merge_conditions:
      - check-success = fmt
      - check-success = clippy
      - check-success = test
      - check-success = build
    batch_size: 1
    merge_method: squash
    # CI checks are advisory (no required status contexts); native review rules
    # remain enforced by GitHub. Proven merge identity from the prior config.
    branch_protection_injection_mode: none
    merge_bot_account: seungpyoson
    update_method: rebase
    update_bot_account: seungpyoson
