# no-mistakes per-repo configuration
# https://kunchenguid.github.io/no-mistakes/reference/repo-config/
#
# `agent:` omitted — inherits each developer's global ~/.no-mistakes/config.yaml.

commands:
  # All Rust verification routes through the managed wrapper via just recipes.
  test: "just test"
  lint: "just clippy"
  # Formatting mutation is likewise repository-wide.
  format: "just fmt"
