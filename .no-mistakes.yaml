# no-mistakes per-repo configuration
# https://kunchenguid.github.io/no-mistakes/reference/repo-config/
#
# `agent:` omitted — inherits each developer's global ~/.no-mistakes/config.yaml.

commands:
  # Do not run local Cargo here. GitHub CI is the broad verifier for this repo;
  # no-mistakes only checks exact-head CI status to avoid duplicate local target
  # output.
  test: "python3 scripts/no_mistakes_ci_gate.py test"
  lint: "python3 scripts/no_mistakes_ci_gate.py lint"
  format: "python3 scripts/no_mistakes_ci_gate.py format"
