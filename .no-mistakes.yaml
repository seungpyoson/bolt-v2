# no-mistakes per-repo configuration
# https://kunchenguid.github.io/no-mistakes/reference/repo-config/
#
# `agent:` omitted — inherits each developer's global ~/.no-mistakes/config.yaml.

commands:
  # Plain raw-cargo recipes; remote-first is an economic default, not a fence.
  # Prefer pushing and reading advisory CI evidence over local compile-heavy runs.
  test: "just test"
  lint: "just clippy"
  # Formatting mutation is repository-wide (root + BTE workspaces).
  format: "just fmt"
