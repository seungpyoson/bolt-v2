[package]
name = "bolt-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
autotests = false

[[test]]
name = "iv"
path = "tests/iv.rs"

[[test]]
name = "outcome_groups"
path = "tests/outcome_groups.rs"

[[test]]
name = "maker_taker"
path = "tests/maker_taker.rs"

[[test]]
name = "kill_switch_loss"
path = "tests/kill_switch_loss.rs"

[[test]]
name = "pricing"
path = "tests/pricing.rs"

[[test]]
name = "admission_orders"
path = "tests/admission_orders.rs"

[[test]]
name = "platform_config"
path = "tests/platform_config.rs"

