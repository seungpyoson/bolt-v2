parquet = "58.3.0"
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
url = "2"
ustr = "1.1.0"
zeroize = "1.8.2"

[dev-dependencies]
arrow = "58.3.0"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
# Already a runtime dependency; mirrored here so integration tests can assert on the
# composed runtime config's TOML structure (e.g. deterministic key ordering, #768).
toml = "1.1"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
