[package]
name = "bolt-v2"
version = "0.1.0"
edition = "2024"
publish = false
autotests = false

[[test]]
name = "iv"
path = "tests/iv.rs"

[[test]]
name = "outcome_groups"
path = "tests/outcome_groups.rs"

