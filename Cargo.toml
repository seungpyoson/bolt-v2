[features]
offline-current-evidence = []
test-current-evidence-inspection = []

[dependencies]
ahash = "0.8.12"
alloy-primitives = "=1.6.1"
alloy-signer = "=2.2.0"
alloy-signer-local = "=2.2.0"
anyhow = "1"
arc-swap = "1"
arrow = "58.3.0"
async-trait = "0.1"
aws-config = "1.8.17"
aws-sdk-ssm = { version = "1.111.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22"
bolt-economics-core = { path = "crates/economics-core" }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.32"
getrandom = "0.4.2"
hex = "0.4"
libc = "0.2"
log = "0.4"
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-binance = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-bitmex = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-bybit = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-coinbase = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-deribit = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-hyperliquid = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-kraken = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6", features = ["transport-sockudo"] }
nautilus-okx = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-persistence-macros = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-polymarket = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-system = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "e4167fd1ed5ce9db06b43a81417ab4096b8b84b6" }
parquet = "58.3.0"
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
url = "2"
ustr = "1.1.0"
zeroize = "1.8.2"

[dev-dependencies]
arrow = "58.3.0"
# The workflow derives the cargo-codspeed CLI version from this exact dependency;
# CodSpeedHQ/action is an independently pinned release stream.
divan = { package = "codspeed-divan-compat", version = "=5.0.1" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "=0.29.0"
# Already a runtime dependency; mirrored here so integration tests can assert on the
# composed runtime config's TOML structure (e.g. deterministic key ordering, #768).
toml = "1.1"

[[bench]]
name = "codspeed_pricing"
harness = false

[[bench]]
name = "codspeed_realized_volatility"
harness = false

[[bench]]
name = "codspeed_outcome_group_scan"
harness = false

[build-dependencies]
sha2 = "0.10.9"
toml = "1.1"

[profile.release]
lto = "thin"
strip = true
panic = "abort"

[profile.bench]
# CodSpeed uses this profile as a relative-regression indicator; disabling LTO
# reduces peak memory while the managed runner supplies the required disk capacity.
lto = false
