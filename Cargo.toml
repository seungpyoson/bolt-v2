[package]
name = "bolt-v2"
version = "0.1.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
ahash = "0.8.12"
anyhow = "1"
arc-swap = "1"
arrow = "58.3.0"
async-trait = "0.1"
aws-config = "1.8.17"
aws-sdk-ssm = { version = "1.110.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.32"
getrandom = "0.4.2"
hex = "0.4"
libc = "0.2"
log = "0.4"
# Backtesting Engine Gate-1 proof (spec 023 BTE-001), optional + behind the
# `bte-gate-proof` feature so the production LiveNode build never compiles it.
# `streaming` is the feature that gates BacktestNode + the catalog-driven API;
# pure Rust, no pyo3 (do NOT enable `python`).
nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c", default-features = false, features = ["streaming"], optional = true }
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-binance = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c", features = ["transport-sockudo"] }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-persistence-macros = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-polymarket = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-system = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
parquet = "58.3.0"
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
url = "2"
ustr = "1.1.0"
zeroize = "1.8.2"

[features]
# Backtesting Engine Gate-1/Gate-2 proof (spec 023 §Implementation Gates 1-2,
# issue #438). OFF by default: the production binary never compiles
# `nautilus-backtest` or the `nautilus-persistence` `cloud` (S3) backend.
# Enable only to run the gate proof:
#   cargo test --features bte-gate-proof --test bte_gate1_backtest_proof
bte-gate-proof = ["dep:nautilus-backtest", "nautilus-persistence/cloud"]

[dev-dependencies]
arrow = "58.3.0"
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = true
panic = "abort"
