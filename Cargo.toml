[dependencies]
ahash = "0.8.12"
alloy-primitives = "=1.6.0"
anyhow = "1"
arc-swap = "1"
arrow = "58.3.0"
async-trait = "0.1"
aws-config = "1.8.17"
aws-sdk-ssm = { version = "1.111.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
futures-util = "0.3.32"
getrandom = "0.4.2"
hex = "0.4"
libc = "0.2"
log = "0.4"
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-binance = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-bitmex = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-bybit = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-coinbase = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-deribit = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-hyperliquid = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-kraken = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-live = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-network = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b", features = ["transport-sockudo"] }
nautilus-okx = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-persistence-macros = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-polymarket = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-portfolio = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-serialization = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-execution = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-system = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "8160730c7c550480b0a439fb11086a4c4de15f0b" }
parquet = "58.3.0"
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
toml = "1.1"
url = "2"
ustr = "1.1.0"
zeroize = "1.8.2"

[dev-dependencies]
arrow = "58.3.0"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }
tokio-tungstenite = "=0.29.0"
# Already a runtime dependency; mirrored here so integration tests can assert on the
# composed runtime config's TOML structure (e.g. deterministic key ordering, #768).
toml = "1.1"

[profile.release]
lto = "thin"
strip = true
panic = "abort"
