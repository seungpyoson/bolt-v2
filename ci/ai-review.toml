[github]
api_url = "https://api.github.com"
server_url = "https://github.com"
expected_bot_login = "github-actions[bot]"

[review]
max_comment_chars = 60000
response_chars_per_chunk = 8000

[pr_agent_mirror]
required_note_snippets = [
  "Review against AGENTS.md as the repository governance source",
  "This mirror is checked against ci/ai-review.toml by scripts/verify_ai_review_governance.py",
  "update ci/ai-review.toml and this block when the mirrored AGENTS.md rules change",
]

[[pr_agent_mirror.rules]]
name = "scope discipline"
snippets = [
  "Scope discipline: one branch or PR may cover only one declared issue, spec, task, or explicitly named slice",
  "flag out-of-scope changes, hidden adjacent work, and missing claimed scope",
]

[[pr_agent_mirror.rules]]
name = "no hardcodes"
snippets = [
  "NO HARDCODES: every runtime value comes from TOML config",
  "no string literals for IDs, quantities, timeouts, or any runtime value in code",
]

[[pr_agent_mirror.rules]]
name = "no dual paths"
snippets = [
  "NO DUAL PATHS: one way to do each thing",
  "one config format, one secret source, one build path",
]

[[pr_agent_mirror.rules]]
name = "no debts"
snippets = [
  "NO DEBTS: no TODO, no \"fix later\", no unpinned dependencies, no uncommitted work",
]

[[pr_agent_mirror.rules]]
name = "no credential display"
snippets = [
  "NO CREDENTIAL DISPLAY: never cat, print, or log API keys, private keys, or secrets",
]

[[pr_agent_mirror.rules]]
name = "ssm secret source"
snippets = [
  "SSM is the single secret source for product/runtime credentials",
  "GitHub Actions repository automation may use GitHub's ephemeral `GITHUB_TOKEN`",
  "`JULES_API_KEY` may live in GitHub Actions secrets only for repository code-maintenance advisory workflows",
  "it is not a product/runtime/deploy/live/trading secret, not an alternate GitHub token",
  "must not be exposed to AWS, market data, order execution, runtime, deploy, or live jobs",
  "Do not add environment variable fallbacks, alternate GitHub token names, or alternate secret backends",
]

[[pr_agent_mirror.rules]]
name = "provider runtime boundary evidence"
snippets = [
  "Provider/runtime boundary evidence is registered",
  "every deploy/readiness feeder that depends on provider runtime bytes or metadata must be in the boundary registry and source-fence guarded or issue-bound, expiring non-WebSocket deferral",
  "WebSocket-frame evidence must not be deferred",
]

[[pr_agent_mirror.rules]]
name = "evidence-driven verification"
snippets = [
  "Evidence-driven verification: every claim must map to tests",
  "External review happens only after local findings are resolved and exact-head CI or a user-approved equivalent is green",
]

[[pr_agent_mirror.rules]]
name = "remote-first rust verification"
snippets = [
  "Remote-first Rust verification: do not request local compile-heavy Rust checks by default",
  "request remote CI or allowed static checks",
]

[[pr_agent_mirror.rules]]
name = "required human review"
snippets = [
  "Required human review must be preserved",
  "agents must not merge or bypass the required reviewer gate",
]

[review.output_contract]
finding_required_labels = [
  "Severity:",
  "Evidence:",
  "Issue:",
  "Fix / verification:",
]
finding_guidance = [
  "blocking, high, medium, or low",
  "the smallest relevant snippet or line reference from the supplied chunk",
  "why this is a real behavior, safety, governance, or verification problem",
  "the concrete next step",
]
no_findings_indicator = "No hard-evidence findings"
no_findings_intro = "No hard-evidence findings in this chunk."
no_findings_required_labels = [
  "Coverage reviewed:",
  "Evidence basis:",
  "Risk areas considered:",
]
no_findings_guidance = [
  "<specific changed files or diff areas reviewed in this chunk>.",
  "supplied diff only; no omitted files, logs, or external state were assumed.",
  "correctness, security, workflow safety, verification, and repo-governance impact visible in this chunk.",
]
non_deliverable_indicators = [
  "review did not produce a deliverable",
  "review notice",
]

[review.pr_agent_output]
deliverable_headings = [
  "## PR Reviewer Guide",
  "## Incremental PR Reviewer Guide",
]
disabled_noise = []

[glm]
api_base = "https://api.z.ai/api/coding/paas/v4"
model = "glm-5.2"
temperature = 0.2
api_timeout_seconds = 180
review_max_chunk_chars = 60000
comment_marker = "<!-- ai-pr-reviewer-glm -->"
notice_marker = "<!-- ai-pr-reviewer-glm-notice -->"
source_label_template = "GLM direct fallback (`{model}`)"
deliverable_markers = [
  "## PR Reviewer Guide",
  "## Incremental PR Reviewer Guide",
  "<!-- ai-pr-reviewer-glm -->",
]

[glm.pr_agent]
model = "openai/glm-5.2"
fallback_models = ["openai/glm-5.2"]
source_label_template = "GLM PR-Agent (`{model}`)"
custom_model_max_tokens = 128000
large_patch_policy = "clip"
timeout_seconds = 300
auto_review = true
auto_describe = false
auto_improve = false

[glm.workflow]
job_timeout_minutes = 35
primary_timeout_minutes = 8
fallback_timeout_minutes = 20
setup_overhead_timeout_minutes = 7

[kimi]
api_base = "https://api.kimi.com/coding/v1"
model = "kimi-for-coding"
provider_type = "kimi"
model_max_context_size = 262144
default_thinking = true
telemetry_disabled = true
cli_timeout_seconds = 180
review_max_chunk_chars = 60000
deliverable_marker = "<!-- ai-pr-reviewer-kimi -->"
notice_marker = "<!-- ai-pr-reviewer-kimi-notice -->"
source_label_template = "Kimi Code CLI (`{model}`)"
cli_package = "@moonshot-ai/kimi-code@0.19.0"

[kimi.workflow]
node_version = "24"
job_timeout_minutes = 45
primary_timeout_minutes = 20
fallback_timeout_minutes = 20
setup_overhead_timeout_minutes = 5

[smoke]
max_tokens = 16

[smoke.workflow]
job_timeout_minutes = 10
