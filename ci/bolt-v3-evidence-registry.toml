[[producer]]
name = "strategy_input_snapshot_submit"
method = "record_strategy_input_snapshot"
record_kind = "strategy_input_snapshot"
gate_id = "bolt_v3.strategy_input_snapshot"
family = "market"
state_id = 144
allocation = "strategy_input_pricing_blocker"
classification = "event-keyed"
handler_reachability = ["quote", "book", "timer", "index-price"]
source_paths = ["entry_strategy_input_evidence_snapshot_at"]
named_readers = ["read_latest_entry_decision_evidence_chain"]
repeat_semantics = "every submit-linked snapshot remains append-complete"
dedupe_key_evidence = "non-empty client_order_id; no suppression"
recovery_bearing = true
suppression = "unsuppressed"
owner_decision_required = false

