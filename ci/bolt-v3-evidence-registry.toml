schema_version = 1
source_module = "src/bolt_v3_decision_evidence.rs"
identity_module = "src/bolt_v3_evidence_identity.rs"
closed_families = ["risk", "market", "system"]
allowed_classifications = ["event-keyed", "state-observation", "already-deduped", "no-named-reader"]
allowed_suppression = ["unsuppressed", "finite-episode"]
handler_sweep_roots = ["src/strategies", "src/bolt_v3_live_node.rs", "src/bolt_v3_live_node"]
non_evidence_per_tick_appenders = []

[[family]]
name = "risk"
capacity = 64
allocations = [
  { name = "admission_entry", start = 0, end = 8 },
  { name = "order_prepare_submit_fill_terminal", start = 8, end = 24 },
  { name = "position_exposure", start = 24, end = 32 },
  { name = "exit_cancel_replacement", start = 32, end = 48 },
  { name = "settlement_redemption", start = 48, end = 56 },
  { name = "reconciliation_dependency", start = 56, end = 62 },
  { name = "terminal_integrity", start = 62, end = 64 },
]

[[family]]
name = "market"
capacity = 256
allocations = [
  { name = "discovery_identity", start = 0, end = 32 },
  { name = "lifecycle_rollover", start = 32, end = 80 },
  { name = "subscription_book", start = 80, end = 144 },
  { name = "strategy_input_pricing_blocker", start = 144, end = 208 },
  { name = "dependency_health", start = 208, end = 240 },
  { name = "terminal_closed_window_skip", start = 240, end = 256 },
]

[[family]]
name = "system"
capacity = 64
allocations = [
  { name = "startup_recovery", start = 0, end = 16 },
  { name = "storage_archive", start = 16, end = 32 },
  { name = "authentication_network_provider", start = 32, end = 48 },
  { name = "capacity_host", start = 48, end = 60 },
  { name = "integrity_operator", start = 60, end = 64 },
]

[[reader]]
name = "read_latest_entry_decision_evidence_chain"
record_kinds = ["strategy_input_snapshot", "order_intent", "admission_decision"]
recovery_role = true

[[reader]]
name = "read_submit_reservation_recovery_evidence"
record_kinds = ["submit_reservation_metadata", "submit_reservation_fill"]
recovery_role = true

[[reader]]
name = "read_exit_evaluation_evidence"
record_kinds = ["exit_evaluation"]
recovery_role = false

[[reader]]
