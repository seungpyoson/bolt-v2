schema_version = 1

[codex.log]
path_family = "~/.codex/log/codex-tui.log"
category = "AI agent"
growth_shape = "single_file"
owner = "owned"
native_policy = "partial"
cleanup_mode = "rotate"
max_bytes = 104857600
retained_rotations = 2
active_writer_processes = ["codex", "codex-tui"]

[codex.sessions]
path_family = "~/.codex/sessions/**/*.jsonl"
category = "AI agent"
growth_shape = "many_files"
owner = "owned"
native_policy = "none_found"
cleanup_mode = "ttl_prune"
ttl_days = 14
active_writer_processes = ["codex", "codex-tui"]

[codex.sqlite]
path_family = "~/.codex/logs_2.sqlite*"
category = "AI agent"
growth_shape = "sqlite_with_wal"
owner = "report_only"
native_policy = "none_found"
cleanup_mode = "none"

[codex.archived_sessions]
path_family = "~/.codex/archived_sessions/**"
category = "AI agent"
growth_shape = "tree"
owner = "report_only"
native_policy = "none_found"
cleanup_mode = "none"

[native_guidance.codex_history]
path_family = "~/.codex/history.jsonl"
category = "AI agent"
growth_shape = "single_file"
owner = "report_only"
native_policy = "yes"
cleanup_mode = "none"
max_bytes = 10485760
persistence = "save-all"

[factory.log]
path_family = "~/.factory/logs/droid-log-single.log"
category = "AI agent"
growth_shape = "single_file"
owner = "owned"
native_policy = "none_found"
cleanup_mode = "rotate"
max_bytes = 104857600
retained_rotations = 2
active_writer_processes = ["factory", "droid"]

[rustup.toolchains]
path_family = "~/.rustup/toolchains/*"
category = "version manager"
growth_shape = "tree"
owner = "owned"
native_policy = "yes"
cleanup_mode = "toolchain_retention"
retain_exact_names = ["1.97.0-aarch64-apple-darwin"]
remove_exact_names = []

[preflight]
free_disk_warning_bytes = 10737418240
free_disk_error_bytes = 5368709120
owned_storage_warning_bytes = 10737418240
owned_storage_error_bytes = 21474836480

[adjacent.browser_cache]
id = "browser.cache"
path_family = "~/Library/Caches"
category = "browser tooling"
growth_shape = "tree"
owner = "out_of_scope"
native_policy = "not_applicable"
cleanup_mode = "none"

[adjacent.codex_plugins]
id = "codex.plugins"
path_family = "~/.codex/plugins"
category = "MCP/plugin"
growth_shape = "tree"
owner = "out_of_scope"
native_policy = "not_applicable"
cleanup_mode = "none"

[adjacent.package_manager_cache]
id = "package_manager.cache"
path_family = "~/.npm"
category = "package manager"
growth_shape = "tree"
owner = "out_of_scope"
native_policy = "not_applicable"
cleanup_mode = "none"
