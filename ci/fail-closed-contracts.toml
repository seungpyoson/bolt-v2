[scan]
include = ["scripts/verify_*.py"]
exclude = []

[source_fence]
commands = [
  "python3 scripts/test_verify_fail_closed_contracts.py",
  "python3 scripts/verify_fail_closed_contracts.py --contract ci/fail-closed-contracts.toml --exceptions ci/fail-closed-exceptions.toml",
]

[[rules]]
id = "FC001"
classification = "blocked"
disposition = "always_block"
event_keys = [
  '''ExceptHandler(body=[Pass()])''',
]

[[rules]]
id = "FC002"
classification = "blocked"
disposition = "always_block"
event_keys = [
  '''ExceptHandler(type=Name(id='Exception', ctx=Load()), body=[Pass()])''',
  '''ExceptHandler(type=Name(id='BaseException', ctx=Load()), body=[Pass()])''',
]

[[rules]]
id = "FC003"
classification = "blocked"
disposition = "always_block"
event_keys = [
  '''ExceptHandler(body=[Return(value=Constant(value=None))])''',
  '''ExceptHandler(body=[Return(value=List(ctx=Load()))])''',
  '''ExceptHandler(body=[Return(value=Dict())])''',
  '''ExceptHandler(body=[Return(value=Constant(value=''))])''',
  '''ExceptHandler(body=[Return(value=Constant(value=False))])''',
  '''ExceptHandler(type=Name(id='Exception', ctx=Load()), body=[Return(value=Constant(value=None))])''',
  '''ExceptHandler(type=Name(id='Exception', ctx=Load()), body=[Return(value=List(ctx=Load()))])''',
  '''ExceptHandler(type=Name(id='Exception', ctx=Load()), body=[Return(value=Dict())])''',
