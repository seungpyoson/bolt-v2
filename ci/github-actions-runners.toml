schema_version = 1

# Repository Actions variables (Settings → Secrets and variables → Actions)
# must match [runners.*.label]. Workflows reference runners only via vars.<variable>.

[runners.github_hosted]
variable = "CI_RUNNER_GITHUB_HOSTED"
label = "ubuntu-latest"

[runners.managed_heavy]
variable = "CI_RUNNER_MANAGED_HEAVY"
label = "ubicloud-standard-4"

[runners.managed_light]
variable = "CI_RUNNER_MANAGED_LIGHT"
label = "ubicloud-standard-2"

[workflows.ci]
detector = "github_hosted"
fmt-check = "managed_light"
deny = "github_hosted"
clippy = "managed_light"
check-aarch64 = "managed_light"
source-fence = "managed_heavy"
test-archive = "managed_heavy"
test-shards = "managed_light"
test = "github_hosted"
build = "managed_heavy"
same-sha-main-evidence = "github_hosted"
gate = "github_hosted"
deploy = "github_hosted"

[workflows.backtester_ci]
detect = "github_hosted"
fmt = "managed_light"
clippy = "managed_light"
test = "managed_heavy"
gate = "github_hosted"

[workflows.ci_runner_debug]
debug-heavy = "managed_heavy"
debug-light = "managed_light"

[ci_runner_debug]
ssh_wait_minutes_variable = "CI_DEBUG_SSH_WAIT_MINUTES"
ssh_public_key_secret = "SSH_PUBLIC_KEY"
ssh_runner_action = "ubicloud/ssh-runner@b6ccad69f047c476b84a54a990f89b1ea5f2a828"