schema_version = 1

# Repository Actions variables (Settings → Secrets and variables → Actions)
# must match [runners.*.label]. Workflows reference runners only via vars.<variable>.

[runners.github_hosted]
variable = "CI_RUNNER_GITHUB_HOSTED"
label = "ubuntu-latest"

[runners.managed_heavy]
variable = "CI_RUNNER_MANAGED_HEAVY"
label = "ubicloud-standard-4-arm"

[runners.managed_light]
variable = "CI_RUNNER_MANAGED_LIGHT"
label = "ubicloud-standard-2"

[workflows.ci]
ci-policy = "github_hosted"
detector = "github_hosted"
host-health = "github_hosted"
deny = "managed_light"
# NT develop increased the restored managed target enough that full-repo clippy
# now refuses on the light tier before compilation with disk_pressure. Keep it
# on the heavy tier, matching other NT-heavy compile lanes.
clippy = "managed_heavy"
check-aarch64 = "managed_heavy"
source-fence = "managed_heavy"
nextest-fingerprint = "managed_heavy"
test-archive = "managed_heavy"
nextest-fingerprint-reuse = "github_hosted"
test = "github_hosted"
build = "managed_heavy"
ci-provenance-emit = "managed_light"
same-sha-main-evidence = "github_hosted"
gate = "github_hosted"
deploy = "github_hosted"

[workflows.backtester_ci]
ci-policy = "managed_light"
detect = "managed_light"
fmt = "managed_light"
# clippy compiles the full NT-heavy crate (same footprint as test) and rides above the disk-pressure
# floor only on the heavy tier; on managed_light (ubicloud-standard-2) the preflight refused at
# free_bytes=10,622,885,888 < min_free_bytes=10,737,418,240. Kept consistent with the test lane,
# which already compiles this crate on managed_heavy.
clippy = "managed_heavy"
test-archive = "managed_heavy"
test = "managed_heavy"
issue_789 = "managed_heavy"
gate = "github_hosted"

[workflows.ci_runner_debug]
debug-heavy = "managed_heavy"
debug-light = "managed_light"

[workflows.rust_probe]
probe-unsupported-runner-tier = "managed_light"
probe-unsupported-job-timeout = "managed_light"
probe-heavy = "managed_heavy"
probe-light = "managed_light"

[workflows.actionlint]
actionlint = "github_hosted"

[workflows.ai_review_glm_pr_agent]
glm-pr-agent-review = "github_hosted"

[workflows.ai_review_kimi_cli]
kimi-cli-review = "github_hosted"

[workflows.ai_review_coding_plan_smoke]
smoke = "github_hosted"

[workflows.dispatch_ci_cancel]
cancel-obsolete-dispatch = "github_hosted"

[workflows.advisory]
advisories = "github_hosted"

[workflows.summary]
summary = "github_hosted"

[workflows.stale]
stale = "github_hosted"

[workflows.ci_docs_pass_stub]
build = "github_hosted"
clippy = "github_hosted"
test = "github_hosted"
gate = "github_hosted"

[meter]
fingerprint_artifact_prefix = "nextest-archive-fingerprint-"
fingerprint_workflow = "ci"
debug_workflow = "ci_runner_debug"
included_workflows = ["ci", "backtester_ci", "ci_runner_debug", "rust_probe"]

[meter.api_limits]
workflow_runs_per_page = 100
run_jobs_per_page = 100
run_artifacts_per_page = 100
branch_pull_requests_per_page = 20
draft_timeline_items = 100

[ci_provenance]
schema_version = 1
artifact_name_template = "ci-provenance-attempt-{run_attempt}"
workflow_key = "ci"
workflow_name = "CI"
workflow_path = ".github/workflows/ci.yml"
fingerprint_source = "meter"

[ci_provenance.full_ci]
required_jobs = [
  "detector",
  "deny",
  "clippy",
  "check-aarch64",
  "source-fence",
  "nextest-fingerprint",
  "test-archive",
  "test",
]
conditional_jobs = ["build"]
conditional_job_outputs = { build = "detector.build_required" }

[ci_provenance.full_ci.jobs.detector]
check_name = "detector"

[ci_provenance.full_ci.jobs.deny]
check_name = "deny"

[ci_provenance.full_ci.jobs.clippy]
check_name = "clippy"

[ci_provenance.full_ci.jobs.check-aarch64]
check_name = "check-aarch64"

[ci_provenance.full_ci.jobs.source-fence]
check_name = "source-fence"

[ci_provenance.full_ci.jobs.nextest-fingerprint]
check_name = "nextest fingerprint"

[ci_provenance.full_ci.jobs.test-archive]
check_name = "nextest archive"

[ci_provenance.full_ci.jobs.test]
check_name = "test"

[ci_provenance.full_ci.jobs.build]
check_name = "build"
conditional = "detector.build_required"

[ci_provenance.deploy]
artifact_name = "bolt-v2-binary"
require_source_event = "push"
require_source_branch = "main"
require_gate_check = true

[ci_provenance.dispatch]
workflow_input = "full_ci"
run_name_default = "CI"
run_name_full = "CI [dispatch:full]"
run_name_iteration = "CI [dispatch:iteration]"
proof_gate_job = "gate"

[ci_provenance.gate_names]
gate_required = "gate"
gate_defer = "gate-deferred"
gate_iteration = "gate-iteration"
gate_noop = "gate-noop"
gate_dispatch_full = "gate-dispatch"
backtester_required = "backtester-gate"
backtester_defer = "backtester-gate-deferred"
backtester_iteration = "backtester-gate-iteration"
backtester_noop = "backtester-gate-noop"
backtester_dispatch_full = "backtester-gate-dispatch"

[ci_provenance.api_limits]
workflow_runs_per_page = 100
run_jobs_per_page = 100
run_artifacts_per_page = 100
max_lookback_pages = 10
max_lookback_age_seconds = 2592000

[ci_provenance.artifacts]
retention_days = 30

[ci_provenance.policy]
draft_pr_synchronize = "defer"
draft_pr_opened = "defer"
draft_pr_reopened = "defer"
draft_pr_edited = "defer"
converted_to_draft = "defer"
ready_pr = "full"
ready_pr_edited_no_base = "noop"
ready_pr_reopened = "noop"
ready_for_review = "full"
workflow_dispatch = "iteration"
workflow_dispatch_full_ci = "full"
main_push = "full"
merge_group = "full"
mergify_temp_pr = "full"
tag = "tag_reuse"
unknown_event = "full"

[ci_provenance.mergify]
temp_pr_head_ref_prefix = "mergify/merge-queue/"

[ci_provenance.policy.override]
force_full_ci = false
ignore_emit_failure = false

[dispatch_cancel]
workflow_event = "workflow_dispatch"
active_statuses = ["queued", "requested", "waiting", "pending", "in_progress"]
workflow_runs_per_page = 100
max_pages = 3

[ci_runner_debug]
ssh_wait_minutes_variable = "CI_DEBUG_SSH_WAIT_MINUTES"
ssh_public_key_secret = "SSH_PUBLIC_KEY"
ssh_runner_action = "ubicloud/ssh-runner@b6ccad69f047c476b84a54a990f89b1ea5f2a828"
onepassword_vault = "Private"
onepassword_item_title = "bolt-v2 CI runner debug SSH"
onepassword_public_key_field = "public key"
