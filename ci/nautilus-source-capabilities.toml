# Immutable source facts for the exact official NautilusTrader dependency.
# build.rs binds this revision to the exact Binance and Polymarket dependencies
# and generates the Rust registry. This is governed build evidence, not
# operator config.
revision = "01d5af1427d73532f6dd9f2be77acb72f825bec9"

[binance_spot]
sbe_schema_3_5 = true
adapter_receive_timestamps = true

[polymarket_reconciliation]
rejects_unmapped_open_orders = true
rejects_unmapped_confirmed_fills = true
rejects_unrepresentable_positions = true

