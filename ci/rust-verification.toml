schema_version = 2
project_id = "bolt-v2"
target_namespace = "bolt-v2"

[commands]

[commands.test]
recipe = "managed-test"

[commands.clippy]
recipe = "managed-clippy"

[commands.build]
recipe = "managed-build"
artifact_layout = "cargo"
profile = "release"
target = "aarch64-unknown-linux-gnu"

[local_compile_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
break_glass_env = "BOLT_ALLOW_LOCAL_RUST"
refused_managed_commands = ["test", "clippy", "build"]
refused_cargo_subcommands = ["b", "bench", "build", "c", "check", "clippy", "d", "doc", "fetch", "install", "nextest", "r", "run", "rustc", "t", "test", "zigbuild"]

[local_lane_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
lock_dir = "/tmp/rust-verification-lanes"
acquire_timeout_seconds = 1800
heartbeat_seconds = 15
poll_interval_seconds = 1
cheap_lane_labels = ["local-gate:fmt-check", "local-gate:source-fence-static", "local-gate:ci-lint-workflow", "test_clean_merged_artifacts.py", "test_developer_tool_storage_hygiene.py", "test_leadlag_clock_alignment.py", "verify_runtime_capture_yaml.py"]
cheap_lane_just_recipes = ["source-fence-static-inner", "ci-lint-workflow-inner", "cargo-shim-tests"]
cheap_lane_max_concurrent = 0

[remote_verification]
poll_interval_seconds = 15
checks_appear_timeout_seconds = 300
overall_timeout_seconds = 3600
diagnostic_log_max_lines = 160
diagnostic_log_max_bytes = 20000
diagnostic_unavailable_notice_interval_polls = 4

[remote_probe]
workflow_name = "Rust Probe"
workflow_path = ".github/workflows/rust-probe.yml"
poll_interval_seconds = 15
appearance_timeout_seconds = 180
overall_timeout_seconds = 3900
active_run_limit = 4
workflow_runs_per_page = 20
guard_timeout_minutes = 1
allowed_runner_tiers = ["heavy", "light"]
suggest_base_ref = "origin/main"

[remote_probe.mode_runner_tiers]
check-lib = "heavy"
check-test-target = "heavy"
nextest-no-run-test-target = "heavy"
nextest-test-target = "heavy"
nextest-test-target-name = "heavy"

[remote_probe.workflow_timeouts]
probe-heavy = 60
probe-light = 60

[remote_probe.separate_workspaces.backtesting_vertical_slice]
path = "crates/backtesting-vertical-slice"
message = "backtesting-vertical-slice is a separate workspace; root Rust Probe does not cover it"
commands = ["just bte-fmt-check"]

[cache]
min_free_bytes = 10737418240
soft_limit_bytes = 53687091200
active_process_patterns = ["cargo", "cargo-clippy", "cargo-fmt", "cargo-nextest", "rustc", "nextest", "rust_verification.py"]

[cache.retention.debug]
prune_after_days = 14
prunable = true

[cache.retention.release]
prune_after_days = 30
prunable = true

[cache.retention.cross-target]
prune_after_days = 30
prunable = true

[cache.retention.tmp]
prune_after_days = 1
prunable = true

[cache.retention.other]
prunable = false
