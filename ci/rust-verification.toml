schema_version = 2
project_id = "bolt-v2"
target_namespace = "bolt-v2"

[commands]

[commands.test]
recipe = "managed-test"

[commands.clippy]
recipe = "managed-clippy"

[commands.build]
recipe = "managed-build"
artifact_layout = "cargo"
profile = "release"
target = "aarch64-unknown-linux-gnu"

[local_compile_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
break_glass_env = "BOLT_ALLOW_LOCAL_RUST"
refused_managed_commands = ["test", "clippy", "build"]
refused_cargo_subcommands = ["b", "bench", "build", "c", "check", "clippy", "d", "doc", "fetch", "install", "nextest", "r", "run", "rustc", "t", "test", "zigbuild"]

[local_lane_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
lock_dir = "/tmp/rust-verification-lanes"
acquire_timeout_seconds = 1800
heartbeat_seconds = 15
poll_interval_seconds = 1
cheap_lane_labels = ["local-gate:fmt-check", "local-gate:source-fence-static", "local-gate:ci-lint-workflow", "test_cancel_obsolete_dispatch_runs.py", "test_cargo_shim.py", "test_ci_provenance.py", "test_clean_merged_artifacts.py", "test_command_understanding.py", "test_developer_tool_storage_hygiene.py", "test_find_same_sha_main_evidence.py", "test_lane_governor.py", "test_leadlag_clock_alignment.py", "test_local_verification_gate.py", "test_merge_readiness.py", "test_migrate_bolt_v3_capital_admission_config.py", "test_migrate_bolt_v3_decision_evidence_v13_to_v14.py", "test_run_rust_probe.py", "test_rust_probe_wrapper.py", "test_rust_verification.py", "test_rust_verification_cache_retention.py", "test_rust_verification_decoupling.py", "test_ubicloud_runner_minutes.py", "test_verify_023_status_legend_registry.py", "test_verify_bolt_v3_boundary_evidence.py", "test_verify_bolt_v3_core_boundary.py", "test_verify_bolt_v3_dependency_direction.py", "test_verify_bolt_v3_legacy_default_fence.py", "test_verify_bolt_v3_market_family_coupling.py", "test_verify_bolt_v3_naming.py", "test_verify_bolt_v3_no_exit_market_command.py", "test_verify_bolt_v3_no_venue_name_branch.py", "test_verify_bolt_v3_provider_leaks.py", "test_verify_bolt_v3_pure_rust_runtime.py", "test_verify_bolt_v3_requote_construction.py", "test_verify_bolt_v3_runtime_literals.py", "test_verify_bolt_v3_schema_current.py", "test_verify_bolt_v3_status_map_current.py", "test_verify_bolt_v3_strategy_policy_fence.py", "test_verify_bolt_v3_usable_mu_sole_mint.py", "test_verify_bte_022_binary_option_bar_catalog.py", "test_verify_bte_022_pmxt_broad_backfill_efficiency.py", "test_verify_bte_022_pmxt_coverage_ledger.py", "test_verify_bte_022_pmxt_durable_source.py", "test_verify_bte_022_pmxt_dynamic_tick_size.py", "test_verify_bte_022_pmxt_storage_proof.py", "test_verify_ci_path_filters.py", "test_verify_ci_workflow_hygiene.py", "test_verify_dashboard_customer_jobs.py", "test_verify_dashboard_field_source_matrix.py", "test_verify_dashboard_read_only_contract.py", "test_verify_lane_governance.py", "test_verify_outcome_group_nt_reuse.py", "test_verify_ra_artifact_index_commit.py", "test_verify_ra_bi_surface_and_feature_joins.py", "test_verify_ra_bte_phase_prerequisite.py", "test_verify_ra_cost_realism.py", "test_verify_ra_domain_metrics.py", "test_verify_ra_findings_promotion.py", "test_verify_ra_gate0_catalog_persistence.py", "test_verify_ra_leadlag_catalog_lift.py", "test_verify_ra_notebook_read_only_boundary.py", "test_verify_ra_point_in_time_leakage.py", "test_verify_ra_run_pointer_index.py", "test_verify_ra_single_engine_import_boundary.py", "test_verify_ra_sweep_orchestration.py", "test_verify_ra_thin_reader_helper.py", "test_verify_remote.py", "test_verify_runtime_capture_yaml.py", "verify_023_status_legend_registry.py", "verify_bolt_v3_boundary_evidence.py", "verify_bolt_v3_core_boundary.py", "verify_bolt_v3_dependency_direction.py", "verify_bolt_v3_legacy_default_fence.py", "verify_bolt_v3_market_family_coupling.py", "verify_bolt_v3_naming.py", "verify_bolt_v3_no_exit_market_command.py", "verify_bolt_v3_no_venue_name_branch.py", "verify_bolt_v3_provider_leaks.py", "verify_bolt_v3_pure_rust_runtime.py", "verify_bolt_v3_requote_construction.py", "verify_bolt_v3_runtime_literals.py", "verify_bolt_v3_schema_current.py", "verify_bolt_v3_status_map_current.py", "verify_bolt_v3_strategy_policy_fence.py", "verify_bolt_v3_usable_mu_sole_mint.py", "verify_bte_022_binary_option_bar_catalog.py", "verify_bte_022_pmxt_broad_backfill_efficiency.py", "verify_bte_022_pmxt_coverage_ledger.py", "verify_bte_022_pmxt_durable_source.py", "verify_bte_022_pmxt_dynamic_tick_size.py", "verify_bte_022_pmxt_storage_proof.py", "verify_ci_path_filters.py", "verify_ci_workflow_hygiene.py", "verify_dashboard_customer_jobs.py", "verify_dashboard_field_source_matrix.py", "verify_dashboard_read_only_contract.py", "verify_lane_governance.py", "verify_outcome_group_nt_reuse.py", "verify_ra_artifact_index_commit.py", "verify_ra_bi_surface_and_feature_joins.py", "verify_ra_bte_phase_prerequisite.py", "verify_ra_cost_realism.py", "verify_ra_domain_metrics.py", "verify_ra_findings_promotion.py", "verify_ra_gate0_catalog_persistence.py", "verify_ra_leadlag_catalog_lift.py", "verify_ra_notebook_read_only_boundary.py", "verify_ra_point_in_time_leakage.py", "verify_ra_run_pointer_index.py", "verify_ra_single_engine_import_boundary.py", "verify_ra_sweep_orchestration.py", "verify_ra_thin_reader_helper.py", "verify_runtime_capture_yaml.py"]
cheap_lane_max_concurrent = 0

[remote_verification]
poll_interval_seconds = 15
checks_appear_timeout_seconds = 300
overall_timeout_seconds = 3600
diagnostic_log_max_lines = 160
diagnostic_log_max_bytes = 20000
diagnostic_unavailable_notice_interval_polls = 4

[remote_probe]
workflow_name = "Rust Probe"
workflow_path = ".github/workflows/rust-probe.yml"
poll_interval_seconds = 15
appearance_timeout_seconds = 180
overall_timeout_seconds = 3900
active_run_limit = 4
workflow_runs_per_page = 20
guard_timeout_minutes = 1
allowed_runner_tiers = ["heavy", "light"]
suggest_base_ref = "origin/main"

[remote_probe.mode_runner_tiers]
check-lib = "heavy"
check-test-target = "heavy"
nextest-no-run-test-target = "heavy"
nextest-test-target = "heavy"
nextest-test-target-name = "heavy"

[remote_probe.workflow_timeouts]
probe-heavy = 60
probe-light = 60

[remote_probe.separate_workspaces.backtesting_vertical_slice]
path = "crates/backtesting-vertical-slice"
message = "backtesting-vertical-slice is a separate workspace; root Rust Probe does not cover it"
commands = ["just bte-fmt-check"]

[cache]
min_free_bytes = 10737418240
soft_limit_bytes = 53687091200
active_process_patterns = ["cargo", "cargo-clippy", "cargo-fmt", "cargo-nextest", "rustc", "nextest", "rust_verification.py"]

[cache.retention.debug]
prune_after_days = 14
prunable = true

[cache.retention.release]
prune_after_days = 30
prunable = true

[cache.retention.cross-target]
prune_after_days = 30
prunable = true

[cache.retention.tmp]
prune_after_days = 1
prunable = true

[cache.retention.other]
prunable = false
