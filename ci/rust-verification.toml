schema_version = 2
project_id = "bolt-v2"
target_namespace = "bolt-v2"

[commands]

[commands.test]
cargo_args = ["nextest", "run", "--locked"]

[commands.clippy]
recipe = "managed-clippy"

[commands.build]
recipe = "managed-build"
artifact_layout = "cargo"
profile = "release"
target = "aarch64-unknown-linux-gnu"

[local_compile_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
break_glass_env = "BOLT_ALLOW_LOCAL_RUST"
refused_managed_commands = ["test", "clippy", "build"]
refused_cargo_subcommands = ["b", "bench", "build", "c", "check", "clippy", "d", "doc", "fetch", "install", "nextest", "r", "run", "rustc", "t", "test", "zigbuild"]

[remote_compile_cache]
enabled = true
enable_env = "BOLT_RUST_VERIFICATION_SCCACHE"
ci_env = "GITHUB_ACTIONS"
wrapper_env = "SCCACHE_PATH"
wrapper_program = "sccache"

[remote_fast_linker]
enabled = true
ci_env = "GITHUB_ACTIONS"
linker_env = "BOLT_RUST_FAST_LINKER"
programs = ["mold"]

[local_lane_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
lock_dir = "/tmp/rust-verification-lanes"
acquire_timeout_seconds = 1800
heartbeat_seconds = 15
poll_interval_seconds = 1
cheap_lane_labels = ["local-gate:preflight", "run_fences.py", "verify_ci_workflow_hygiene.py", "test_cargo_shim.py", "test_command_understanding.py", "test_config_validators.py", "test_local_verification_gate.py", "test_merge_queue_operator.py", "test_merge_queue_preflight.py", "test_repo_preflight.py", "test_run_ci_lint_suites.py", "test_run_rust_probe.py", "test_rust_probe_wrapper.py", "test_rust_test_targets.py", "test_rust_verification.py", "test_rust_verification_cache_retention.py", "test_rust_verification_decoupling.py", "test_sandbox_safe_push.py", "test_unified_verification_deletion_fence.py", "test_verify_bolt_v3_boundary_evidence.py", "test_verify_bolt_v3_no_exit_market_command.py", "test_verify_bolt_v3_poison_lock_fence.py", "test_verify_bolt_v3_provider_leaks.py", "test_verify_bolt_v3_runtime_literals.py", "test_verify_bolt_v3_strategy_policy_fence.py", "test_verify_fail_closed_contracts.py", "test_verify_lane_governance.py", "test_verify_runtime_capture_yaml.py", "test_workspace_registry.py", "verify_bolt_v3_boundary_evidence.py", "verify_bolt_v3_no_exit_market_command.py", "verify_bolt_v3_provider_leaks.py", "verify_bolt_v3_runtime_literals.py", "verify_bolt_v3_strategy_policy_fence.py", "verify_fail_closed_contracts.py", "verify_lane_governance.py", "verify_runtime_capture_yaml.py"]
cheap_lane_max_concurrent = 0

[sandbox_safe_push]
remote = "origin"

[merge_queue_preflight]
origin = "origin"
base = "main"

[merge_queue_preflight.operator]
repository = "github.com/seungpyoson/bolt-v2"
queue_command = "@mergifyio queue"
ref_timeout_seconds = 300
queue_timeout_seconds = 300

[merge_queue_preflight.timeouts]
input_seconds = 300

[remote_probe]
workflow_name = "Rust Probe"
workflow_path = ".github/workflows/rust-probe.yml"
poll_interval_seconds = 15
appearance_timeout_seconds = 180
overall_timeout_seconds = 3900
active_run_limit = 4
workflow_runs_per_page = 20
guard_timeout_minutes = 1
allowed_runner_tiers = ["heavy", "light"]
suggest_base_ref = "origin/main"

[remote_probe.mode_runner_tiers]
check-lib = "heavy"
check-test-target = "heavy"
nextest-no-run-test-target = "heavy"
nextest-lib-name = "heavy"
nextest-test-target = "heavy"
nextest-test-target-name = "heavy"

[remote_probe.workflow_timeouts]
probe-heavy = 60
probe-light = 60

[cache]
min_free_bytes = 10737418240
soft_limit_bytes = 32212254720
active_process_patterns = ["cargo", "cargo-clippy", "cargo-fmt", "cargo-nextest", "rustc", "nextest", "rust_verification.py"]

[cache.retention.debug]
prune_after_days = 14
prunable = true

[cache.retention.release]
prune_after_days = 30
prunable = true

[cache.retention.cross-target]
prune_after_days = 30
prunable = true

[cache.retention.tmp]
prune_after_days = 1
prunable = true

[cache.retention.other]
prunable = false
