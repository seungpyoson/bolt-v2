schema_version = 2
project_id = "bolt-v2"
target_namespace = "bolt-v2"

[commands]

[commands.test]
cargo_args = ["nextest", "run", "--locked"]
compile_args = ["nextest", "run", "--locked", "--no-run"]

[commands.clippy]
recipe = "managed-clippy"

[commands.build]
recipe = "managed-build"
artifact_layout = "cargo"
profile = "release"
target = "aarch64-unknown-linux-gnu"

[local_compile_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
break_glass_env = "BOLT_ALLOW_LOCAL_RUST"
refused_managed_commands = ["test", "clippy", "build"]
refused_cargo_subcommands = ["b", "bench", "build", "c", "check", "clippy", "d", "doc", "fetch", "install", "nextest", "r", "run", "rustc", "t", "test", "zigbuild"]

[remote_compile_cache]
enabled = true
enable_env = "BOLT_RUST_VERIFICATION_SCCACHE"
ci_env = "GITHUB_ACTIONS"
wrapper_env = "SCCACHE_PATH"
wrapper_program = "sccache"

[remote_fast_linker]
enabled = true
ci_env = "GITHUB_ACTIONS"
linker_env = "BOLT_RUST_FAST_LINKER"
programs = ["mold", "lld"]

[local_lane_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
lock_dir = "/tmp/rust-verification-lanes"
acquire_timeout_seconds = 1800
heartbeat_seconds = 15
poll_interval_seconds = 1
cheap_lane_labels = ["local-gate:fmt-check", "local-gate:source-fence-static", "local-gate:source-fence-static-fences-only", "local-gate:ci-lint-workflow", "run_fences.py", "test_cancel_obsolete_dispatch_runs.py", "test_cargo_shim.py", "test_ci_input_sets.py", "test_ci_provenance.py", "test_ci_storage_audit.py", "test_ci_storage_tripwire.py", "test_ci_test_manifest.py", "test_clean_merged_artifacts.py", "test_command_understanding.py", "test_config_validators.py", "test_coverage_enforcer.py", "test_developer_tool_storage_hygiene.py", "test_find_same_sha_main_evidence.py", "test_lane_governor.py", "test_leadlag_clock_alignment.py", "test_local_verification_gate.py", "test_merge_queue_operator.py", "test_merge_queue_preflight.py", "test_merge_readiness.py", "test_nextest_fingerprint.py", "test_root_bin_sidecars.py", "test_run_ci_lint_suites.py", "test_run_rust_probe.py", "test_rust_probe_wrapper.py", "test_rust_test_targets.py", "test_rust_verification.py", "test_rust_verification_cache_retention.py", "test_rust_verification_decoupling.py", "test_sandbox_safe_push.py", "test_ubicloud_runner_minutes.py", "test_verify_bolt_v3_boundary_evidence.py", "test_verify_bolt_v3_no_exit_market_command.py", "test_verify_bolt_v3_poison_lock_fence.py", "test_verify_bolt_v3_provider_leaks.py", "test_verify_bolt_v3_runtime_literals.py", "test_verify_bolt_v3_strategy_policy_fence.py", "test_verify_ci_path_filters.py", "test_verify_ci_workflow_hygiene.py", "test_verify_fail_closed_contracts.py", "test_verify_lane_governance.py", "test_verify_remote.py", "test_verify_runtime_capture_yaml.py", "verify_bolt_v3_boundary_evidence.py", "verify_bolt_v3_no_exit_market_command.py", "verify_bolt_v3_poison_lock_fence.py", "verify_bolt_v3_provider_leaks.py", "verify_bolt_v3_runtime_literals.py", "verify_bolt_v3_strategy_policy_fence.py", "verify_ci_path_filters.py", "verify_ci_workflow_hygiene.py", "verify_fail_closed_contracts.py", "verify_lane_governance.py", "verify_runtime_capture_yaml.py"]
cheap_lane_max_concurrent = 0

[sandbox_safe_push]
remote = "origin"

[merge_queue_preflight]
origin = "origin"
base = "main"
default_verifier_profile = "static"
source_fence_full_profile_pathspecs = [
  "scripts",
  "justfile",
  "ci/rust-verification.toml",
  "ci/fail-closed-contracts.toml",
  "ci/fail-closed-exceptions.toml",
  "crates/backtesting-vertical-slice/ci/rust-verification.toml",
]

[merge_queue_preflight.operator]
queue_command = "@mergifyio queue"
ref_timeout_seconds = 300
queue_timeout_seconds = 300

[merge_queue_preflight.timeouts]
input_seconds = 300
verifier_seconds = 600

[merge_queue_preflight.required_check_workflows]
"gate" = "CI"
"backtester-gate" = "Backtester CI"
"actionlint" = "actionlint"
"host-health" = "CI"

[merge_queue_preflight.source_check_aliases]

[merge_queue_preflight.source_fence_fences_only_rewrites]
"just source-fence-static" = "just source-fence-static-fences-only"

[merge_queue_preflight.output]
verifier_stream_max_lines = 40
verifier_stream_max_bytes = 4000

[merge_queue_preflight.verifier_profiles.none]
commands = []

[merge_queue_preflight.verifier_profiles.static]
commands = ["just source-fence-static"]

[merge_queue_preflight.verifier_profiles.local]
commands = ["just fmt-check", "just source-fence-static", "just ci-lint-workflow"]

[remote_verification]
poll_interval_seconds = 15
checks_appear_timeout_seconds = 300
overall_timeout_seconds = 3600
diagnostic_log_max_lines = 160
diagnostic_log_max_bytes = 20000
diagnostic_unavailable_notice_interval_polls = 4

[remote_probe]
workflow_name = "Rust Probe"
workflow_path = ".github/workflows/rust-probe.yml"
poll_interval_seconds = 15
appearance_timeout_seconds = 180
overall_timeout_seconds = 3900
active_run_limit = 4
workflow_runs_per_page = 20
guard_timeout_minutes = 1
allowed_runner_tiers = ["heavy", "light"]
suggest_base_ref = "origin/main"

[remote_probe.mode_runner_tiers]
check-lib = "heavy"
check-test-target = "heavy"
nextest-no-run-test-target = "heavy"
nextest-lib-name = "heavy"
nextest-test-target = "heavy"
nextest-test-target-name = "heavy"

[remote_probe.workflow_timeouts]
probe-heavy = 60
probe-light = 60

[remote_probe.separate_workspaces.backtesting_vertical_slice]
path = "crates/backtesting-vertical-slice"
message = "backtesting-vertical-slice is a separate workspace; root Rust Probe does not cover it"
commands = ["just bte-fmt-check"]

[cache]
min_free_bytes = 10737418240
soft_limit_bytes = 32212254720
active_process_patterns = ["cargo", "cargo-clippy", "cargo-fmt", "cargo-nextest", "rustc", "nextest", "rust_verification.py"]

[cache.retention.debug]
prune_after_days = 14
prunable = true

[cache.retention.release]
prune_after_days = 30
prunable = true

[cache.retention.cross-target]
prune_after_days = 30
prunable = true

[cache.retention.tmp]
prune_after_days = 1
prunable = true

[cache.retention.other]
prunable = false
