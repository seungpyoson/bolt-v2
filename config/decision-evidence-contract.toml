# Every append path into the evidence streams, classified exactly once.
#
# "Exactly once" is per producer, not per function. One function can serve two
# producers whose facts differ, and then it appears under both with each fact's
# own classification: `record_admission_decision` is event-keyed for both
# admitted-entry and rejected-entry facts, while the separate order-reject fact
# is already deduped before recording. Review read the shared function name as a
# double classification, which is worth ruling on here rather than leaving to be
# re-derived -- the thing that must be classified once is the fact reaching the
# stream.
#
# The five census fields below are #1354 acceptance criteria, carried over from
# the append-layer census preserved in git history. The final census revision
# had 19 producer rows; its immediately preceding 20-row revision also named
# `settlement_booking_error_legacy_append`, which the final revision folded into
# terminal settlement. This contract splits the surviving producers finer -- by
# strategy, and by outcome where the census carried a single decision row -- so
# `census_ancestor` names which row each inherited from, and is empty for a
# producer that postdates the census and was derived directly.
#
# All retired producers are accounted for by the closed
# `[[census_dispositions]]` relation. The parser requires exactly one typed row
# per retired producer, validates every current target, and requires inherited
# mappings to equal the producers' `census_ancestor` fields.
#
# `named_readers`, the sixth criterion, is deliberately absent. The final
# 19-row census carried 74 producer-to-reader references across 17 distinct
# function names; every named reader was deleted with that layer. The
# `[[dispositions]]` table below states the same fact per consumer and carries
# an owner ruling with it, which the census's flat name list did not.
#
# `call_sites` is reviewed provenance inventory and names the enclosing function
# rather than a line. The parser validates only the `<path>.rs::<function>`
# shape; it does not scan source or claim that the named target resolves.
# `runtime_wiring` and `reviewed_runtime_triggers` are the corresponding
# reviewed runtime provenance. The parser closes the trigger vocabulary and
# requires it to agree with wired/unwired status; it does not derive a call
# graph from source.

[[census_dispositions]]
ancestor = "admission_decision"
disposition = "inherited"
current_producers = ["submit_admission_admitted_entry", "submit_admission_rejected_entry", "submit_admission_exit"]

