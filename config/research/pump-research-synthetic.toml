venue_keys = ["synthetic-venue-a", "synthetic-venue-b"]
market_family_keys = ["synthetic-perpetual"]
start_time = "2025-01-01T00:00:00Z"
end_time = "2025-04-01T00:00:00Z"
time_unit_grain = "utc-day"
outer_roster_rule = "union-of-admitted-vintage-inventories"
roster_vintage = "2024-12-31T23:59:59Z"
inventory_source_refs = ["synthetic-inventory-a", "synthetic-inventory-b"]
reconciliation_rule = "identity-first-source-precedence-v1"
status_precedence = ["eligible_observed", "known_ineligible", "known_insufficient_coverage", "existence_or_coverage_unknown"]
completeness = "enumerated_incomplete"
disclosure_text = "Results cover only the enumerated synthetic roster and measured coverage."

