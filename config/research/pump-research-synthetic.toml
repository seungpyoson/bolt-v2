[experiment]
experiment_id = "synthetic-pump-research"
version_sequence = 1
schema_version = "pump-research-experiment.v1"
canonicalization_version = "pump-research-canonical-json.v1"
hash_algorithm = "sha256"
created_at = "2026-08-20T00:00:00Z"
append_role = "experiment-decision"
purpose = "exploratory"
state = "draft"

[[experiment.lineage_refs]]
artifact_kind = "research-analytics"
artifact_id = "synthetic-governance-authority"
artifact_version = 1
content_hash = "1111111111111111111111111111111111111111111111111111111111111111"

[target_frame]
