account_id = "fixture-account-canonical"
principal_arn_prefix = "fixture://canonical/"
user_id_prefix = "fixture-canonical"
credential_scope_ref = "fixture-scope-canonical"
can_append_versions = false

[[roles.bindings]]
role_id = "verification-replay"
