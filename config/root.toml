[clients.okx_data]
venue = "OKX"

[clients.okx_data.data]
instrument_types = ["SPOT", "MARGIN", "SWAP", "FUTURES", "EVENTS"]
contract_types = ["linear", "inverse"]
# load_spreads=false: pinned NT has no books websocket channel for spread
# instruments, so the venue rejects spread instId subscriptions (error 60018).
load_spreads = false
# Data-only readiness uses OKX production (live) public data: the demo
# paper-trading websocket serves empty/thin books for production instruments,
# producing `deltas cannot be empty` parse errors. See T043A docs.
environment = "live"
transport_backend = "sockudo"

[clients.okx_data.readiness_probe]
# Trade chunk-count probe (#490): walk OKX's full instrument universe in chunks
# of `chunk_size`, kept below the venue's silent delivery ceiling (200 channels
# deliver; the full ~1900 are suppressed), watching each chunk
# `chunk_observation_window_seconds` for trades. Pass once `min_observed_targets`
# (m) distinct markets trade; fail closed if the whole universe is walked without
# reaching m. Liveness-driven selection avoids certifying on the illiquid
# alphabetical long tail that a fixed metadata sample lands on. The other venues
# above keep book probes (book deltas flow even for illiquid instruments, so they
# do not exhibit the false-negative trade exposed).
market_data_kind = "trade"
quote_target_source = "metadata_response"
chunk_size = 200
chunk_observation_window_seconds = 45
min_observed_targets = 10
