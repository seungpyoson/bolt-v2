account_address_ssm_path = "/bolt/hyperliquid/master_api_wallet/account_address"

# Live Chainlink Data Streams resolution-strike (price-to-beat) source. One
# point-in-time strike per window-open timestamp, delivered as an NT
# IndexPriceUpdate on the bound resolution instrument. Routes to the
# chainlink::map_adapters provider binding via venue = "CHAINLINK_DATA_STREAMS"
# (the chainlink::KEY matched in bolt_v3_providers::binding_for_provider_key).
# Each strategy instance subscribes its asset's feed via the per-asset
# [resolution_data] block in strategies/binary_oracle_<asset>.toml.
[clients.chainlink_strike]
venue = "CHAINLINK_DATA_STREAMS"

[clients.chainlink_strike.data]
rest_base_url = "https://api.testnet-dataengine.chain.link"
report_endpoint_path = "/api/v1/reports"
http_timeout_secs = 4

[clients.chainlink_strike.secrets]
api_key_ssm_parameter = "/bolt/testnet/chainlink/api-key"
api_secret_ssm_parameter = "/bolt/testnet/chainlink/api-secret"

# Live Chainlink Data Streams current-price websocket source. This is the
# continuous reference-price stream used by [reference_current_price] sources.
[clients.chainlink_reference]
venue = "CHAINLINK_REFERENCE_PRICE"

[clients.chainlink_reference.data]
websocket_endpoint = "wss://ws.testnet-dataengine.chain.link"
websocket_path = "/api/v1/ws"
transport_backend = "sockudo"
heartbeat_secs = 5
reconnect_timeout_ms = 101000
reconnect_delay_initial_ms = 250
reconnect_delay_max_ms = 5000
reconnect_backoff_factor = 1.5
reconnect_jitter_ms = 100
reconnect_max_attempts = "unlimited"
idle_timeout_ms = 10000

[clients.chainlink_reference.secrets]
api_key_ssm_parameter = "/bolt/testnet/chainlink/api-key"
api_secret_ssm_parameter = "/bolt/testnet/chainlink/api-secret"

# Live PolyResearch current-price websocket source. This is an
# alternate continuous reference-price stream for [reference_current_price].
[clients.polyresearch_reference]
venue = "POLYRESEARCH_REFERENCE_PRICE"

[clients.polyresearch_reference.data]
websocket_endpoint = "wss://3j5lx6otd8.execute-api.eu-west-1.amazonaws.com/prod"
transport_backend = "sockudo"
heartbeat_secs = 5
heartbeat_message = "{\"action\":\"ping\"}"
reconnect_timeout_ms = 101000
reconnect_delay_initial_ms = 250
reconnect_delay_max_ms = 5000
reconnect_backoff_factor = 1.5
reconnect_jitter_ms = 100
reconnect_max_attempts = "unlimited"
subscribe_ack_timeout_ms = 2000
idle_timeout_ms = 10000

[clients.polyresearch_reference.secrets]
api_key_ssm_parameter = "/bolt/polyresearch/api-key"
