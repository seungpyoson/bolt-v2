[clients.bitmex_data.data]
# Data-only readiness uses BitMEX production (mainnet) public data: pinned NT's
# strict BitmexInstrumentType enum cannot deserialize the testnet-only `FFMCSX`
# typ, and active_only=true avoids the historical `/instrument` dump whose
# settled instruments break NT's whole-array deserialize. See T043A docs.
environment = "mainnet"
active_only = true
transport_backend = "sockudo"

[clients.bitmex_data.readiness_probe]
market_data_kind = "book"
book_type = "l2_mbp"
quote_target_source = "metadata_response"
max_metadata_quote_targets = 20
allow_metadata_target_sampling = true
# Pass once >= this many sampled targets stream fresh book deltas. Proves the
# adapter data path without requiring every illiquid sampled instrument to tick
# within the wait. Unset = strict (all sampled targets). See T043A docs.
min_observed_targets = 10

