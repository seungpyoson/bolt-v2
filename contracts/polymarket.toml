schema_version = 2
venue = "polymarket"
adapter_version = "bolt-v2"

# Execution-capability facts below are sourced from the NautilusTrader Polymarket
# adapter at the git rev pinned in Cargo.toml (the single source of truth for the
# NT version). The cited crate-relative paths apply to that pinned rev.

# Polymarket rejects in-place order modification (NT adapter
# execution/mod.rs: modify_order emits "Order modification not supported");
# requoting must cancel + resubmit.
supports_modify = false

# Winner-take-all outcome tokens settle to 0 or 1 at resolution (NT adapter
# data.rs: MarketResolved builds InstrumentStatus::new(.., MarketStatusAction::Close, ..)
# with a winning outcome).
settlement_kind = "binary"

# REST budget the strategy paces to. Mirrors the NT adapter's published limits
# (common/consts.rs: HTTP_RATE_LIMIT = 100/min on both CLOB and Gamma;
# BATCH_ORDER_LIMIT = 15). The adapter is authoritative for enforcement.
[rate_budget]
clob_per_minute = 100
gamma_per_minute = 100
batch_submit_limit = 15

[streams.quotes]
capability = "supported"
policy = "required"
provenance = "native"

[streams.trades]
capability = "supported"
policy = "required"
provenance = "native"

[streams.order_book_deltas]
capability = "supported"
policy = "required"
provenance = "native"

[streams.order_book_depths]
capability = "unsupported"
policy = "disabled"
provenance = "native"
reason = "Polymarket emits L2 deltas only, no depth10 snapshots"

[streams.index_prices]
capability = "unsupported"
policy = "disabled"
provenance = "native"
reason = "not applicable to prediction markets"

[streams.mark_prices]
capability = "unsupported"
policy = "disabled"
provenance = "native"
reason = "not applicable to prediction markets"

[streams.instrument_closes]
capability = "unsupported"
policy = "disabled"
provenance = "native"
reason = "Polymarket has no close events; resolution is a separate concept"
