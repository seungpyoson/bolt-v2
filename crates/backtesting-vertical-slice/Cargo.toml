# backtesting-vertical-slice — the NautilusTrader backtest proof path (spec 023 `1-backtesting-engine`).
#
# ISOLATION (bolt-v2 CLAUDE rule "NO DUAL PATHS"; mirrors tools/catalog-projector): this crate
# roots its OWN cargo workspace + Cargo.lock, deliberately OUTSIDE the live `bolt-v2` package's
# dependency-resolution graph. Cargo features are additive-and-unified per resolution graph, so the
# only mechanism that keeps `nautilus-backtest` and the `nautilus-persistence` cloud/object_store-aws
# surface out of the live `LiveNode` binary is a separate workspace + lockfile — NOT a feature flag on
# bolt-v2. The backtest engine + persistence cloud surface are enabled HERE only, never on bolt-v2.
[workspace]

[package]
name = "backtesting-vertical-slice"
version = "0.0.0"
edition = "2024"
rust-version = "1.96.0"
publish = false
autotests = false

[[test]]
name = "backtesting_vertical_slice_tests"
path = "tests/backtesting_vertical_slice_tests.rs"

[dependencies]
ahash = "=0.8.12"
anyhow = "1"
arrow = "58.3.0"
aws-config = "=1.8.18"
aws-sdk-ssm = { version = "=1.113.0", default-features = false, features = ["default-https-client", "rt-tokio"] }
bytes = "=1.12.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1.1.9"
futures = "=0.3.32"
futures-util = "=0.3.32"
hex = "0.4"
parquet = "58.3.0"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls"] }
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "=1.52.3", features = ["macros", "rt"] }
toml = "1.1"
ustr = "1.1.0"
zip = { version = "=0.6.6", default-features = false, features = ["deflate"] }

nautilus-analysis = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
nautilus-backtest = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019", features = ["streaming", "examples"] }
nautilus-common = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
nautilus-core = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
nautilus-execution = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
nautilus-model = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
nautilus-persistence = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019", features = ["cloud"] }
nautilus-serialization = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
nautilus-polymarket = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
nautilus-trading = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
object_store = { version = "=0.13.2", default-features = false, features = ["aws"] }
bolt-v2 = { path = "../.." }

[dev-dependencies]
async-trait = "0.1"
hmac = "=0.12.1"
nautilus-persistence-macros = { git = "https://github.com/seungpyoson/nautilus_trader.git", rev = "b25a99ccf6b3c00f62c67db88c3e63e9e60a1019" }
tempfile = "3"
