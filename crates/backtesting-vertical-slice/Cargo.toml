# backtesting-vertical-slice — the NautilusTrader backtest proof path (spec 023 `1-backtesting-engine`).
#
# ISOLATION (bolt-v2 CLAUDE rule "NO DUAL PATHS"; mirrors tools/catalog-projector): this crate
# roots its OWN cargo workspace + Cargo.lock, deliberately OUTSIDE the live `bolt-v2` package's
# dependency-resolution graph. Cargo features are additive-and-unified per resolution graph, so the
# only mechanism that keeps `nautilus-backtest` and the `nautilus-persistence` cloud/object_store-aws
# surface out of the live `LiveNode` binary is a separate workspace + lockfile — NOT a feature flag on
# bolt-v2. The backtest engine + persistence cloud surface are enabled HERE only, never on bolt-v2.
[workspace]

[package]
name = "backtesting-vertical-slice"
version = "0.0.0"
edition = "2024"
rust-version = "1.95.0"
publish = false

[dependencies]
ahash = "0.8.12"
anyhow = "1"
arrow = "58.3.0"
chrono = "0.4"
clap = { version = "4", features = ["derive"] }
flate2 = "1.1.9"
futures = "0.3.32"
hex = "0.4"
lz4_flex = { version = "0.13.1", default-features = false, features = ["frame"] }
object_store = { version = "0.13.2", features = ["aws"] }
parquet = "58.3.0"
rust_decimal = "1.42.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "time", "net"] }
toml = "1.1"
url = "2.5.8"
ustr = "1.1.0"

nautilus-backtest = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c", features = ["streaming", "examples"] }
nautilus-core = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-data = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-model = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
nautilus-persistence = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c", features = ["cloud"] }
nautilus-trading = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }

[dev-dependencies]
arrow = "58.3.0"
tempfile = "3"
# The L2 orders>0 proof builds a minimal test-only NautilusTrader strategy
# (`impl DataActor` + `nautilus_strategy!`); the `DataActor` trait lives in
# `nautilus-common`, which is otherwise a transitive dependency.
nautilus-common = { git = "https://github.com/nautechsystems/nautilus_trader.git", rev = "6e059dcbb59ac1e582132fc431a581936c216c3c" }
