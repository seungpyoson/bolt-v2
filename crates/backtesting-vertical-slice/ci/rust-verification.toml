# Managed-cargo policy for the backtesting-vertical-slice crate.
#
# This crate roots its OWN cargo workspace + Cargo.lock (see Cargo.toml), deliberately outside the
# live `bolt-v2` package's dependency graph. It therefore needs its OWN managed-build policy so its
# heavy NautilusTrader backtest/cloud build cache lives in a SEPARATE namespace and never thrashes
# or pollutes the live binary's `bolt-v2` cache. All cargo for this crate routes through the same
# shared wrapper (scripts/rust_verification.py) as bolt-v2 — only the namespace differs.
#
# `build` is a NATIVE release build for the local dev/research host (the stated run environment is
# local), NOT a cross-compile to the EC2 trading target — the backtester never ships to the trading
# instance. `test`/`clippy` (the verification path CI runs) build for the host default and are
# host-agnostic; only `build.target` is pinned, and it changes in one place if a research box is chosen.
schema_version = 2
project_id = "backtesting-vertical-slice"
target_namespace = "backtesting-vertical-slice"

[commands]

[commands.test]
cargo_args = ["nextest", "run", "--locked"]
compile_args = ["nextest", "run", "--locked", "--no-run"]

[commands.clippy]
recipe = "managed-clippy"

[commands.build]
recipe = "managed-build"
artifact_layout = "cargo"
profile = "release"
target = "aarch64-apple-darwin"

[local_compile_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
break_glass_env = "BOLT_ALLOW_LOCAL_RUST"
refused_managed_commands = ["test", "clippy", "build"]
refused_cargo_subcommands = ["b", "bench", "build", "c", "check", "clippy", "d", "doc", "fetch", "install", "nextest", "r", "run", "rustc", "t", "test", "zigbuild"]

[remote_compile_cache]
enabled = true
enable_env = "BOLT_RUST_VERIFICATION_SCCACHE"
ci_env = "GITHUB_ACTIONS"
wrapper_env = "SCCACHE_PATH"
wrapper_program = "sccache"

[remote_fast_linker]
enabled = true
ci_env = "GITHUB_ACTIONS"
linker_env = "BOLT_RUST_FAST_LINKER"
programs = ["mold", "lld"]

[local_lane_policy]
enabled = true
allowed_ci_env = "GITHUB_ACTIONS"
lock_dir = "/tmp/rust-verification-lanes"
acquire_timeout_seconds = 1800
heartbeat_seconds = 15
poll_interval_seconds = 1
cheap_lane_labels = ["local-gate:fmt-check", "local-gate:source-fence-static", "local-gate:source-fence-static-fences-only", "local-gate:ci-lint-workflow", "run_fences.py", "test_cancel_obsolete_dispatch_runs.py", "test_cargo_shim.py", "test_ci_input_sets.py", "test_ci_provenance.py", "test_ci_storage_audit.py", "test_ci_storage_tripwire.py", "test_ci_test_manifest.py", "test_clean_merged_artifacts.py", "test_command_understanding.py", "test_config_validators.py", "test_coverage_enforcer.py", "test_developer_tool_storage_hygiene.py", "test_find_same_sha_main_evidence.py", "test_lane_governor.py", "test_leadlag_clock_alignment.py", "test_local_verification_gate.py", "test_merge_queue_operator.py", "test_merge_queue_preflight.py", "test_merge_readiness.py", "test_nextest_fingerprint.py", "test_root_bin_sidecars.py", "test_run_ci_lint_suites.py", "test_run_rust_probe.py", "test_rust_probe_wrapper.py", "test_rust_test_targets.py", "test_rust_verification.py", "test_rust_verification_cache_retention.py", "test_rust_verification_decoupling.py", "test_sandbox_safe_push.py", "test_ubicloud_runner_minutes.py", "test_verify_bolt_v3_boundary_evidence.py", "test_verify_bolt_v3_no_exit_market_command.py", "test_verify_bolt_v3_no_venue_name_branch.py", "test_verify_bolt_v3_poison_lock_fence.py", "test_verify_bolt_v3_provider_leaks.py", "test_verify_bolt_v3_runtime_literals.py", "test_verify_bolt_v3_strategy_policy_fence.py", "test_verify_ci_path_filters.py", "test_verify_ci_workflow_hygiene.py", "test_verify_fail_closed_contracts.py", "test_verify_lane_governance.py", "test_verify_remote.py", "test_verify_runtime_capture_yaml.py", "verify_bolt_v3_boundary_evidence.py", "verify_bolt_v3_no_exit_market_command.py", "verify_bolt_v3_no_venue_name_branch.py", "verify_bolt_v3_poison_lock_fence.py", "verify_bolt_v3_provider_leaks.py", "verify_bolt_v3_runtime_literals.py", "verify_bolt_v3_strategy_policy_fence.py", "verify_ci_path_filters.py", "verify_ci_workflow_hygiene.py", "verify_fail_closed_contracts.py", "verify_lane_governance.py", "verify_runtime_capture_yaml.py"]
cheap_lane_max_concurrent = 0

[cache]
min_free_bytes = 10737418240
soft_limit_bytes = 32212254720
active_process_patterns = ["cargo", "cargo-clippy", "cargo-fmt", "cargo-nextest", "rustc", "nextest", "rust_verification.py"]

[cache.retention.debug]
prune_after_days = 14
prunable = true

[cache.retention.release]
prune_after_days = 30
prunable = true

[cache.retention.cross-target]
prune_after_days = 30
prunable = true

[cache.retention.tmp]
prune_after_days = 1
prunable = true

[cache.retention.other]
prunable = false
