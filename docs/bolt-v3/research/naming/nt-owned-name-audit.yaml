# Bolt-v3 NT-owned naming audit
#
# Purpose:
#   Keep raw NautilusTrader facts named like the pinned NT Rust API, while
#   allowing Bolt-derived and venue/product-owned facts to keep explicit
#   Bolt/venue/product names.
#
# Scope:
#   Top-level bolt-v3 docs, bolt-v3 research artifacts, implementation
#   files, fixtures, and tests scanned by scripts/verify_bolt_v3_naming.py.

schema_version: 1
nautilus_trader_revision: "fa3391d90c1aace4733fc73dae082b4cfee6b8fa"

rules:
  - id: nt_owned_name_wins
    text: "If a field represents an NT-owned fact, use the pinned NT Rust field/type/method name."
  - id: derived_fields_must_be_traceable
    text: "If a field is Bolt-derived, keep a Bolt name but cite enough NT keys to find the raw NT fact."
  - id: venue_product_fields_stay_explicit
    text: "If a field is venue/product-owned, keep the venue/product prefix instead of pretending NT owns it."

renamed_in_current_audit:
  - from: trader_identifier
    to: trader_id
    owner: nt_owned
    nt_evidence: "nautilus_model::identifiers::TraderId; NT event/report fields use trader_id"
  - from: event_timestamp_milliseconds
    to: ts_event
    owner: nt_owned
    nt_evidence: "NautilusTrader custom-data and data/events use ts_event"
  - from: nautilus_up_instrument_id
    to: up_instrument_id
    owner: nt_owned_with_product_role
    nt_evidence: "nautilus_model::identifiers::InstrumentId; up is the product role"
  - from: nautilus_down_instrument_id
    to: down_instrument_id
    owner: nt_owned_with_product_role
    nt_evidence: "nautilus_model::identifiers::InstrumentId; down is the product role"
  - from: post_only
    to: is_post_only
    owner: nt_owned
    nt_evidence: "NT order construction uses is_post_only"
  - from: reduce_only
    to: is_reduce_only
    owner: nt_owned
    nt_evidence: "NT order construction uses is_reduce_only"
  - from: quote_quantity
    to: is_quote_quantity
    owner: nt_owned
    nt_evidence: "NT OrderCore field and Order trait method use is_quote_quantity"
  - from: strategy_instance_identifier
    to: strategy_instance_id
    owner: bolt_derived
    nt_evidence: "Not an NT StrategyId; operator-facing Bolt strategy instance identity"
  - from: release_identifier
    to: release_id
    owner: bolt_derived
    nt_evidence: "Not an NT field; Bolt release-manifest identity"

defensive_forbidden:
  - from: instrument_identifier
    to: instrument_id
    reason: "Common stale alias for nautilus_model::identifiers::InstrumentId"
  - from: venue_order_identifier
    to: venue_order_id
    reason: "Common stale alias for nautilus_model::identifiers::VenueOrderId"

path_scoped_forbidden:
  - from: venue_name
    to: venue
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - docs/bolt-v3/research/runtime-capture/*.yaml
      - config/**/*.toml
      - contracts/**/*.toml
      - tests/**/*.toml
      - tests/fixtures/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Bolt-v3 client config stores the NT Venue identifier in `venue`; venue_name remains valid in older non-v3 source surfaces"
  - from: venue_config_key
    to: execution_client_id
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Bolt-v3 strategy routing uses NT ClientId vocabulary; execution_client_id is the configured execution client reference"
  - from: venue_key
    to: client_key
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Bolt-v3 `[clients.<id>]` table keys are client keys; venue remains reserved for the NT Venue identifier"
  - from: validate_fake_provider_venue
    to: validate_fake_provider_client
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Provider-binding test helpers validate configured client blocks, not venue tables"
  - from: "|client_key, _venue|"
    to: "|client_key, _client|"
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Ignored closure/helper parameters over `[clients.<id>]` entries must use client vocabulary"
  - from: "|venue|"
    to: "|client|"
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Closures over `[clients.<id>]` entries must use client vocabulary"
  - from: "polymarket_main venue"
    to: "polymarket_main client"
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Fixture lookup text names the configured client key, not an NT Venue"
  - from: "non-polymarket venue"
    to: "non-polymarket client"
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Provider-binding tests route strategy execution_client_id references to configured clients"
  - from: BoltV3VenueAdapterConfig
    to: BoltV3ClientAdapterConfig
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Adapter mapping groups data/execution factories by configured client, not by NT Venue"
  - from: BoltV3RegisteredVenue
    to: BoltV3RegisteredClient
    include_globs:
      - src/bolt_v3_*.rs
      - tests/bolt_v3_*.rs
    reason: "Registration summaries describe NT client registration for configured clients"
  - from: ResolvedVenueSecrets
    to: ResolvedClientSecrets
    include_globs:
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Resolved SSM secret handles are keyed by configured client"
  - from: venue_kind
    to: venue
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Bolt-v3 client blocks store the NT Venue identifier in `venue`; operator-facing contracts should not call that value a kind"
  - from: "[venues."
    to: "[clients."
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - config/**/*.toml
      - contracts/**/*.toml
      - tests/bolt_v3_*.rs
      - tests/**/*.toml
      - tests/fixtures/**/*.toml
    reason: "Bolt-v3 config paths use `[clients.<id>]`; legacy `[venues.<id>]` table/path residues must fail source-fence"
  - from: update_instruments_interval_minutes
    to: update_instruments_interval_mins
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
      - tests/config_parsing.rs
      - tests/fixtures/**/*.toml
    reason: "PolymarketDataClientConfig owns update_instruments_interval_mins; minutes is an alias"
  - from: websocket_max_subscriptions_per_connection
    to: ws_max_subscriptions
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
      - tests/config_parsing.rs
      - tests/fixtures/**/*.toml
    reason: "PolymarketDataClientConfig owns ws_max_subscriptions; the long websocket alias is forbidden"
  - from: funder_address
    to: funder
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
      - tests/config_parsing.rs
      - tests/fixtures/**/*.toml
    reason: "PolymarketExecClientConfig owns funder; funder_address is an alias"
  - from: "timeout_shutdown ="
    to: "timeout_shutdown_secs ="
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
      - tests/config_parsing.rs
      - tests/fixtures/**/*.toml
    reason: "Bolt-v3 TOML stores second-valued runtime quantities with `_secs`; the Rust mapper converts to NT LiveNodeConfig.timeout_shutdown"
  - from: selected_market_observed_timestamp
    to: selected_market_observed_timestamp_ms
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Phase 8 selected-market observation timestamps are Unix milliseconds and must carry `_ms`"
  - from: price_to_beat_observed_timestamp
    to: price_to_beat_observed_timestamp_ms
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Price-to-beat observation timestamps are Unix milliseconds and must carry `_ms`"
  - from: seconds_to_expiry
    to: seconds_to_market_end
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Bolt-v3 binary-oracle canary evidence names the selected market boundary as market_end"
  - from: strategy_venue
    to: execution_client_id
    include_globs:
      - docs/bolt-v3/*.md
      - docs/bolt-v3/research/**/*.yaml
      - docs/bolt-v3/research/**/*.toml
      - src/bolt_v3_*.rs
      - src/bolt_v3_*/**/*.rs
      - tests/bolt_v3_*.rs
    reason: "Phase 8 evidence stores the strategy TOML execution_client_id, not an NT Venue"

