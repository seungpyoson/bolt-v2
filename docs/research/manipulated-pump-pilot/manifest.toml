[[gate]]
id = "cex_legal_retention"
mandatory = true
state = "partial"
evidence = "Tardis Terms clause 9.1 permits internal Permitted Use, Derived Data creation, and storage of Data and Manipulated Data on the customer system during the Term. Clause 13.6 does not clearly grant post-Term reuse of a standalone raw archive. CoinAPI grants Cloud Service use only during the subscription term and delegates external-source restrictions. Long-term raw replay remains unapproved."

[[gate]]
id = "cex_exact_coverage"
mandatory = true
state = "partial"
evidence = "Tardis machine-readable MYX metadata and public first-of-month files exist for selected venues. CoinAPI paid metadata covers all three target perpetuals and all six broad ranges; one exact Binance 2025-08-29 L2 object was proved. CoinAPI date-root listings are non-recursive, so the remaining venue/date/type tuples require billed drill-down calls."

[[gate]]
id = "cex_l2_fidelity"
mandatory = true
state = "partial"
evidence = "Tardis public files pass gzip/schema/hash checks but exact-window raw replay remains pending. CoinAPI's exact Binance incident file passed gzip/hash/schema checks but is rejected as canonical replay evidence: seven normalized fields omit sequence numbers, disconnect markers, and raw payloads; all 4,784,711 rows have empty order_id, with one exchange-time and two receipt-time reversals."

[[gate]]
id = "cex_l3_fidelity"
mandatory = false
state = "not_observed_in_reviewed_feeds"
evidence = "Reviewed public feeds and provider candidates for the selected target venues and period supplied market-by-price L2, not market-by-order evidence. Exact queue replay is unsupported by this record."

[[gate]]
id = "surf_onchain_identity"
mandatory = true
state = "passed_technical_sample"
evidence = "100/100 stratified SQL rows uniquely matched BNB Chain receipt logs, block hashes, transaction indices, event indices, contract, addresses, raw amounts, and block timestamps."

[[gate]]
id = "surf_onchain_completeness"
mandatory = true
state = "pending"
evidence = "Surf returned per-day counts for all six dates, but a second full-population indexed source or archival export has not established that every chain log is present. Receipt sampling proves identity, not recall."

[[gate]]
id = "surf_legal_retention"
mandatory = true
state = "failed_closed"
evidence = "No written permission yet for the intended commercial research, retained raw/normalized output, and automated use. Surf remains non-canonical until resolved."

[[gate]]
id = "historical_label_asof"
mandatory = true
state = "failed_closed"
evidence = "In 100 Surf-enriched transfers, only three distinct addresses were labeled and no label carried source, observation time, effective-time, or revision fields. No Arkham challenger sample is available. Labels are excluded from primary backtests."

[[gate]]
id = "nt_two_run_replay"
mandatory = true
state = "partial"
evidence = "Pinned NT e4167fd produced identical counts and serialized event hashes in two bounded runs over all nine public venue/type streams. Exact-window full replay and decision traces remain pending because the six source days are unavailable."

[[gate]]
id = "challenger_and_cost"
mandatory = true
state = "partial"
evidence = "A USD 5 CoinAPI credit pilot proved authenticated REST/S3 access and one exact 39,363,049-byte incident L2 file. CoinAPI's published Flat Files use case budgets API calls at 0.25 credit each; date-root listings return directory prefixes and require further billed drill-down. CoinAPI is cheaper than Tardis but fails the mandatory raw replay fidelity contract, so no further CoinAPI spend is recommended for canonical L2."

[[gate]]
id = "surf_chat_automation"
mandatory = false
state = "rejected_current_endpoint"
evidence = "The response to a requested fable-5 model reported surf-2.0; internal aliasing or execution is unknown and Fable 5 selectability remains unproved. Two xhigh manipulated-pump calls failed to produce a completed response within 1,200 seconds; the streaming response ended in an HTTP/2 internal error, response-ID retrieval returned 404, and credit-balance retrieval returned 401."

[[gate]]
id = "artifact_replayability"
mandatory = true
state = "failed_closed"
evidence = "Provider bytes are hash-only, ephemeral, discarded, or not durably retrievable without another paid request. The ledger cannot independently reproduce schema, counts, transformations, or replay and cannot admit a provider."

