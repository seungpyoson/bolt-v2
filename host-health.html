<!-- Reads JSONL from scripts/host_health_sampler.py; read-only / visibility-only. -->
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Host Health</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --ink: #152029;
      --grn: #16834a;
      --red: #c83232;
      --amb: #b36b00;
      --blu: #2468d8;
      --vio: #6d55c7;
      --line: #d7dde4;
      --muted: #637181;
      --surface: #ffffff;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      min-height: 76px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
      background: var(--surface);
    }

    h1,
    h2 {
      margin: 0;
      letter-spacing: 0;
    }

    h1 {
      font-size: 22px;
      line-height: 1.15;
    }

    h2 {
      font-size: 15px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .top-meta {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
    }

    .filepick {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 36px;
      padding: 0 14px;
      border: 1px solid var(--blu);
      border-radius: 6px;
      color: var(--blu);
      background: #f8fbff;
      cursor: pointer;
      font-weight: 650;
      white-space: nowrap;
    }

    .filepick input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    main {
      width: min(1180px, calc(100vw - 32px));
      margin: 18px auto 32px;
    }

    .section {
      margin-top: 14px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: var(--surface);
    }

    .section-head {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .subtle {
      color: var(--muted);
      font-size: 13px;
    }

    .summary {
      display: grid;
      grid-template-columns: repeat(6, minmax(120px, 1fr));
      gap: 10px;
    }

    .metric {
      min-width: 0;
      padding: 11px 12px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #fbfcfd;
    }

    .metric-label {
      color: var(--muted);
      font-size: 12px;
      text-transform: uppercase;
      overflow-wrap: anywhere;
    }

    .metric-value {
      margin-top: 6px;
      font-size: 18px;
      font-weight: 720;
      overflow-wrap: anywhere;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      padding: 0 9px;
      border-radius: 999px;
      color: #ffffff;
      font-weight: 720;
      max-width: 100%;
      overflow-wrap: anywhere;
    }

    .badge.grn {
      background: var(--grn);
    }

    .badge.red {
      background: var(--red);
    }

    .badge.amb {
      background: var(--amb);
    }

    .badge.blu {
      background: var(--blu);
    }

    .badge.vio {
      background: var(--vio);
    }

    .banner {
      border-color: rgba(200, 50, 50, 0.45);
      background: #fff7f6;
      color: #7b1d1d;
      font-weight: 720;
    }

    .banner[hidden] {
      display: none;
    }

    .chart-wrap {
      min-height: 300px;
    }

    svg {
      display: block;
      width: 100%;
      height: auto;
      min-height: 280px;
    }

    .axis {
      stroke: #91a0af;
      stroke-width: 1;
    }

    .grid {
      stroke: #e8edf2;
      stroke-width: 1;
    }

    .series-line {
      fill: none;
      stroke-width: 2.5;
      vector-effect: non-scaling-stroke;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .legend-swatch {
      width: 18px;
      height: 3px;
      border-radius: 999px;
    }

    .errors {
      margin: 0;
      padding-left: 18px;
      color: #6d3a00;
    }

    .empty {
      display: flex;
      align-items: center;
      min-height: 240px;
      color: var(--muted);
      border: 1px dashed var(--line);
      border-radius: 6px;
      padding: 16px;
    }

    @media (max-width: 880px) {
      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      main {
        width: min(100vw - 20px, 1180px);
      }

      .summary {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 520px) {
      .summary {
        grid-template-columns: 1fr;
      }

      .section {
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Host Health</h1>
      <div class="top-meta" id="fileMeta">&mdash;</div>
    </div>
    <label class="filepick">
      Load JSONL
      <input id="fileInput" type="file" accept=".jsonl,.ndjson,.txt,application/json">
    </label>
  </header>

  <main>
    <section class="section banner" id="eventBanner" hidden></section>

    <section class="section">
      <div class="section-head">
        <h2>Latest Sample</h2>
        <div class="subtle" id="sampleTime">&mdash;</div>
      </div>
      <div class="summary">
        <div class="metric">
          <div class="metric-label">service</div>
          <div class="metric-value" id="serviceState">&mdash;</div>
        </div>
        <div class="metric">
          <div class="metric-label">RSS</div>
          <div class="metric-value" id="rssValue">&mdash;</div>
        </div>
        <div class="metric">
          <div class="metric-label">MemAvailable</div>
          <div class="metric-value" id="memValue">&mdash;</div>
        </div>
        <div class="metric">
          <div class="metric-label">disk free</div>
          <div class="metric-value" id="diskValue">&mdash;</div>
        </div>
        <div class="metric">
          <div class="metric-label">auto-restarts (this invocation)</div>
          <div class="metric-value" id="restartValue">&mdash;</div>
        </div>
        <div class="metric">
          <div class="metric-label">host</div>
          <div class="metric-value" id="hostValue">&mdash;</div>
        </div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Memory / Process</h2>
        <div class="subtle" id="memoryRange">&mdash;</div>
      </div>
      <div class="chart-wrap" id="memoryChart"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Disk</h2>
        <div class="subtle" id="diskPath">&mdash;</div>
      </div>
      <div class="chart-wrap" id="diskChart"></div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Errors</h2>
        <div class="subtle" id="errorCount">&mdash;</div>
      </div>
      <ul class="errors" id="errorsList"></ul>
    </section>
  </main>

  <script>
    const EMPTY = "\u2014";
    const state = { records: [], parseErrors: [], fileName: "" };

    const elements = {
      fileInput: document.getElementById("fileInput"),
      fileMeta: document.getElementById("fileMeta"),
      sampleTime: document.getElementById("sampleTime"),
      serviceState: document.getElementById("serviceState"),
      rssValue: document.getElementById("rssValue"),
      memValue: document.getElementById("memValue"),
      diskValue: document.getElementById("diskValue"),
      restartValue: document.getElementById("restartValue"),
      hostValue: document.getElementById("hostValue"),
      eventBanner: document.getElementById("eventBanner"),
      memoryChart: document.getElementById("memoryChart"),
      diskChart: document.getElementById("diskChart"),
      memoryRange: document.getElementById("memoryRange"),
      diskPath: document.getElementById("diskPath"),
      errorCount: document.getElementById("errorCount"),
      errorsList: document.getElementById("errorsList")
    };

    elements.fileInput.addEventListener("change", event => {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        const parsed = parseJsonl(String(reader.result || ""));
        state.records = parsed.records;
        state.parseErrors = parsed.errors;
        state.fileName = file.name;
        render();
      };
      reader.readAsText(file);
    });

    function parseJsonl(text) {
      const records = [];
      const errors = [];
      // Strip a leading UTF-8 BOM (U+FEFF) so the first record is not dropped
      // (D5). Match it via the \uFEFF escape, never a literal invisible BOM
      // glyph in source — byte-identical match, but reviewable and copy-safe.
      text = text.replace(/^\uFEFF/, "");
      text.split(/\r?\n/).forEach((line, index) => {
        if (!line.trim()) return;
        let parsed;
        try {
          parsed = JSON.parse(line);
        } catch (error) {
          errors.push(`line ${index + 1}: ${error.message}`);
          return;
        }
        // A record must be a plain JSON object. A bare number/string/array/null
        // is valid JSON but not a sample row; accepting it would manufacture a
        // fake record that later crashes latest.service access (D6).
        if (typeof parsed === "object" && parsed !== null && !Array.isArray(parsed)) {
          records.push(parsed);
        } else {
          errors.push(`line ${index + 1}: not a JSON object`);
        }
      });
      return { records, errors };
    }

    function latestRecord() {
      return state.records.length ? state.records[state.records.length - 1] : null;
    }

    function formatBytes(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return EMPTY;
      const units = ["B", "KiB", "MiB", "GiB", "TiB"];
      let scaled = Number(value);
      let unitIndex = 0;
      while (Math.abs(scaled) >= 1024 && unitIndex < units.length - 1) {
        scaled /= 1024;
        unitIndex += 1;
      }
      const digits = scaled >= 100 || unitIndex === 0 ? 0 : 1;
      return `${scaled.toFixed(digits)} ${units[unitIndex]}`;
    }

    function formatNumber(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return EMPTY;
      return Number(value).toLocaleString();
    }

    function formatPct(value) {
      if (value === null || value === undefined || !Number.isFinite(Number(value))) return EMPTY;
      return `${Number(value).toFixed(1)}%`;
    }

    function arrayExtent(values) {
      // Min/max via a single accumulator pass — NOT Math.min(...values) /
      // Math.max(...values) (F). A long-running JSONL file makes `values` huge
      // (110K+ samples); spreading it as call arguments overflows V8's argument
      // limit and throws RangeError: Maximum call stack size exceeded, which
      // aborts render() mid-run and blanks the UI. A loop has no such ceiling.
      let lo = Infinity;
      let hi = -Infinity;
      for (const value of values) {
        if (value < lo) lo = value;
        if (value > hi) hi = value;
      }
      return { lo, hi };
    }

    function diskFreePct(disk) {
      // Derive free% from the same df-convention used_pct the disk CHART plots,
      // so card-free% + chart-used% == 100 (D3). A missing, non-finite, or
      // out-of-range used_pct yields null, which the render path surfaces as a
      // degraded (never green) badge. Guard the raw value first: Number(null) is
      // 0, which would wrongly read as a finite "100% free".
      if (!disk || disk.used_pct === null || disk.used_pct === undefined || disk.used_pct === "") {
        return null;
      }
      const usedPct = Number(disk.used_pct);
      if (!Number.isFinite(usedPct)) return null;
      if (usedPct < 0 || usedPct > 100) return null;
      return 100 - usedPct;
    }

    function diskBadgeClass(value) {
      // Any non-finite input (null/undefined/NaN) is an unknown/degraded disk
      // status, never green: a NaN previously slipped past `< 10`/`< 20` and
      // rendered GREEN (D1). Treat it as degraded BEFORE the numeric thresholds.
      if (!Number.isFinite(value)) return "vio";
      if (value < 10) return "red";
      if (value < 20) return "amb";
      return "grn";
    }

    function serviceBadge(record) {
      const service = record && record.service ? record.service : null;
      const active = service ? service.active_state : null;
      const sub = service ? service.sub_state : null;
      const text = [active, sub].filter(Boolean).join(" / ");

      // An OOM kill forces RED for ANY active_state (E2): a service that was
      // OOM-killed is degraded whether systemd now reports it inactive,
      // activating, active, or supplies no usable service state. Hoisting this
      // above the missing-data branch keeps the kill as the most important
      // signal.
      if (record && record.oom_killed === true) {
        return `<span class="badge red">${escapeHtml(text)}</span>`;
      }

      // No usable service data is a degraded/unknown state, never a blank dash
      // (item 5): a blank badge reads as "fine" at a glance. Show an explicit
      // degraded badge instead.
      if (serviceDataMissing(service)) {
        return `<span class="badge vio">service unknown</span>`;
      }

      let klass = "vio";
      if (active === "active") {
        // "active" is NOT unconditionally green (item 5): a service that is
        // active right now but failed its last run, restarted, or whose main
        // process has exited is degraded. Downgrade so none of those render
        // healthy green.
        const restarts = Number(service.n_restarts);
        if (isFailureResult(service.result)) {
          klass = "red";
        } else if (sub !== "running") {
          // active/exited, active/dead, etc.: systemd still calls the unit
          // active but its main process is not running. Not green (E1).
          klass = "amb";
        } else if (service.n_restarts !== null && service.n_restarts !== undefined && !Number.isFinite(restarts)) {
          // A PRESENT but non-finite/non-numeric n_restarts is suspect restart
          // data: treat unknown restart state as degraded, never green (E4).
          // A missing/null n_restarts (field absent) is acceptable and stays
          // eligible for green below.
          klass = "amb";
        } else if (Number.isFinite(restarts) && restarts > 0) {
          klass = "amb";
        } else {
          klass = "grn";
        }
      } else if (active === "failed") {
        klass = "red";
      } else if (active === "activating" || active === "deactivating") {
        klass = "amb";
      }
      // Record-level integrity caps green: a record the banner flags at the
      // record level (missing/unexpected schema_version, or sampler-reported
      // collector errors) must never render a healthy-green service badge, even
      // when the service block itself looks clean. Downgrade green to amber
      // (degraded) without weakening the OOM-red, service-unknown, or
      // failed/restart downgrades above. The text is unchanged; only the class
      // changes. Mirrors bannerReasons' schema/errors conditions via the shared
      // recordHasIntegrityIssue predicate.
      if (klass === "grn" && recordHasIntegrityIssue(record)) {
        klass = "amb";
      }
      return `<span class="badge ${klass}">${escapeHtml(text)}</span>`;
    }

    function restartIncreased(records) {
      // Single source of truth (G): delegate to counterIncreased so the
      // Number.isFinite finite-guard applies identically. Without it a
      // non-numeric n_restarts poisoned `previous`=NaN and silently disabled
      // restart-increase detection for the rest of the scan.
      return counterIncreased(records, record => record && record.service ? record.service.n_restarts : null);
    }

    function counterIncreased(records, pick) {
      // True if a monotonic per-record counter strictly increased across the
      // loaded records (same shape used for restarts and cgroup oom_kills).
      let previous = null;
      for (const record of records) {
        const raw = pick(record);
        if (raw === null || raw === undefined || !Number.isFinite(Number(raw))) continue;
        const current = Number(raw);
        if (previous !== null && current > previous) return true;
        previous = current;
      }
      return false;
    }

    function oomIncreased(records) {
      return counterIncreased(records, record => cgroupOomCount(record));
    }

    function cgroupOomCount(record) {
      // The cgroup oom_kill counter is at the record top level (always present),
      // mirrored under service for back-compat. Prefer the top-level field so the
      // count survives even when systemctl stalled and the service block is null
      // (the state where it would otherwise read as a misleading 0); fall back to
      // the nested value for older records that predate the top-level field.
      // Returns a Number, or NaN when no count is available.
      if (!record) return NaN;
      const top = record.cgroup_oom_kills;
      const topPresent = top !== null && top !== undefined;
      const svc = record.service;
      const nested = svc ? svc.cgroup_oom_kills : undefined;
      const nestedPresent = nested !== null && nested !== undefined;
      const topCount = Number(top);
      const nestedCount = Number(nested);
      if (topPresent && nestedPresent && Number.isFinite(topCount) && Number.isFinite(nestedCount)) {
        return Math.max(topCount, nestedCount);
      }
      if (topPresent) return topCount;
      if (nestedPresent) return nestedCount;
      return NaN;
    }

    // A systemd Result is degraded if it is present and anything OTHER than
    // "success". An allow-list of known-bad results (oom-kill/signal/...) is a
    // trap: any result not in the list (exit-code, timeout, resources, protocol,
    // assert, watchdog, future systemd values) would read as healthy. Treating
    // "anything that isn't success" as degraded is the safe default — a stale
    // failure latch in the LATEST sample is degraded regardless of in-file
    // change.
    function isFailureResult(result) {
      return Boolean(result) && result !== "success";
    }

    function serviceDataMissing(service) {
      // The service collector produced nothing usable: null block, or a block
      // with neither an active_state nor a sub_state (the two fields that make a
      // record interpretable). A no-service sample must NOT read as healthy.
      return !service || (!service.active_state && !service.sub_state);
    }

    function recordHasIntegrityIssue(record) {
      // Record-LEVEL integrity gate: true when the record is unusable or the
      // sampler itself reported trouble, independent of the service block. This
      // is the SINGLE SOURCE OF TRUTH for the schema_version + errors[]
      // conditions; bannerReasons derives its (richer-worded) schema/errors
      // pushes from the SAME conditions below so the badge and the banner can
      // never disagree. serviceBadge consumes this to cap a green badge: a
      // record the banner flags at the record level must never read as healthy
      // green (item: false-green while degraded).
      if (!record) return true;
      if (record.schema_version === undefined || record.schema_version === null) return true;
      if (record.schema_version !== 2) return true;
      if (Array.isArray(record.errors) && record.errors.length > 0) return true;
      return false;
    }

    function bannerReasons(latest, records) {
      // Pure: returns the list of human-readable banner reasons for a record set.
      // Kept testable so the false-green / standing-state cases are verifiable.
      const reasons = [];
      if (!latest) return reasons;
      // SINGLE SOURCE OF TRUTH: these schema_version + errors[] conditions are
      // exactly the record-level conditions in recordHasIntegrityIssue, which
      // serviceBadge uses to cap a green badge. The boolean gate lives there;
      // here we emit the richer human wording (missing vs unexpected schema,
      // error count). Keep the two in lockstep — any condition added here must
      // also flip recordHasIntegrityIssue, or the badge and banner will drift.
      // Preserve visibility for additive/future records, but fail loud when the
      // sample schema is not the schema-2 shape this viewer expects.
      if (latest.schema_version === undefined || latest.schema_version === null) {
        reasons.push("schema_version missing (viewer expects 2)");
      } else if (latest.schema_version !== 2) {
        reasons.push(`unexpected schema_version=${latest.schema_version} (viewer expects 2)`);
      }
      if (Array.isArray(latest.errors) && latest.errors.length) {
        reasons.push(`sampler reported ${latest.errors.length} collector error(s)`);
      }
      const service = latest.service || null;

      // OOM banner wording must name its EVIDENCE source (item 7): only a
      // systemd Result=oom-kill is authoritative; otherwise the sampler derived
      // OOM from an ambiguous result (signal/core-dump) corroborated by the
      // cgroup oom_kill counter, so say so rather than mislabel it as the
      // authoritative systemd verdict.
      if (latest.oom_killed === true) {
        const result = service ? service.result : null;
        const rawCgroup = cgroupOomCount(latest);
        const cgroupCount = Number.isFinite(rawCgroup) ? rawCgroup : 0;
        if (result === "oom-kill") {
          reasons.push("systemd Result=oom-kill (authoritative)");
        } else {
          reasons.push(
            `OOM detected (result=${result || "?"}, cgroup oom_kill=${cgroupCount})`
          );
        }
      }

      // A missing/unavailable service collector is itself a degraded signal
      // (item 5): surface it so a no-service sample still raises the banner.
      if (serviceDataMissing(service)) {
        reasons.push("service status unavailable");
      }

      // A null/absent disk block means the sampler could not stat the requested
      // catalog path (a vanished path is a serious degraded signal). render()
      // already shows a violet disk chip, but a quiet chip is easy to miss;
      // raise it in the banner too (E3), parallel to "service status
      // unavailable".
      if (latest.disk === null || latest.disk === undefined) {
        reasons.push("disk status unavailable");
      } else if (latest.disk.used_pct === null || latest.disk.used_pct === undefined) {
        reasons.push("disk metric unavailable");
      }

      // Standing degraded state from the latest sample (D2): flag it even when
      // nothing changed within the loaded file.
      if (service) {
        if (service.active_state === "failed") {
          reasons.push("service active_state=failed");
        }
        // Any non-success Result is degraded (item 6), not just an allow-list.
        if (isFailureResult(service.result)) {
          reasons.push(`service result=${service.result}`);
        }
        const restarts = Number(service.n_restarts);
        if (Number.isFinite(restarts) && restarts > 0) {
          reasons.push(`service auto-restarted ${restarts} time(s) this invocation`);
        }
      }

      // cgroup oom_kill: distinguish a fresh in-window kill from a stale latch
      // of the cumulative counter (D4).
      const cgroupOomKills = cgroupOomCount(latest);
      const cumulative = Number.isFinite(cgroupOomKills) ? cgroupOomKills : 0;
      if (oomIncreased(records)) {
        reasons.push(`cgroup oom_kill increased to ${cumulative} in this file`);
      } else if (cumulative > 0) {
        reasons.push(`cgroup oom_kill=${cumulative} (cumulative)`);
      }

      if (restartIncreased(records)) reasons.push("auto-restarts increased in this file");

      return reasons;
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({
        "&": "&amp;",
        "<": "&lt;",
        ">": "&gt;",
        "\"": "&quot;",
        "'": "&#39;"
      })[character]);
    }

    function render() {
      const latest = latestRecord();
      elements.fileMeta.textContent = state.fileName
        ? `${state.fileName} · ${state.records.length} samples`
        : EMPTY;

      elements.sampleTime.textContent = latest ? latest.sampled_at || EMPTY : EMPTY;
      elements.serviceState.innerHTML = latest ? serviceBadge(latest) : EMPTY;
      elements.rssValue.textContent = latest ? formatBytes(latest.process && latest.process.rss_bytes) : EMPTY;
      elements.memValue.textContent = latest ? formatBytes(latest.memory && latest.memory.mem_available_bytes) : EMPTY;

      const freePct = latest ? diskFreePct(latest.disk) : null;
      // An unknown/degraded disk status is a visible signal: show a degraded
      // (never green, never blank) badge rather than a silent dash (D1+D3).
      elements.diskValue.innerHTML = freePct === null
        ? `<span class="badge vio">${EMPTY}</span>`
        : `<span class="badge ${diskBadgeClass(freePct)}">${formatPct(freePct)}</span>`;

      elements.restartValue.textContent = latest && latest.service
        ? formatNumber(latest.service.n_restarts)
        : EMPTY;
      elements.hostValue.textContent = latest
        ? [latest.host, latest.platform].filter(Boolean).join(" / ") || EMPTY
        : EMPTY;

      renderBanner(latest);
      renderErrors(latest);
      renderCharts();
    }

    function renderBanner(latest) {
      if (!latest) {
        elements.eventBanner.hidden = true;
        elements.eventBanner.textContent = "";
        return;
      }
      const reasons = bannerReasons(latest, state.records);
      elements.eventBanner.hidden = reasons.length === 0;
      elements.eventBanner.textContent = reasons.length
        ? `Host health event visible: ${reasons.join(" · ")}`
        : "";
    }

    function renderErrors(latest) {
      // concat / per-element push, never push(...arr) or [...arr] (F): a large
      // parseErrors or latest.errors array spread as call arguments overflows
      // V8's argument limit and throws, blanking the errors section. concat and
      // a plain loop have no such ceiling.
      const allErrors = state.parseErrors.concat(
        latest && Array.isArray(latest.errors) ? latest.errors : []
      );
      elements.errorCount.textContent = allErrors.length ? `${allErrors.length} shown` : EMPTY;
      elements.errorsList.textContent = "";
      if (!allErrors.length) {
        const item = document.createElement("li");
        item.textContent = EMPTY;
        elements.errorsList.appendChild(item);
        return;
      }
      allErrors.forEach(error => {
        const item = document.createElement("li");
        item.textContent = error;
        elements.errorsList.appendChild(item);
      });
    }

    function renderCharts() {
      const latest = latestRecord();
      elements.memoryRange.textContent = state.records.length ? timeRangeText(state.records) : EMPTY;
      elements.diskPath.textContent = latest && latest.disk ? latest.disk.path || EMPTY : EMPTY;

      drawTimeSeries(elements.memoryChart, {
        records: state.records,
        unit: "bytes",
        formatter: formatBytes,
        series: [
          { name: "RSS", color: "var(--blu)", value: record => record.process && record.process.rss_bytes },
          { name: "MemAvailable", color: "var(--grn)", value: record => record.memory && record.memory.mem_available_bytes }
        ]
      });

      drawTimeSeries(elements.diskChart, {
        records: state.records,
        unit: "percent",
        yMin: 0,
        yMax: 100,
        formatter: formatPct,
        series: [
          { name: "Disk used", color: "var(--amb)", value: record => record.disk && record.disk.used_pct }
        ]
      });
    }

    function timeRangeText(records) {
      const first = records[0] && records[0].sampled_at;
      const last = records[records.length - 1] && records[records.length - 1].sampled_at;
      if (!first && !last) return EMPTY;
      if (first === last) return first || EMPTY;
      return `${first || EMPTY} to ${last || EMPTY}`;
    }

    function drawTimeSeries(container, config) {
      container.textContent = "";
      if (!config.records.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No samples loaded";
        container.appendChild(empty);
        return;
      }

      const width = 900;
      const height = 280;
      const pad = { left: 64, right: 24, top: 22, bottom: 44 };
      const plotWidth = width - pad.left - pad.right;
      const plotHeight = height - pad.top - pad.bottom;
      const values = [];
      const pointsBySeries = config.series.map(series => {
        const points = config.records.map((record, index) => {
          const raw = series.value(record);
          const value = raw === null || raw === undefined ? null : Number(raw);
          if (value !== null && Number.isFinite(value)) values.push(value);
          return { index, value };
        });
        return { ...series, points };
      });

      if (!values.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = EMPTY;
        container.appendChild(empty);
        return;
      }

      // arrayExtent replaces Math.min(...values)/Math.max(...values): the
      // spreads overflow the call-argument limit on a long file (F). The memory
      // chart still floors yMin at 0 (Math.min(0, lo)); an explicit config
      // yMin/yMax still wins.
      const extent = arrayExtent(values);
      let yMin = config.yMin !== undefined ? config.yMin : Math.min(0, extent.lo);
      let yMax = config.yMax !== undefined ? config.yMax : extent.hi;
      if (yMax === yMin) {
        yMax += 1;
        yMin = Math.max(0, yMin - 1);
      }

      const xFor = index => {
        if (config.records.length === 1) return pad.left + plotWidth / 2;
        return pad.left + index / (config.records.length - 1) * plotWidth;
      };
      const yFor = value => pad.top + (1 - (value - yMin) / (yMax - yMin)) * plotHeight;

      const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      svg.setAttribute("viewBox", `0 0 ${width} ${height}`);
      svg.setAttribute("role", "img");

      for (let tick = 0; tick <= 4; tick += 1) {
        const y = pad.top + tick / 4 * plotHeight;
        const grid = svgLine(pad.left, y, width - pad.right, y, "grid");
        svg.appendChild(grid);
        const label = document.createElementNS("http://www.w3.org/2000/svg", "text");
        const value = yMax - tick / 4 * (yMax - yMin);
        label.setAttribute("x", "8");
        label.setAttribute("y", String(y + 4));
        label.setAttribute("fill", "var(--muted)");
        label.setAttribute("font-size", "12");
        label.textContent = config.formatter(value);
        svg.appendChild(label);
      }

      svg.appendChild(svgLine(pad.left, pad.top, pad.left, height - pad.bottom, "axis"));
      svg.appendChild(svgLine(pad.left, height - pad.bottom, width - pad.right, height - pad.bottom, "axis"));

      pointsBySeries.forEach(series => {
        const pointText = series.points
          .filter(point => point.value !== null && Number.isFinite(point.value))
          .map(point => `${xFor(point.index).toFixed(2)},${yFor(point.value).toFixed(2)}`)
          .join(" ");
        if (!pointText) return;
        const polyline = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
        polyline.setAttribute("class", "series-line");
        polyline.setAttribute("stroke", series.color);
        polyline.setAttribute("points", pointText);
        svg.appendChild(polyline);
      });

      const firstLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
      firstLabel.setAttribute("x", String(pad.left));
      firstLabel.setAttribute("y", String(height - 16));
      firstLabel.setAttribute("fill", "var(--muted)");
      firstLabel.setAttribute("font-size", "12");
      firstLabel.textContent = shortTime(config.records[0].sampled_at);
      svg.appendChild(firstLabel);

      const lastLabel = document.createElementNS("http://www.w3.org/2000/svg", "text");
      lastLabel.setAttribute("x", String(width - pad.right));
      lastLabel.setAttribute("y", String(height - 16));
      lastLabel.setAttribute("text-anchor", "end");
      lastLabel.setAttribute("fill", "var(--muted)");
      lastLabel.setAttribute("font-size", "12");
      lastLabel.textContent = shortTime(config.records[config.records.length - 1].sampled_at);
      svg.appendChild(lastLabel);

      container.appendChild(svg);
      const legend = document.createElement("div");
      legend.className = "legend";
      config.series.forEach(series => {
        const item = document.createElement("span");
        item.className = "legend-item";
        const swatch = document.createElement("span");
        swatch.className = "legend-swatch";
        swatch.style.background = series.color;
        item.appendChild(swatch);
        item.appendChild(document.createTextNode(series.name));
        legend.appendChild(item);
      });
      container.appendChild(legend);
    }

    function svgLine(x1, y1, x2, y2, className) {
      const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
      line.setAttribute("x1", String(x1));
      line.setAttribute("y1", String(y1));
      line.setAttribute("x2", String(x2));
      line.setAttribute("y2", String(y2));
      line.setAttribute("class", className);
      return line;
    }

    function shortTime(value) {
      if (!value) return EMPTY;
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return value;
      return date.toISOString().slice(11, 19);
    }

    render();
  </script>
</body>
</html>
