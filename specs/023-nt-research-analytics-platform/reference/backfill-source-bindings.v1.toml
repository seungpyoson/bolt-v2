schema_version = "backfill-source-bindings.v1"
contract_version = "backfill-table-contract.v1"

[default_window]
start_utc = "2025-06-01T00:00:00Z"
end_utc = "2026-06-01T00:00:00Z"

[durable_operator]

[[durable_operator.capability]]
identity = "csv-native-trades-to-canonical-trades.v1"
version = "1"
table_family = "trades"

[[source_binding]]
key = "binance-spot-instruments"
venue = "binance"
product_family = "spot"
fixture = "mixed"
family = "instrument_universe"
method = "GET"
source_uri = "https://api.binance.com/api/v3/exchangeInfo"
payload_extension = "json"
extractor = "binance_exchange_info"
evidence_state = "directly_backfillable"
table_families = ["instruments"]

[[source_binding]]
key = "binance-spot-native-trades"
venue = "binance"
product_family = "spot"
market_structure_fixture = "perps-spot"
fixture = "native-trades"
family = "market_data"
method = "GET"
source_uri = "https://data.binance.vision/data/spot/daily/trades/{symbol}/{symbol}-trades-{dt}.zip"
payload_extension = "zip"
extractor = "binance_data_vision_spot_trades"
evidence_state = "directly_backfillable"
warning = "Registry binding only; no Binance trade object is accepted for BTE until source proof, sample schema, checksum/hash, license, and NT mapping checks pass. Aggregated trades must not satisfy this native-trades binding."
table_families = ["trades"]

