# Backtesting Engine proof fixtures (spec 023, BTE-003).
#
# Single source of truth for every runtime value the Gate proof feeds NautilusTrader:
# the market-family instrument specs, venue/account selection, starting balances,
# and the synthetic data points. The Rust proof only chooses which NT constructor
# to call (by `kind`) and maps enum/currency codes to NT types — it holds no venue,
# price, currency, or quantity literals. This realises the BTE-003 requirement:
# "venue/provider selected only through TOML/registry bindings".

# Gate-2 S3 interface target. Synthetic bucket — never provisioned, never contacted
# (object_store's S3 builder is lazy; construction touches no network).
s3_proof_uri = "s3://example-bte-proof/nt-catalog"

[[family]]
label = "binary-option"
fixture = "binary option"
kind = "binary_option"
instrument_id = "0xPROOF-OUTCOME-YES.POLYMARKET"
symbol = "0xPROOF-OUTCOME-YES"
asset_class = "alternative"
quote_currency = "USDC"
activation_ns = 1699304047000000000
expiration_ns = 1708729140000000000
outcome = "YES"
price_increment = "0.001"
size_increment = "0.01"
venue = "POLYMARKET"
account_type = "cash"
venue_base_currency = "USDC"
starting_balance = "1000000 USDC"
trade_price = "0.450"
trade_size = "10.00"
book_bid = "0.440"
book_ask = "0.460"

