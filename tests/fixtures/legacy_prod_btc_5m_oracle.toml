# FROZEN REGRESSION ORACLE — DO NOT DEPLOY, DO NOT EDIT THE BODY (issue #768).
#
# This is the pre-refactor standalone BTC 5m production profile, kept verbatim ONLY
# as a behavior-preservation oracle. The test
# `composed_config_matches_frozen_legacy_oracle` proves that composing the tracked
# overlay `config/profiles/prod-btc-5m.overlay.toml` onto its base `config/root.toml`
# loads to the SAME effective `BoltV3RootConfig` as this file — i.e. the base+overlay
# refactor changed the config's shape, not its meaning.
#
# It lives under tests/fixtures/ (NOT config/) on purpose: deploy tooling must never
# pick it up as a runtime config. The live production config is now
# `config/profiles/prod-btc-5m.overlay.toml` composed onto `config/root.toml`. Edit
# those (in a reviewed PR), not this oracle. Touch the body below only if you have a
# deliberate, reviewed reason to re-baseline the equivalence target.
#
# Re-baseline log:
# - 2026-06-19 (#768): absorbed the RV-source-validation fix ("Fix RV source asset
#   validation", merged into the branch from main) into the BTC surface sources —
#   added per-source `canonical_base_asset` and corrected the Binance/Bybit
#   `instrument_id`s (BTC-USDT.BINANCE -> BTCUSDT.BINANCE, BTC-USDT.BYBIT ->
#   BTCUSDT-SPOT.BYBIT). The composed prod config must adopt that upstream
#   correctness fix, so the oracle's BTC sources are kept value-equal to
#   config/root.toml's `btc_usdt_midpoint_rv` sources.
# - 2026-06-20 (#768): absorbed the disabled `[risk.kill_switch]` block added to
#   the shared base `config/root.toml` by the production kill-switch merge. The
#   overlay does not touch this block, so the composed prod config inherits it
#   verbatim. Kept value-equal to root.toml.
# - 2026-06-20 (#768): absorbed the #855 PolyResearch endpoint/root-shape merge.
#   The composed prod config inherits the verified endpoint and the BTC-only
#   Chainlink catalog/gate binding now present in `config/root.toml`.
# - 2026-06-20 (#870): re-baselined after BTC production disabled the legacy
#   `[reference_live_probe]` and dropped `polyresearch_reference` from active
#   BTC clients. Current-price readiness is now checked through the Chainlink-only
#   `reference-current-price-health` ExecStartPre.
# - 2026-06-25 (#711): re-baselined only the root schema version from 1 to 2
#   after the capital-admission config-key migration. Effective runtime values are
#   still compared against the composed config below.
# - 2026-07-10 (#1349): absorbed the non-enforcing Polymarket settlement-currency
#   capital pool inherited from `config/root.toml`. It supplies pUSD identity for
#   load-time settlement validation without arming submit admission.
#
# Non-secret only: every credential is an SSM parameter reference; the Polymarket
# `funder` is a public on-chain Safe address.
